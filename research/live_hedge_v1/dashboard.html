<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQQ Live Hedge Desk V2</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1320px;margin:20px auto;padding:0 18px;background:#0b0f14;color:#e6edf3}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
h1,h2{margin:0 0 10px} h2{font-size:18px}
pre{white-space:pre-wrap;word-break:break-word;margin:0}
.action-card{border-width:2px}
.action{padding:12px;border:1px solid #444;border-radius:8px;margin:7px 0;background:#0e141b}
.meta{color:#8b949e;font-size:12px;letter-spacing:.04em}
.big{font-size:24px;font-weight:750}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
button{padding:8px 12px;border-radius:7px;border:1px solid #484f58;background:#21262d;color:#e6edf3;cursor:pointer}
button:hover{background:#30363d}
table{width:100%;border-collapse:collapse} td,th{padding:8px;border-bottom:1px solid #30363d;text-align:left;vertical-align:top}
.good{font-weight:700}.warn{font-weight:700}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h1>QQQ LIVE HEDGE DESK V2</h1><a href="http://127.0.0.1:8766/research/strategy_instance_v1/operator_dashboard.html" target="_blank" rel="noopener" style="padding:9px 12px;border:1px solid #484f58;border-radius:8px;background:#21262d;color:#e6edf3;text-decoration:none">OPEN OPERATOR CONSOLE ↗</a></div>
<div id="app">loading…</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const n=v=>v==null?'NA':Number(v).toFixed(4);
const usd=v=>v==null||typeof v!=='number'?'NA':(v<0?'-$':'+$')+Math.abs(v).toFixed(2);
const qty=v=>v==null?'NA':String(Number(v));
async function copyText(text){
  try{await navigator.clipboard.writeText(String(text||''));alert('Instruction copied');}
  catch(_){alert(String(text||''));}
}
function actionCard(ac,s){
  if(!ac||ac.action==='HOLD'){
    return '<div class="card action-card"><div class="meta">PRIMARY ACTION</div><div class="big">HOLD</div><div>No ticket is waiting for manual execution.</div></div>';
  }
  let legs=(ac.legs||[]).map(l=>'<tr><td>'+esc(l.code)+'</td><td>'+esc(l.side)+'</td><td>'+esc(qty(l.qty))+'</td><td>'+esc(qty(l.before_qty))+' → '+esc(qty(l.target_qty))+'</td><td>'+esc(n(l.price))+'</td></tr>').join('');
  const instr=s.instruction||ac.action;
  return '<div class="card action-card"><div class="grid">'+
    '<div><div class="meta">ACTION</div><div class="big">'+esc(ac.action)+' · '+esc(ac.status)+'</div><div class="mono">'+esc(ac.ticket_id||'—')+'</div></div>'+
    '<div><div class="meta">REASON</div><div>'+esc(ac.reason||'—')+'</div><div class="meta" style="margin-top:8px">ISSUED</div><div>'+esc(ac.issued_at||'—')+'</div></div></div>'+
    '<table><tr><th>Code</th><th>Broker Side</th><th>Qty</th><th>Position</th><th>Indicative</th></tr>'+legs+'</table>'+
    '<div class="action"><div class="meta">MANUAL INSTRUCTION</div><div class="mono">'+esc(instr)+'</div><div style="margin-top:8px"><button onclick="copyText('+JSON.stringify(instr)+')">COPY INSTRUCTION</button></div></div>'+
    '<div class="meta">No order is submitted by this page. Execute in Futu, then let the next cycle reconcile the broker position.</div></div>';
}
async function load(){
  try{
    const r=await fetch('live_state.json?ts='+Date.now());
    const s=await r.json();
    const c=s.campaign||{}, ac=s.action_card||{}, pm=s.position_mark||{}, rs=s.risk_state||{}, pa=s.position_analysis||{}, mk=s.market||{};
    const farc=s.far||{}, nearc=s.near_candidate||{};
    let h='<div class="grid">';
    h+='<div class="card"><div class="meta">DESK STATUS</div><div class="big">'+esc(s.status)+'</div><div>'+esc(s.instruction)+'</div></div>';
    h+='<div class="card"><div class="meta">SIGNAL / MARKET</div><div><strong>spot '+n(mk.spot)+'</strong></div><div>signal='+esc(String(mk.signal_active??'—'))+'</div><div>ratio52='+esc(n(mk.ratio52))+' · ext200='+esc(n(mk.ext200))+'</div></div>';
    h+='<div class="card"><div class="meta">STRATEGY POSITION</div><div>far CALL '+esc(qty(pa.far_short_contracts))+' / '+esc(qty(pa.far_short_target_contracts))+' · gap '+esc(qty(pa.far_short_gap_contracts))+'</div><div>near CALL '+esc(qty(pa.near_call_contracts))+' / '+esc(qty(pa.near_call_target_contracts))+' · gap '+esc(qty(pa.near_call_gap_contracts))+'</div><div>campaign='+esc(c.state||'IDLE')+'</div></div>';
    h+='<div class="card"><div class="meta">POSITION MARK</div><div class="big">'+esc(usd(pm.unrealized_pnl))+'</div><div>realized = '+esc(String(pm.realized_pnl||'NOT_TRACKED_BY_LIVE_DESK'))+'</div><div>mark status = '+esc(pm.status||'—')+'</div></div>';
    h+='</div>';
    if(!c.id && (Object.keys(farc).length || Object.keys(nearc).length)){
      h+='<div class="card"><h2>ENTRY WATCH — NO ACTIVE CAMPAIGN</h2><div class="grid"><div><div class="meta">FAR CANDIDATE</div><div class="mono">'+esc(farc.code||'—')+'</div><div>strike '+esc(n(farc.strike))+' · DTE '+esc(qty(farc.dte))+' · Δ '+esc(n(farc.delta))+'</div><div>bid/ask '+esc(n(farc.bid))+' / '+esc(n(farc.ask))+'</div></div><div><div class="meta">NEAR CANDIDATE</div><div class="mono">'+esc(nearc.code||'—')+'</div><div>strike '+esc(n(nearc.strike))+' · DTE '+esc(qty(nearc.dte))+' · Δ '+esc(n(nearc.delta))+'</div><div>bid/ask '+esc(n(nearc.bid))+' / '+esc(n(nearc.ask))+'</div></div></div></div>';
    }
    h+=actionCard(ac,s);
    h+='<div class="card"><h2>Strategy / Operator Separation</h2><div class="grid"><div><div class="meta">LOCKED STRATEGY ENGINE</div><div>Alpha parameters remain frozen. The dashboard exposes the engine ticket and broker reconciliation state.</div></div><div><div class="meta">ADJUSTABLE MANUAL BOOK</div><div>Use <span class="mono">strategy_instance_v1 manual</span> to record your independent ADD / REDUCE path. Its P&amp;L is deliberately kept separate from broker-observed P&amp;L.</div></div></div></div>';
    h+='<div class="card"><h2>Candidate Actions</h2><table><tr><th>Action</th><th>Code</th><th>Qty</th><th>Side</th><th>Why</th></tr>';
    (s.candidate_actions||[]).forEach(x=>h+='<tr><td><strong>'+esc(x.action)+'</strong></td><td>'+esc(x.code||'—')+'</td><td>'+esc(x.qty??x.target_qty??'—')+'</td><td>'+esc(x.side||'—')+'</td><td>'+esc(x.why||'—')+'</td></tr>');
    h+='</table></div>';
    h+='<div class="card"><h2>Next Triggers</h2><table><tr><th>Trigger</th><th>When</th><th>Effect</th></tr>';
    (s.next_triggers||[]).forEach(x=>h+='<tr><td>'+esc(x.type)+'</td><td>'+esc(x.when)+'</td><td>'+esc(x.effect)+'</td></tr>');
    h+='</table></div>';
    h+='<div class="grid">';
    h+='<div class="card"><h2>Far</h2><pre>'+esc(JSON.stringify(s.far,null,2))+'</pre></div>';
    h+='<div class="card"><h2>Near Candidate</h2><pre>'+esc(JSON.stringify(s.near_candidate,null,2))+'</pre></div>';
    h+='</div>';
    h+='<div class="card"><h2>Managed Positions / Lots</h2><pre>'+esc(JSON.stringify({positions:s.positions,lots:s.lots},null,2))+'</pre></div>';
    h+='<div class="card"><h2>Position Mark Detail</h2><pre>'+esc(JSON.stringify(pm.rows||[],null,2))+'</pre></div>';
    h+='<div class="card"><h2>Reasons</h2><pre>'+esc(JSON.stringify(s.reasons||[],null,2))+'</pre></div>';
    h+='<div class="card"><h2>Latest Events</h2><pre>'+esc(JSON.stringify(s.reconcile_events||[],null,2))+'</pre></div>';
    document.getElementById('app').innerHTML=h;
  }catch(e){document.getElementById('app').innerHTML='<div class="card"><strong>Dashboard read error</strong><pre>'+esc(String(e))+'</pre></div>';}
}
load(); setInterval(load,5000);
</script>
</body>
</html>
