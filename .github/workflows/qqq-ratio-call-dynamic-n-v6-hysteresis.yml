name: QQQ Ratio-Call Dynamic N V6 Hysteresis

on:
  push:
    branches:
      - research/qqq-ratio-call-harvest-v1-20260929
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqq-ratio-call-dynamic-n-v6-hysteresis
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          gh release download data-v1 \
            --repo lambdaclass/options_portfolio_backtester \
            --pattern "QQQ_options.parquet" \
            --pattern "QQQ_underlying.parquet" \
            --dir data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run frozen Dynamic-N V6 hysteresis
        run: |
          python research/qqq_ratio_call_dynamic_n_v6_hysteresis.py \
            --data-dir data \
            --out artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-ratio-call-dynamic-n-v6-hysteresis
          path: artifacts/
          if-no-files-found: error
