name: Backtest V2.2

on:
  workflow_dispatch:
  push:
    paths:
      - "src/lib/pulse/backtest.ts"
      - "src/lib/pulse/protected.ts"
      - "src/lib/pulse/black-scholes.ts"
      - "src/lib/pulse/bars.ts"
      - "src/data/universe.json"
      - "scripts/run-backtest.ts"
      - ".github/workflows/backtest.yml"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          if npm ci --no-audit --no-fund; then
            echo "npm ci ok"
          else
            echo "lockfile out of sync; falling back to npm install"
            npm install --no-audit --no-fund
          fi
      - name: Run backtest engine
        run: npm run backtest
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v2-2
          path: |
            artifacts/backtest-result.json
            artifacts/backtest-curve.csv
            artifacts/backtest-report.md
            src/data/backtest-v2-2.json
