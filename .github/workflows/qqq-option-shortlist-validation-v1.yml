name: QQQ Option Shortlist Validation V1

on:
  push:
    branches:
      - research/qqq-option-shortlist-validation-v1
    paths:
      - research/qqq_option_shortlist_validation_v1/validate_qqq_option_shortlist_v1.py
      - research/qqq_option_shortlist_validation_v1/test_validate_qqq_option_shortlist_v1.py
      - research/qqq_option_shortlist_validation_v1/README.md
      - .github/workflows/qqq-option-shortlist-validation-v1.yml

permissions:
  contents: write
concurrency:
  group: qqq-option-shortlist-validation-v1
  cancel-in-progress: false
jobs:
  validation:
    name: Locked QQQ option replay robustness audit (Linux BOT)
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        name: Checkout validation branch
      - name: Compile and run offline tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/qqq_option_shortlist_validation_v1/validate_qqq_option_shortlist_v1.py
          python3 research/qqq_option_shortlist_validation_v1/test_validate_qqq_option_shortlist_v1.py
      - name: Run locked-input audit
        run: |
          set -euo pipefail
          python3 research/qqq_option_shortlist_validation_v1/validate_qqq_option_shortlist_v1.py --out research/qqq_option_shortlist_validation_v1/results/local-run
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("research/qqq_option_shortlist_validation_v1/results/local-run")
          m=json.loads((p/"manifest.json").read_text())
          assert m["input_trades_git_blob_sha1"]=="ba5fc1fa0fabf8cd914735503905cac6ee1f631e"
          assert m["unique_signal_dates"]==28
          with (p/"cost_time_split_summary.csv").open(newline="") as f: rows=list(csv.DictReader(f))
          assert len(rows)==14*3*3, len(rows)
          with (p/"paired_call_hedge_summary.csv").open(newline="") as f: paired=list(csv.DictReader(f))
          assert len(paired)==3 and int(paired[1]["paired_events"])==24
          print("Locked input, 126 rows and 24 paired events: PASS")
          PY
      - name: Persist auditable outputs to research branch
        if: success()
        run: |
          set -euo pipefail
          dest="research/qqq_option_shortlist_validation_v1/results/run-$GITHUB_RUN_ID"
          mkdir -p "$dest"
          cp -a research/qqq_option_shortlist_validation_v1/results/local-run/. "$dest/"
          rm -rf research/qqq_option_shortlist_validation_v1/results/local-run
          printf 'tested_sha=%s\nrun_id=%s\nrunner_name=%s\nsource_run_id=39003581461\nscope=research-only; no orders; no live policy changes\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_NAME" > "$dest/RECOVERY_META.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_option_shortlist_validation_v1/results
          git commit -m "research output: QQQ option shortlist validation run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
