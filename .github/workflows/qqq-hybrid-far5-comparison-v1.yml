name: QQQ Hybrid FAR5 vs FAR10 Comparison V1

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - research/qqq-hybrid-far5-comparison-v1-20261002

permissions:
  contents: read

concurrency:
  group: qqq-hybrid-far5-comparison-v1-20261002
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy
      - name: Verify fixture
        run: |
          sha256sum src/data/universe.json
          python - <<'PY'
          import json
          d=json.load(open('src/data/universe.json',encoding='utf-8'))
          print("dates", len(d["dates"]), "QQQ", len(d["c"]["QQQ"]), "VXX", len(d["c"]["VXX"]), "VIX", len(d["c"]["VIX"]))
          PY
      - name: Run frozen FAR5 vs FAR10 comparison
        run: |
          python research/qqq_hybrid_far5_comparison_v1.py             --spots-path src/data/universe.json             --out artifacts
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-hybrid-far5-vs-far10
          path: artifacts/
          if-no-files-found: error
