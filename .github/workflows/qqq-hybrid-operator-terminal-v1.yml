name: QQQ Hybrid Operator Terminal V1

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - research/qqq-hybrid-vxx-short-call-put-v1-20261009
    paths:
      - research/qqq_hybrid_operator_terminal_v1/**
      - .github/workflows/qqq-hybrid-operator-terminal-v1.yml

permissions:
  contents: read

concurrency:
  group: qqq-hybrid-operator-terminal-v1
  cancel-in-progress: false

jobs:
  engine-qa:
    name: Hybrid reverse sizing / contracts / Windows smoke
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime
        run: |
          node --version || exit /b 1
          py -3 --version || exit /b 1

      - name: JavaScript syntax and golden cases
        run: |
          node --check research\qqq_hybrid_operator_terminal_v1\engine.js || exit /b 1
          node --check research\qqq_hybrid_operator_terminal_v1\app.js || exit /b 1
          node --check research\qqq_hybrid_operator_terminal_v1\hub_research_pack.js || exit /b 1
          node --check research\qqq_hybrid_operator_terminal_v1\hub_research_pack_ui.js || exit /b 1
          node research\qqq_hybrid_operator_terminal_v1\tests\engine.test.cjs || exit /b 1
          node research\qqq_hybrid_operator_terminal_v1\tests\hub_research_pack.test.cjs || exit /b 1

      - name: Python server syntax
        run: |
          py -3 -m py_compile research\qqq_hybrid_operator_terminal_v1\server.py || exit /b 1

      - name: Static asset / boundary contract
        run: |
          py -3 -c "from pathlib import Path; p=Path('research/qqq_hybrid_operator_terminal_v1'); required=['index.html','app.js','engine.js','styles.css','server.py','README.md','hub_research_pack.html','hub_research_pack.js','hub_research_pack_ui.js','tests/engine.test.cjs','tests/hub_research_pack.test.cjs','tests/fixtures/user_uploaded_option_chain_2026-11-20.json']; missing=[x for x in required if not (p/x).is_file()]; assert not missing, 'missing files: '+repr(missing); s=(p/'server.py').read_text(encoding='utf-8'); assert 'place_order' not in s and 'unlock_trade' not in s and '/api/journal' in s; e=(p/'engine.js').read_text(encoding='utf-8'); assert e.count('mainBudgetEligible: true') == 2; h=(p/'index.html').read_text(encoding='utf-8'); assert 'current-qqqShares' in h and 'current-vxxShortShares' in h and 'Set current quantity = 1000' in h and 'OUTSIDE MAIN BUDGET' in h; assert 'proDashboard' in h and 'proRiskDonut' in h and 'proAllocationRows' in h; assert 'id="vxxPutRiskPct"' not in h and 'data-find="vxxPut"' not in h; a=(p/'app.js').read_text(encoding='utf-8'); assert 'function renderProDashboard(result, input)' in a and 'renderProDashboard(result, input)' in a and 'vxxPutRiskPct:p.' not in a; print('terminal_asset_contract=PASS')" || exit /b 1

      - name: Write QA summary
        run: |
          if not exist artifacts\qqq_hybrid_operator_terminal_v1 mkdir artifacts\qqq_hybrid_operator_terminal_v1
          echo QQQ_HYBRID_OPERATOR_TERMINAL_V1=PASS>artifacts\qqq_hybrid_operator_terminal_v1\qa_summary.txt
          echo broker_orders=FALSE>>artifacts\qqq_hybrid_operator_terminal_v1\qa_summary.txt
          echo sizing=CAPITAL_FIRST_MAIN_SELLER_WHITELIST>>artifacts\qqq_hybrid_operator_terminal_v1\qa_summary.txt

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: qqq-hybrid-operator-terminal-v1-qa
          path: artifacts\qqq_hybrid_operator_terminal_v1\qa_summary.txt
          if-no-files-found: error
          retention-days: 30
