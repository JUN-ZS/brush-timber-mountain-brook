name: QQQ Event-Driven Risk-Budget Portfolio Replay V1

on:
  push:
    branches:
      - research/qqq-option-shortlist-replay-v1
    paths:
      - research/qqq_option_portfolio_sizing_v1/risk_budget_portfolio_replay_v1.py
      - research/qqq_option_portfolio_sizing_v1/test_risk_budget_portfolio_replay_v1.py
      - research/qqq_option_portfolio_sizing_v1/README.md
      - .github/workflows/qqq-risk-budget-portfolio-replay-v1.yml

permissions:
  contents: write

concurrency:
  group: qqq-risk-budget-portfolio-replay-v1
  cancel-in-progress: false

jobs:
  replay:
    name: Risk-budgeted QQQ Core plus Options account replay (Linux BOT)
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Runtime, pinned reader, and offline contract tests
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0
          .venv/bin/python -m py_compile research/qqq_option_portfolio_sizing_v1/risk_budget_portfolio_replay_v1.py
          .venv/bin/python research/qqq_option_portfolio_sizing_v1/test_risk_budget_portfolio_replay_v1.py
      - name: Verify and reuse full-history QQQ option cache
        run: |
          set -euo pipefail
          mkdir -p .cache
          cache_dir="$HOME/.cache/qqq-options-full-history"
          mkdir -p "$cache_dir"
          rm -rf .cache/qqq-options-full-history
          ln -s "$cache_dir" .cache/qqq-options-full-history
          find "$cache_dir" -maxdepth 1 -type f -printf '%f %s bytes\n' | head -20 || true
      - name: Run NAV-sized portfolio replay across budgets and costs
        timeout-minutes: 75
        run: |
          set -euo pipefail
          OUT="artifacts/qqq_option_portfolio_sizing_v1"
          mkdir -p "$OUT"
          .venv/bin/python research/qqq_option_portfolio_sizing_v1/risk_budget_portfolio_replay_v1.py --out "$OUT" | tee QQQ_RISK_BUDGET_PORTFOLIO_RUN.json
          test -s "$OUT/manifest.json"
          test -s "$OUT/summary.csv"
          test -s "$OUT/annual_returns.csv"
          test -s "$OUT/trade_ledger.csv"
          test -s "$OUT/daily_nav.csv.gz"
          test -s "$OUT/REPORT.md"
          .venv/bin/python - <<'PY'
          import csv, json
          from pathlib import Path
          out=Path("artifacts/qqq_option_portfolio_sizing_v1")
          manifest=json.loads((out/"manifest.json").read_text())
          assert manifest["source_option_terminal_date"] == "2025-12-15"
          assert manifest["max_abs_nav_reconciliation_error_usd"] < 0.01
          rows=list(csv.DictReader((out/"summary.csv").open()))
          assert len(rows) == 43, f"expected 43 account rows, got {len(rows)}"
          assert any(r["strategy_id"] == "CORE_ONLY" for r in rows)
          print("portfolio manifest, 43-account summary, source end, and NAV reconciliation=PASS")
          print((out/"REPORT.md").read_text())
          PY
      - name: Persist audited outputs without Actions artifact quota
        if: success()
        run: |
          set -euo pipefail
          dest="research/qqq_option_portfolio_sizing_v1/results/run-$GITHUB_RUN_ID-$GITHUB_SHA"
          mkdir -p "$dest"
          cp -a artifacts/qqq_option_portfolio_sizing_v1/. "$dest/"
          cp QQQ_RISK_BUDGET_PORTFOLIO_RUN.json "$dest/runner_stdout.json"
          {
            printf 'tested_sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_url=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'source_branch=%s\n' "$GITHUB_REF_NAME"
          } > "$dest/RECOVERY_META.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          git commit -m "research output: QQQ risk-budget portfolio replay $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
