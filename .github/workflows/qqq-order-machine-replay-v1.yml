name: QQQ Order Machine Replay V2

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/data/universe.json"
      - "src/lib/floor/order-machine.ts"
      - "src/lib/floor/yahoo-live.ts"
      - "src/lib/floor/deployment.ts"
      - "scripts/run-qqq-order-machine-replay-v1.ts"
  workflow_dispatch:

concurrency:
  group: qqq-order-machine-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    name: QQQ Order Machine / parent-intent contract replay
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
      - name: Run deterministic parent-intent contract replay
        run: |
          rm -rf "$RUNNER_TEMP/qqq-order-machine-replay"
          node --experimental-strip-types scripts/run-qqq-order-machine-replay-v1.ts "$RUNNER_TEMP/qqq-order-machine-replay"
      - name: Upload replay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-order-machine-replay-v2
          path: |
            ${{ runner.temp }}/qqq-order-machine-replay/RESULTS_ORDER_MACHINE_REPLAY.json
            ${{ runner.temp }}/qqq-order-machine-replay/RESULTS_ORDER_MACHINE_REPLAY.csv
          if-no-files-found: error
