name: DTE45 single-position 12k feasibility replay

on:
  push:
    branches:
      - research/dte45-single-position-12k-feasibility-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/dte45_single_position_replay_v1.py
      - .github/workflows/dte45-single-position-12k-feasibility-v1.yml

permissions:
  contents: write

concurrency:
  group: dte45-single-position-12k-feasibility-v1
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install pinned parquet dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-dte45
          .venv-dte45/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0

      - name: Run isolated no-overlap DTE45 exits
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-dte45/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          ROOT="$BASE/results/dte45_single_position_12k_v1"
          CACHE="$HOME/.cache/qqq-spy-dte45-single-v1"
          mkdir -p "$ROOT"
          "$PY" -m py_compile "$BASE/qqq_spy_put_premium_matched_phase_v1.py" "$BASE/dte45_single_position_replay_v1.py"

          for RULE in 5 10 20 20_or_dte_le_7; do
            TARGET="$ROOT/exit_$RULE"
            if test -s "$TARGET/SINGLE_POSITION_REPORT.md" && test -s "$TARGET/summary.json" && test -s "$TARGET/trade_episodes.csv"; then
              echo "Reusing committed completed exit-$RULE output."
              continue
            fi
            "$PY" "$BASE/dte45_single_position_replay_v1.py" \
              --exit-rule "$RULE" \
              --start 2018-03-01 --end 2025-12-15 \
              --max-total-contracts 10 --entry-filter none --sizing-mode fixed_ratio \
              --fixed-long-qty 1 --fixed-short-qty 6 --target-delta 0.25 \
              --dte-min 30 --dte-max 60 --dte-target 45 --cohort-stride-sessions 1 \
              --qqq-cache "$CACHE/qqq" --spy-cache "$CACHE/spy" --out "$TARGET"
            for FILE in entry_cohort.csv trade_episodes.csv scheduled_signal_skips.csv summary.json summary.md source_manifest.json SINGLE_POSITION_REPORT.md; do
              test -s "$TARGET/$FILE"
            done
          done

          "$PY" - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/qqq_spy_put_fixed_ratio_size_gated_v1/results/dte45_single_position_12k_v1")
          expected={"5":"HOLD_5_SESSIONS","10":"HOLD_10_SESSIONS","20":"HOLD_20_SESSIONS","20_or_dte_le_7":"HOLD_20_OR_DTE_LE_7"}
          for rule,policy in expected.items():
              out=root/f"exit_{rule}"
              d=json.loads((out/"summary.json").read_text())
              assert d["status"].startswith("COMPLETED"), (rule,d["status"])
              assert d["ratio"]["fixed_long_qqq_contracts"] == 1
              assert d["ratio"]["fixed_short_spy_contracts"] == 6
              assert d["selection"]["dte_target"] == 45
              assert d["selection"]["dte_min"] == 30 and d["selection"]["dte_max"] == 60
              assert d["selection"]["allow_overlapping_cohorts"] is False
              assert set(d["policies"]) == {policy}, (rule,d["policies"].keys())
              p=d["policies"][policy]
              assert p["opened"] > 0
              print("rule",rule,"entered",d["cohort"]["entered_cohorts"],
                    "resolved",p["resolved"],"unresolved",p["unresolved"],
                    "total_net",p["total_net_pnl_usd"],
                    "expectancy",p["expectancy_net_usd"],
                    "worst",p["worst_net_usd"],"win_rate",p["win_rate_pct"])
          PY

      - name: Commit DTE45 single-position outputs
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/qqq_spy_put_fixed_ratio_size_gated_v1/results/dte45_single_position_12k_v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No generated DTE45 output changes."
            exit 0
          fi
          git commit -m "Publish DTE45 single-position feasibility results"
          git push origin "HEAD:$GITHUB_REF_NAME"
