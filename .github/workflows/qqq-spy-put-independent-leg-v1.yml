name: QQQ/SPY Independent Leg Sizing V1
on:
  push:
    branches:
      - research/qqq-put-spy-independent-leg-sizing-v1
    paths:
      - research/qqq_spy_put_independent_leg_v1/*.py
      - research/qqq_spy_put_independent_leg_v1/CONTRACT.md
      - .github/workflows/qqq-spy-put-independent-leg-v1.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qqq-spy-independent-leg-sizing-v1
  cancel-in-progress: false
jobs:
  sizing-grid:
    name: Offline-tested standalone legs and fixed-N cross-grid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python runtime
        run: python3 --version
      - name: Compile and run offline tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/qqq_spy_put_independent_leg_v1/qqq_spy_put_independent_leg_sizing_v1.py
          python3 -m py_compile research/qqq_spy_put_independent_leg_v1/test_qqq_spy_put_independent_leg_sizing_v1.py
          python3 research/qqq_spy_put_independent_leg_v1/test_qqq_spy_put_independent_leg_sizing_v1.py
      - name: Generate frozen-input sizing grid
        run: |
          set -euo pipefail
          python3 research/qqq_spy_put_independent_leg_v1/qqq_spy_put_independent_leg_sizing_v1.py \
            --trades research/qqq_spy_put_equal_premium_v1/results/latest/trade_episodes.csv \
            --summary-json research/qqq_spy_put_equal_premium_v1/results/latest/summary.json \
            --out research/qqq_spy_put_independent_leg_v1/results/latest \
            --max-total-contracts 9 --max-leg-contracts 9
          test -s research/qqq_spy_put_independent_leg_v1/results/latest/summary.md
          test -s research/qqq_spy_put_independent_leg_v1/results/latest/independent_leg_sizing.csv
          test -s research/qqq_spy_put_independent_leg_v1/results/latest/fixed_pair_cross_grid.csv
          test -s research/qqq_spy_put_independent_leg_v1/results/latest/premium_matched_baseline.csv
          test -s research/qqq_spy_put_independent_leg_v1/results/latest/source_manifest.json
          cat research/qqq_spy_put_independent_leg_v1/results/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit generated report and grids
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_spy_put_independent_leg_v1/results/latest
          if git diff --cached --quiet; then
            echo "Generated outputs are already committed and unchanged."
            exit 0
          fi
          git commit -m "research: record independent QQQ and SPY put size grids"
          git push origin HEAD:research/qqq-put-spy-independent-leg-sizing-v1
