name: QQQ Ratio-Call Harvest N=1..6 Research

on:
  push:
    branches:
      - research/qqq-ratio-call-harvest-n1-6-20261002
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qqq-ratio-call-harvest-n1-6-20261002
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy

      - name: Download canonical QQQ data-v1 release
        run: |
          mkdir -p data
          gh release download data-v1             --repo lambdaclass/options_portfolio_backtester             --pattern "QQQ_options.parquet"             --pattern "QQQ_underlying.parquet"             --dir data
          ls -lh data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run frozen N=1..6 comparison
        run: |
          python research/qqq_ratio_call_harvest_v1.py             --data-dir data             --n 1 2 3 4 5 6             --out artifacts

      - name: Upload N=1..6 research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-ratio-call-harvest-n1-6
          path: artifacts/
          if-no-files-found: error
