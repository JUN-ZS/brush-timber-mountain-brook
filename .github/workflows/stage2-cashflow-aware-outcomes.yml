name: Stage 2 no-withdrawal floor-first QQQ-SPY outcomes

on:
  pull_request:
    paths:
      - "research/audit_stage2/cashflow_aware_qqq_spy.py"
      - "research/audit_stage2/test_cashflow_aware_qqq_spy.py"
      - "research/audit_stage2/chart_exploration.py"
      - "research/audit_stage2/test_chart_exploration.py"
      - "research/audit_stage2/stock_bond_glidepath_backtest.py"
      - "research/audit_stage2/test_stock_bond_glidepath_backtest.py"
      - "research/audit_stage2/glidepath_decision_report.py"
      - "research/audit_stage2/test_glidepath_decision_report.py"
      - "research/audit_stage2/glidepath_interactive_dashboard.py"
      - "research/audit_stage2/test_glidepath_interactive_dashboard.py"
      - "research/audit_stage2/interactive_dashboard_runtime_smoke.js"
      - "research/audit_stage2/CASHFLOW_AWARE_OUTCOMES.md"
      - "research/audit_stage2/CASHFLOW_CHART_EXPLORATION.md"
      - ".github/workflows/stage2-cashflow-aware-outcomes.yml"
      - "artifacts/pulse_v2/data_market_data.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce cash-flow scenarios and chart lab on Linux BOT
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 20
    steps:
      - name: Checkout pinned repository state
        uses: actions/checkout@v4

      - name: Run cash-flow lifecycle tests
        run: python3 -m unittest discover -s research/audit_stage2 -p 'test_cashflow_aware_qqq_spy.py' -v

      - name: Run chart exploration tests
        run: python3 -m unittest discover -s research/audit_stage2 -p 'test_chart_exploration.py' -v

      - name: Run historical stock-to-bond glidepath unit tests
        run: python3 -m unittest discover -s research/audit_stage2 -p 'test_stock_bond_glidepath_backtest.py' -v

      - name: Run default no-withdrawal and capital-floor scenario grid
        run: |
          python3 research/audit_stage2/cashflow_aware_qqq_spy.py \
            --input artifacts/pulse_v2/data_market_data.csv \
            --out /tmp/cashflow-aware-summary.json \
            --rows-out /tmp/cashflow-aware-windows.csv

      - name: Run an explicit deferred and step-up cash-flow example
        run: |
          python3 research/audit_stage2/cashflow_aware_qqq_spy.py \
            --input artifacts/pulse_v2/data_market_data.csv \
            --flows-csv research/audit_stage2/example_delayed_stepup_schedule.csv \
            --out /tmp/cashflow-aware-stepped-summary.json \
            --rows-out /tmp/cashflow-aware-stepped-windows.csv

      - name: Generate the five-chart SVG and HTML exploration pack
        run: |
          python3 research/audit_stage2/chart_exploration.py \
            --input artifacts/pulse_v2/data_market_data.csv \
            --flows-csv research/audit_stage2/example_delayed_stepup_schedule.csv \
            --outdir /tmp/cashflow-chart-lab

      - name: Download adjusted ETF histories and run 30%-100% stock-to-bond backtests
        run: |
          python3 research/audit_stage2/stock_bond_glidepath_backtest.py \
            --flows-csv research/audit_stage2/example_delayed_stepup_schedule.csv \
            --outdir /tmp/stock-bond-glidepath

      - name: Generate objective-based conclusions and risk-return frontier
        run: |
          python3 -m unittest discover -s research/audit_stage2 -p 'test_glidepath_decision_report.py' -v
          python3 research/audit_stage2/glidepath_decision_report.py --outdir /tmp/stock-bond-glidepath

      - name: Test and generate interactive drag-bar dashboard
        run: |
          python3 -m unittest discover -s research/audit_stage2 -p 'test_glidepath_interactive_dashboard.py' -v
          python3 research/audit_stage2/glidepath_interactive_dashboard.py --outdir /tmp/stock-bond-glidepath
          node research/audit_stage2/interactive_dashboard_runtime_smoke.js /tmp/stock-bond-glidepath/interactive_dashboard.html

      - name: Validate pinned replay and chart contracts
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          expected_sha = "c9e369c8a3789c543c05fafa82ed67589c1292a7bd423f2ef9990313825f5127"
          report = json.loads(Path("/tmp/cashflow-aware-summary.json").read_text(encoding="utf-8"))
          assert report["schema"] == "cashflow-aware-investor-outcomes.v2"
          assert report["input"]["actual_sha256"] == expected_sha
          assert report["input"]["monthly_observations"] == 331
          assert report["method"]["rolling_windows_per_scenario"] == 211
          summaries = report["scenario_summaries"]
          assert len(summaries) == 2
          assert all(row["rolling_windows"] == 211 for row in summaries)
          for ticker in ("QQQ", "SPY"):
              zero = next(row for row in summaries if row["ticker"] == ticker and row["scenario"] == "no_withdrawals")
              assert zero["windows_with_any_unfunded_withdrawal"] == 0
              assert zero["median_investor_xirr"] is not None
              assert abs(zero["median_investor_xirr"] - zero["median_underlying_price_cagr"]) < 1e-5
          floors = report["capital_floor_summaries"]
          assert len(floors) == 4
          assert all(row["floor_face_usd_at_maturity"] == 100000.0 for row in floors)
          assert all(row["windows_floor_not_met_by_model_before_tax_costs"] == 0 for row in floors)
          assert all(row["growth_sleeve_initial_capital_usd"] > 0 for row in floors)
          assert report["method"]["default_cashflow_behavior"].startswith("No deposit or withdrawal")
          base_rows = Path("/tmp/cashflow-aware-windows.csv").read_text(encoding="utf-8").splitlines()
          assert len(base_rows) == 1 + (2 + 4) * 211

          stepped = json.loads(Path("/tmp/cashflow-aware-stepped-summary.json").read_text(encoding="utf-8"))
          assert stepped["schema"] == "cashflow-aware-investor-outcomes.v2"
          assert stepped["input"]["actual_sha256"] == expected_sha
          assert stepped["method"]["custom_schedule_rows"] == 9
          assert len(stepped["scenario_summaries"]) == 2
          assert len(stepped["capital_floor_summaries"]) == 4
          assert all(row["cashflow_mode"] == "custom_schedule" for row in stepped["capital_floor_summaries"])
          assert all(row["windows_floor_not_met_by_model_before_tax_costs"] == 0 for row in stepped["capital_floor_summaries"])
          assert all(row["floor_payment_used_for_spending"] is False for row in stepped["capital_floor_summaries"])
          stepped_rows = Path("/tmp/cashflow-aware-stepped-windows.csv").read_text(encoding="utf-8").splitlines()
          assert len(stepped_rows) == 1 + (2 + 4) * 211

          outdir = Path("/tmp/cashflow-chart-lab")
          chart = json.loads((outdir / "chart_summary.json").read_text(encoding="utf-8"))
          assert chart["schema"] == "cashflow-visual-exploration.v1"
          assert chart["input"]["sha256"] == expected_sha
          assert chart["input"]["monthly_observations"] == 331
          assert chart["input"]["rolling_ten_year_windows"] == 211
          assert len(chart["chart_files"]) == 5
          glidepaths = chart["glidepath_scenarios"]
          assert [row["target_conversion_percent"] for row in glidepaths] == [30, 40, 50, 60, 70, 80, 90, 100]
          for row in glidepaths:
              assert len(row["stocks"]) == 11 and len(row["bonds"]) == 11
              assert row["stocks"][0] == 100 and row["bonds"][0] == 0
              assert abs(row["stocks"][-1] + row["bonds"][-1] - 100) < 1e-9
              assert abs(row["bonds"][-1] - row["target_conversion_percent"]) < 1e-9
          for filename in chart["chart_files"]:
              body = (outdir / filename).read_text(encoding="utf-8")
              assert body.startswith("<svg ") and body.rstrip().endswith("</svg>"), filename
              assert len(body) > 1000, filename
          assert (outdir / "index.html").stat().st_size > 10000
          ranges = list(csv.DictReader((outdir / "cashflow_outcome_ranges.csv").open(encoding="utf-8")))
          assert len(ranges) == 8, len(ranges)
          for row in ranges:
              assert int(row["rolling_windows"]) == 211
              assert float(row["p05_terminal_nav_usd"]) <= float(row["median_terminal_nav_usd"]) <= float(row["p95_terminal_nav_usd"])
          assert chart["assumptions"]["withdrawal_events"] == 9
          assert chart["assumptions"]["withdrawal_sum_usd"] == 12800.0
          assert chart["assumptions"]["deposit_sum_usd"] == 5000.0
          glide = json.loads(Path("/tmp/stock-bond-glidepath/stock_bond_glidepath_summary.json").read_text(encoding="utf-8"))
          assert glide["schema"] == "stock-bond-glidepath-backtest.v1"
          assert glide["data"]["raw_panel_canonical_sha256"]
          assert glide["data"]["daily_common_observations"] > 5000
          assert glide["data"]["common_month_end_observations"] == 277
          assert glide["data"]["last_common_date"] == "2026-09-30"
          assert glide["method"]["rolling_windows_per_scenario"] == 157
          assert glide["method"]["rolling_windows_per_scenario"] > 100
          scenarios = glide["scenarios"]
          assert len(scenarios) == 768, len(scenarios)
          assert {row["bond_proxy"] for row in scenarios} == {"AGG", "SHY", "IEF", "TLT"}
          assert {row["target_bond_conversion_pct_at_year10"] for row in scenarios} == {30, 40, 50, 60, 70, 80, 90, 100}
          assert {row["timing_rule"] for row in scenarios} == {"front_fast", "front_loaded", "linear", "mid_loaded", "back_loaded", "back_late"}
          assert {row["cashflow_mode"] for row in scenarios} == {"no_withdrawals", "delayed_stepup_example", "monthly_withdrawal_500_usd_stress", "monthly_withdrawal_1000_usd_stress"}
          assert len(glide["annual_scenarios"]) == 8448
          assert {row["year"] for row in glide["annual_scenarios"]} == set(range(11))
          annual = glide["annual_scenarios"]
          year0 = next(row for row in annual if row["year"] == 0 and row["bond_proxy"] == "AGG" and row["target_bond_conversion_pct_at_year10"] == 60 and row["timing_rule"] == "linear" and row["cashflow_mode"] == "no_withdrawals")
          year9 = next(row for row in annual if row["year"] == 9 and row["bond_proxy"] == "AGG" and row["target_bond_conversion_pct_at_year10"] == 60 and row["timing_rule"] == "linear" and row["cashflow_mode"] == "no_withdrawals")
          year10 = next(row for row in annual if row["year"] == 10 and row["bond_proxy"] == "AGG" and row["target_bond_conversion_pct_at_year10"] == 60 and row["timing_rule"] == "linear" and row["cashflow_mode"] == "no_withdrawals")
          assert year0["median_nav_usd"] == 100000.0 and year0["median_target_bond_weight"] == 0.0
          assert abs(year9["median_target_bond_weight"] - 0.54) < 1e-9 and abs(year9["median_target_stock_weight"] - 0.46) < 1e-9
          assert abs(year10["median_target_bond_weight"] - 0.60) < 1e-9 and abs(year10["median_target_stock_weight"] - 0.40) < 1e-9
          assert year9["median_nav_usd"] != year10["median_nav_usd"]
          terminal = next(row for row in scenarios if row["bond_proxy"] == "AGG" and row["target_bond_conversion_pct_at_year10"] == 60 and row["timing_rule"] == "linear" and row["cashflow_mode"] == "no_withdrawals")
          assert abs(year10["median_nav_usd"] - terminal["median_terminal_nav_usd"]) < 0.02
          assert all(abs(row["median_target_bond_weight"] + row["median_target_stock_weight"] - 1.0) < 1e-12 for row in annual)
          for row in scenarios:
              assert row["rolling_windows"] == glide["method"]["rolling_windows_per_scenario"]
              assert row["p05_terminal_nav_usd"] <= row["median_terminal_nav_usd"] <= row["p95_terminal_nav_usd"]
              assert row["median_daily_max_drawdown"] <= 0
          bond_rows = Path("/tmp/stock-bond-glidepath/stock_bond_glidepath_windows.csv").read_text(encoding="utf-8").splitlines()
          assert len(bond_rows) == 1 + 768 * glide["method"]["rolling_windows_per_scenario"]
          panel = Path("/tmp/stock-bond-glidepath/historical_adjusted_close_panel.csv").read_text(encoding="utf-8")
          import hashlib
          assert hashlib.sha256(panel.encode("utf-8")).hexdigest() == glide["data"]["raw_panel_canonical_sha256"]
          for name in ("01_terminal_wealth.svg", "02_daily_drawdown.svg", "03_time_weighted_cagr.svg", "04_withdrawal_shortfall_sample.svg", "05_withdrawal_shortfall_500.svg", "06_withdrawal_shortfall_1000.svg", "07_risk_return_frontier.svg"):
              chart_body = (Path("/tmp/stock-bond-glidepath") / name).read_text(encoding="utf-8")
              assert chart_body.startswith("<svg ") and chart_body.rstrip().endswith("</svg>")
              assert len(chart_body) > 1000, name
          assert (Path("/tmp/stock-bond-glidepath/index.html")).stat().st_size > 10000
          assert (Path("/tmp/stock-bond-glidepath/decision_summary.md")).stat().st_size > 2000
          assert (Path("/tmp/stock-bond-glidepath/interactive_dashboard.html")).stat().st_size > 200000
          interactive = Path("/tmp/stock-bond-glidepath/interactive_dashboard.html").read_text(encoding="utf-8")
          for token in ('id="target"', 'id="year"', 'id="heatMetric"', 'id="histMetric"', 'id="cohortMetric"', 'id="wealth"', 'id="drawdown"', 'id="returns"', 'id="gaps"', 'id="frontier"', 'id="flows"', 'id="glide"', 'id="table"', 'id="fan"', 'id="drawdownPath"', 'id="heatmap"', 'id="histogram"', 'id="cohort"', 'id="cohortDetail"', 'id="exportMatrix"', 'id="exportAnnual"'):
              assert token in interactive, token
          assert "__HIST__" not in interactive
          assert "__COHORT__" not in interactive
          assert "function cohortChart(s)" in interactive
          assert "COHORT.filter(" in interactive
          assert interactive.count('"bond_proxy"') >= 300
          histogram_report = json.loads(Path("/tmp/stock-bond-glidepath/window_distribution_summary.json").read_text(encoding="utf-8"))
          assert histogram_report["schema"] == "stock-bond-glidepath-window-distributions.v1"
          assert histogram_report["rolling_windows_per_scenario"] == 157
          assert len(histogram_report["distributions"]) == 768 * 4
          assert set(histogram_report["metric_names"]) == {"terminal_nav_usd", "time_weighted_cagr", "daily_max_drawdown", "withdrawal_shortfall_usd"}
          for distribution in histogram_report["distributions"]:
              assert 0 <= distribution["n"] <= 157
              if distribution["n"]:
                  assert distribution["min"] <= distribution["p05"] <= distribution["median"] <= distribution["p95"] <= distribution["max"]
                  assert 1 <= len(distribution["bins"]) <= 18
                  assert sum(item["count"] for item in distribution["bins"]) == distribution["n"]
          assert len({(d["bond_proxy"], d["target_bond_conversion_pct_at_year10"], d["timing_rule"], d["cashflow_mode"], d["metric"]) for d in histogram_report["distributions"]}) == 768 * 4

          cohort_report = json.loads(Path("/tmp/stock-bond-glidepath/window_start_cohort_summary.json").read_text(encoding="utf-8"))
          assert cohort_report["schema"] == "stock-bond-glidepath-start-cohorts.v1"
          assert cohort_report["rolling_windows_per_scenario"] == 157
          cohorts = cohort_report["cohorts"]
          assert len(cohorts) >= 768
          cohort_keys = {(row["bond_proxy"], row["target_bond_conversion_pct_at_year10"], row["timing_rule"], row["cashflow_mode"], row["start_year"]) for row in cohorts}
          assert len(cohort_keys) == len(cohorts), "duplicate start-year cohort key"
          cohort_windows = {}
          for row in cohorts:
              key = (row["bond_proxy"], row["target_bond_conversion_pct_at_year10"], row["timing_rule"], row["cashflow_mode"])
              assert row["window_count"] > 0
              assert row["first_window_start"][:4] == str(row["start_year"])
              assert row["last_window_start"][:4] == str(row["start_year"])
              assert row["first_window_start"] <= row["last_window_start"]
              assert row["windows_with_withdrawal_shortfall"] <= row["window_count"]
              if row["median_terminal_nav_usd"] is not None and row["p05_terminal_nav_usd"] is not None:
                  assert row["p05_terminal_nav_usd"] <= row["median_terminal_nav_usd"] <= row["p95_terminal_nav_usd"]
              if row["median_daily_max_drawdown"] is not None and row["worst_daily_max_drawdown"] is not None:
                  assert row["worst_daily_max_drawdown"] <= row["median_daily_max_drawdown"]
              cohort_windows[key] = cohort_windows.get(key, 0) + row["window_count"]
          assert len(cohort_windows) == 768
          assert all(n == 157 for n in cohort_windows.values()), "start-year cohorts must conserve all rolling windows"
          assert "median_target_bond_weight" in interactive
          assert "W(s.target,y,m)" not in interactive
          decision = glide["decision_summary"]
          assert decision["no_withdrawal_configurations"] == 192
          assert all(item["configurations"] == 192 for item in decision["withdrawal_stress"].values())
          assert len(decision["agg_linear_target_scan"]) == 8
          assert len(decision["agg_60_timing_comparison"]) == 6
          assert len(decision["pareto_frontier"]) > 0
          assert set(decision["withdrawal_stress"]) == {"delayed_stepup_example", "monthly_withdrawal_500_usd_stress", "monthly_withdrawal_1000_usd_stress"}
          assert "不保證" in (Path("/tmp/stock-bond-glidepath/decision_summary.md")).read_text(encoding="utf-8")
          assert glide["cashflow_schedule"]["rows"] == 9
          assert glide["cashflow_schedule"]["withdrawal_total_usd"] == 12800.0
          assert glide["cashflow_schedule"]["deposit_total_usd"] == 5000.0
          print("PASS: 768 scenarios, 8,448 annual summaries, 3,072 outcome histograms, start-year cohorts conserving all 157 windows per strategy; linked views, CSV exports and pinned replay contracts")
          PY

      - name: Upload research results and chart pack
        uses: actions/upload-artifact@v4
        with:
          name: stage2-cashflow-floor-stock-bond-glidepath
          path: |
            /tmp/cashflow-aware-summary.json
            /tmp/cashflow-aware-windows.csv
            /tmp/cashflow-aware-stepped-summary.json
            /tmp/cashflow-aware-stepped-windows.csv
            /tmp/cashflow-chart-lab/index.html
            /tmp/cashflow-chart-lab/chart_summary.json
            /tmp/cashflow-chart-lab/cashflow_outcome_ranges.csv
            /tmp/cashflow-chart-lab/*.svg
            /tmp/stock-bond-glidepath/index.html
            /tmp/stock-bond-glidepath/stock_bond_glidepath_summary.json
            /tmp/stock-bond-glidepath/decision_summary.md
            /tmp/stock-bond-glidepath/interactive_dashboard.html
            /tmp/stock-bond-glidepath/window_distribution_summary.json
            /tmp/stock-bond-glidepath/window_start_cohort_summary.json
            /tmp/stock-bond-glidepath/stock_bond_glidepath_windows.csv
            /tmp/stock-bond-glidepath/historical_adjusted_close_panel.csv
            /tmp/stock-bond-glidepath/*.svg
          if-no-files-found: error
          retention-days: 14
