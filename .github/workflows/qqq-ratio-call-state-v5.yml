name: QQQ Ratio-Call State Machine V5 Delta Ladder

on:
  push:
    branches:
      - research/qqq-ratio-call-state-v5-20260929
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqq-ratio-call-state-v5
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V5 branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          gh release download data-v1 \
            --repo lambdaclass/options_portfolio_backtester \
            --pattern "QQQ_options.parquet" \
            --pattern "QQQ_underlying.parquet" \
            --dir data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run V5 delta ladder
        run: |
          python research/qqq_ratio_call_state_v5.py \
            --data-dir data \
            --out artifacts
      - name: Upload V5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-ratio-call-state-v5
          path: artifacts/
          if-no-files-found: error
