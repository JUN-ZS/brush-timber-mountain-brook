name: QQQ Dynamic Near-Long Harvest V21
on:
  push:
    branches:
      - research/qqq-dynamic-near-long-harvest-v21-20260930
    paths:
      - research/qqq_dynamic_near_long_harvest_v21.py
      - .github/workflows/qqq-dynamic-near-long-harvest-v21.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qqq-dynamic-near-long-harvest-v21
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/QQQ_options.parquet             https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet             https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
      - name: Run V21 dynamic harvest matrix
        run: |
          python research/qqq_dynamic_near_long_harvest_v21.py --data-dir data --out artifacts
          cat artifacts/v21_dynamic_harvest_result.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-dynamic-near-long-harvest-v21
          path: |
            artifacts/v21_dynamic_harvest_result.json
            artifacts/v21_dynamic_harvest_summary.csv
            artifacts/v21_dynamic_harvest_detail.csv
          if-no-files-found: error
