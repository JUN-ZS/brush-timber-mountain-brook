name: QQQ Dynamic Near-Long State Engine V22

on:
  push:
    branches:
      - research/qqq-dynamic-near-long-state-engine-v22-20260930
    paths:
      - research/qqq_dynamic_near_long_state_engine_v22.py
      - .github/workflows/qqq-dynamic-near-long-state-engine-v22.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqq-dynamic-near-long-state-engine-v22
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy

      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/QQQ_options.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet

      - name: Run V22 dynamic state matrix
        run: |
          python research/qqq_dynamic_near_long_state_engine_v22.py --data-dir data --out artifacts
          cat artifacts/v22_dynamic_state_result.json

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-dynamic-near-long-state-engine-v22
          path: |
            artifacts/v22_dynamic_state_result.json
            artifacts/v22_dynamic_state_summary.csv
            artifacts/v22_dynamic_state_detail.csv
          if-no-files-found: error

# V22 trigger commit: run the full dynamic-state matrix.
