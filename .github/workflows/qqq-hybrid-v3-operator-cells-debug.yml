name: QQQ Hybrid V3 Operator Cells Debug Exact

on:
  pull_request:
    paths:
      - "terminal/qqq_hybrid_deployment_terminal_v3/engine.js"
      - "terminal/qqq_hybrid_deployment_terminal_v3/app.js"
      - "terminal/qqq_hybrid_deployment_terminal_v3/index.html"
      - "terminal/qqq_hybrid_deployment_terminal_v3/debug_cells/**"
      - ".github/workflows/qqq-hybrid-v3-operator-cells-debug.yml"
  workflow_dispatch:

concurrency:
  group: qhp-v3-operator-cells-debug
  cancel-in-progress: true

jobs:
  cell01_operator_input:
    runs-on: grokbot-box-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run Cell 01
        run: node terminal/qqq_hybrid_deployment_terminal_v3/debug_cells/cell01_operator_input.js

  cell02_decision:
    runs-on: grokbot-box-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run Cell 02
        run: node terminal/qqq_hybrid_deployment_terminal_v3/debug_cells/cell02_decision.js

  cell03_operator_current:
    runs-on: grokbot-box-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run Cell 03
        run: node terminal/qqq_hybrid_deployment_terminal_v3/debug_cells/cell03_operator_current.js

  cell04_candidate:
    runs-on: grokbot-box-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run Cell 04
        run: node terminal/qqq_hybrid_deployment_terminal_v3/debug_cells/cell04_candidate.js

  cell05_build:
    runs-on: grokbot-box-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run Cell 05
        run: node terminal/qqq_hybrid_deployment_terminal_v3/debug_cells/cell05_build.js

  cell06_watch:
    runs-on: grokbot-box-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run Cell 06
        run: node terminal/qqq_hybrid_deployment_terminal_v3/debug_cells/cell06_watch.js
