name: QQQ One Wave Stack V5

on:
  push:
    branches:
      - research/qqq-one-wave-stack-v5-20260929
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qqq-one-wave-stack-v5
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          gh release download data-v1             --repo lambdaclass/options_portfolio_backtester             --pattern "QQQ_options.parquet"             --pattern "QQQ_underlying.parquet"             --dir data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run frozen one-wave stack replay
        run: |
          python research/qqq_one_wave_stack_v5.py             --data-dir data             --out artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-one-wave-stack-v5
          path: artifacts/
          if-no-files-found: error
