name: QQQ V7 Recycle Loop

on:
  push:
    branches:
      - research/qqq-last-profit-loop-v7-20260929
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-qqq-last-profit-loop-v7-20260929-clean
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          gh release download data-v1             --repo lambdaclass/options_portfolio_backtester             --pattern "QQQ_options.parquet"             --pattern "QQQ_underlying.parquet"             --dir data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run v7 frozen real-chain replay
        run: |
          python research/qqq_last_profit_loop_v7.py             --data-dir data             --out artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v7-recycle-loop
          path: artifacts/
          if-no-files-found: error
