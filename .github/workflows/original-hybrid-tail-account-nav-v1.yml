name: Original Hybrid TAIL Account NAV Replay V1

on:
  push:
    branches:
      - research/original-hybrid-tail-account-nav-v1
    paths:
      - research/qqq_hybrid_tail_triggered_nav_v1.py
      - research/test_qqq_hybrid_tail_triggered_nav_v1.py
      - research/qqq_hybrid_tail_triggered_nav_v1/TAIL_adjusted_close.csv
      - research/qqq_hybrid_tail_triggered_nav_v1/README.md
      - .github/workflows/original-hybrid-tail-account-nav-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: original-hybrid-tail-account-nav-v2
  cancel-in-progress: false

jobs:
  replay:
    name: Paired Original Hybrid account-NAV replay with TAIL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy

      - name: Syntax and accounting unit tests
        run: |
          python -m py_compile research/qqq_hybrid_tail_triggered_nav_v1.py
          python -m py_compile research/test_qqq_hybrid_tail_triggered_nav_v1.py
          python -m unittest research.test_qqq_hybrid_tail_triggered_nav_v1

      - name: Run paired account-NAV matrix
        run: |
          mkdir -p research/qqq_hybrid_tail_triggered_nav_v1/results/latest
          python research/qqq_hybrid_tail_triggered_nav_v1.py \
            --spots-path src/data/universe.json \
            --tail-prices-path research/qqq_hybrid_tail_triggered_nav_v1/TAIL_adjusted_close.csv \
            --out research/qqq_hybrid_tail_triggered_nav_v1/results/latest

      - name: Validate output contracts
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          p = Path("research/qqq_hybrid_tail_triggered_nav_v1/results/latest")
          r = json.loads((p / "report.json").read_text(encoding="utf-8"))
          rows = r["results"]
          assert r["status"] == "COMPLETED"
          assert len(rows) == 9
          assert len({(x["start_date"], x["end_date"], x["observations"]) for x in rows}) == 1
          assert all(x["observations"] > 1000 and x["final_nav_usd"] > 0 and math.isfinite(x["cagr"]) for x in rows)
          by = {x["variant"]: x for x in rows}
          assert by["NO_TAIL"]["tail_trade_count"] == 0
          assert by["LEGACY_NO_QQQ_DEBIT"]["final_nav_usd"] > by["NO_TAIL"]["final_nav_usd"] + 10000
          assert by["LEGACY_NO_QQQ_DEBIT"]["tail_trade_count"] == 0
          assert by["ALWAYS_ON_2P"]["tail_trade_count"] == 1
          assert by["TRIGGERED_1P"]["tail_trade_count"] > 0
          fw = r["full_window_accounting_comparison"]
          assert len(fw) == 2
          fb = {x["variant"]: x for x in fw}
          assert fb["FULL_WINDOW_CORRECTED_NO_TAIL"]["observations"] > 2000
          assert fb["FULL_WINDOW_LEGACY_NO_QQQ_DEBIT"]["final_nav_usd"] > fb["FULL_WINDOW_CORRECTED_NO_TAIL"]["final_nav_usd"] + 10000
          assert fb["FULL_WINDOW_CORRECTED_NO_TAIL"]["end_date"] == "2026-09-04"
          required = (
              "summary.csv", "calendar_year.csv", "no_tail_equity.csv",
              "triggered_2p_tail_trades.csv", "full_window_accounting_comparison.csv",
              "full_window_corrected_no_tail_equity.csv",
              "full_window_legacy_no_qqq_debit_equity.csv",
          )
          assert all((p / name).is_file() for name in required)
          print("account_nav_contract=PASS")
          print("common_window={}..{} rows={}".format(by["NO_TAIL"]["start_date"], by["NO_TAIL"]["end_date"], by["NO_TAIL"]["observations"]))
          print("NO_TAIL_CAGR={:.4f}%".format(by["NO_TAIL"]["cagr"] * 100))
          print("TRIGGERED_2P_CAGR={:.4f}%".format(by["TRIGGERED_2P"]["cagr"] * 100))
          print("FULL_WINDOW_CORRECTED_CAGR={:.4f}%".format(fb["FULL_WINDOW_CORRECTED_NO_TAIL"]["cagr"] * 100))
          print("FULL_WINDOW_LEGACY_CAGR={:.4f}%".format(fb["FULL_WINDOW_LEGACY_NO_QQQ_DEBIT"]["cagr"] * 100))
          PY

      - name: Persist outputs in this research branch (no artifact upload)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/qqq_hybrid_tail_triggered_nav_v1/results/latest
          if ! git diff --cached --quiet; then
            git commit -m "results: Original Hybrid TAIL account NAV replay"
            git push origin HEAD:research/original-hybrid-tail-account-nav-v1
          else
            echo "No changed result files to commit"
          fi
