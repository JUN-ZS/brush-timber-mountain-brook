name: QQQ Dynamic Risk Reload V22
on:
  push:
    branches:
      - research/qqq-dynamic-risk-reload-v22-20260930
    paths:
      - research/qqq_dynamic_risk_reload_v22.py
      - .github/workflows/qqq-dynamic-risk-reload-v22.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qqq-dynamic-risk-reload-v22
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
      - name: Run V22 dynamic risk reload matrix
        run: |
          python research/qqq_dynamic_risk_reload_v22.py --data-dir data --out artifacts
          cat artifacts/v22_dynamic_risk_reload_result.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-dynamic-risk-reload-v22
          path: |
            artifacts/v22_dynamic_risk_reload_result.json
            artifacts/v22_dynamic_risk_reload_summary.csv
            artifacts/v22_dynamic_risk_reload_detail.csv
          if-no-files-found: error
