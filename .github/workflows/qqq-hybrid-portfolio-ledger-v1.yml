name: QQQ Hybrid Portfolio Ledger V1

on:
  pull_request:
    paths:
      - "research/qqq_hybrid_portfolio_ledger_v1/**"
      - ".github/workflows/qqq-hybrid-portfolio-ledger-v1.yml"
  workflow_dispatch:

concurrency:
  group: qhp-ledger-v1
  cancel-in-progress: true

jobs:
  qa:
    runs-on: grokbot-box-linux-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Node contract and golden test
        run: |
          node --check research/qqq_hybrid_portfolio_ledger_v1/ledger_engine.js
          node research/qqq_hybrid_portfolio_ledger_v1/tests/ledger_golden_test.cjs

      - name: Python contract
        run: |
          python3 -m py_compile research/qqq_hybrid_portfolio_ledger_v1/server.py
          test -f research/qqq_hybrid_portfolio_ledger_v1/index.html
          test -f research/qqq_hybrid_portfolio_ledger_v1/styles.css
          test -f research/qqq_hybrid_portfolio_ledger_v1/app.js
          test -f research/qqq_hybrid_portfolio_ledger_v1/RUN.cmd

      - name: Safety invariants
        run: |
          grep -q "broker_orders.*False" research/qqq_hybrid_portfolio_ledger_v1/server.py
          grep -q "No automatic V3 bridge" research/qqq_hybrid_portfolio_ledger_v1/server.py

      - name: Runtime smoke
        run: |
          QHP_LEDGER_PORT=8791 python3 research/qqq_hybrid_portfolio_ledger_v1/server.py >/tmp/qhp-ledger.log 2>&1 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          sleep 1
          cat /tmp/qhp-ledger.log
          curl -fsS http://127.0.0.1:8791/api/health | grep -q QQQ-HYBRID-PORTFOLIO-LEDGER-V1
          curl -fsS http://127.0.0.1:8791/api/events | grep -q '"ok": true'
