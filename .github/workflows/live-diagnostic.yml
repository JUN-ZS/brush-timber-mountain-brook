name: Live Diagnostic V2.3

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest/**"
      - "src/lib/pulse/live.ts"
      - "src/lib/pulse/live.test.ts"
      - "scripts/run-diagnostic.mjs"
      - ".github/workflows/live-diagnostic.yml"
      - "requirements-futu.txt"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JS deps
        run: |
          if npm ci --no-audit --no-fund; then
            echo "npm ci ok"
          else
            echo "lockfile out of sync; falling back to npm install"
            npm install --no-audit --no-fund
          fi
      - name: Python diagnostic tests (no futu-api)
        run: python -m unittest discover -s backtest/tests -p "test_*.py"
      - name: Run diagnostic against missing OpenD
        run: python -m backtest.local_diagnostic --diagnostic --futu-test
      - name: Prove TXT exists and is not fake LIVE
        run: |
          test -f reports/local_run_result.txt
          grep -q "FUTU V2.3 LOCAL RUN RESULT" reports/local_run_result.txt
          grep -q "NOT CONNECTED" reports/local_run_result.txt
          if grep -q "source: LIVE QUOTE" reports/local_run_result.txt; then
            echo "CI must not produce LIVE QUOTE without OpenD"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-run-result
          path: |
            reports/local_run_result.txt
            reports/local_run_result.json
