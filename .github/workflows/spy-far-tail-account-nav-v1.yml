name: SPY Far-Tail Single-Account NAV Replay V1
on:
  push:
    branches:
      - research/spy-far-tail-account-nav-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/run_spy_far_tail_account_nav_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_account_nav_v1.py
      - .github/workflows/spy-far-tail-account-nav-v1.yml
permissions:
  contents: write
concurrency:
  group: spy-far-tail-account-nav-v1
  cancel-in-progress: true
jobs:
  account-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Parquet runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv-account-nav
          .venv-account-nav/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0
      - name: Compile and test accounting
        run: |
          set -euo pipefail
          PY=.venv-account-nav/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          "$PY" -m py_compile "$BASE/run_spy_far_tail_account_nav_v1.py" "$BASE/test_spy_far_tail_account_nav_v1.py"
          "$PY" "$BASE/test_spy_far_tail_account_nav_v1.py"
      - name: Replay all single-account NAV paths
        timeout-minutes: 270
        run: |
          set -euo pipefail
          PY=.venv-account-nav/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          "$PY" "$BASE/run_spy_far_tail_account_nav_v1.py" --cache "$HOME/.cache/spy-options-account-nav-v1" | tee /tmp/account-nav.json
          OUT="$BASE/results/spy_far_tail_account_nav_v1"
          for f in account_phase_summary.csv account_summary_by_capital.csv account_annual_returns.csv account_annual_median_by_phase.csv account_nav_selected.csv capital_gates.csv SPY_FAR_TAIL_ACCOUNT_NAV_REPORT.md account_manifest.json; do test -s "$OUT/$f"; done
          grep -q '"status": "COMPLETED"' "$OUT/account_manifest.json"
          grep -q '"required_outputs_nonempty": true' "$OUT/account_manifest.json"
          cat "$OUT/SPY_FAR_TAIL_ACCOUNT_NAV_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/account-nav.json >> "$GITHUB_STEP_SUMMARY"
      - name: Commit result files to isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT=research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_account_nav_v1
          SNAPSHOT="$RUNNER_TEMP/account-nav-output"
          rm -rf "$SNAPSHOT"; mkdir -p "$SNAPSHOT"; cp -a "$OUT/." "$SNAPSHOT/"
          for attempt in 1 2 3 4 5; do
            git fetch origin research/spy-far-tail-account-nav-v1
            git reset --hard origin/research/spy-far-tail-account-nav-v1
            rm -rf "$OUT"; mkdir -p "$OUT"; cp -a "$SNAPSHOT/." "$OUT/"
            git add "$OUT"
            if git diff --cached --quiet; then echo "Outputs unchanged."; exit 0; fi
            git commit -m "research: record single-account NAV replay outputs"
            if git push origin HEAD:research/spy-far-tail-account-nav-v1; then exit 0; fi
            echo "Branch advanced; retrying output reconciliation for attempt $attempt."
          done
          echo "Could not push NAV outputs after five retries." >&2
          exit 1
