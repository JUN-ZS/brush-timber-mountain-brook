name: QQQ 1x5 Put Ratio Exit Measurement V1

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - feat/qqq-hybrid-operator-terminal-v1-20261009
    paths:
      - research/qqq_put_ratio_exit_study_v1/**
      - .github/workflows/qqq-put-ratio-exit-study-v1.yml

permissions:
  contents: read

concurrency:
  group: qqq-put-ratio-exit-study-v1
  cancel-in-progress: true

jobs:
  study:
    name: SHA-pinned QQQ 1x5 ratio exit replay
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime and pinned Parquet reader
        run: |
          py -3 --version || exit /b 1
          py -3 -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0 || exit /b 1

      - name: Restore SHA-verified public QQQ option cache
        uses: actions/cache@v4
        with:
          path: .cache\qqq-options-full-history
          key: qqq-options-full-history-2018-2025-sha-pinned-v1

      - name: Compile and run offline contract tests
        run: |
          py -3 -m py_compile research\qqq_put_ratio_exit_study_v1\qqq_put_ratio_exit_study_v1.py || exit /b 1
          py -3 -m py_compile research\qqq_put_ratio_exit_study_v1\test_qqq_put_ratio_exit_study_v1.py || exit /b 1
          py -3 research\qqq_put_ratio_exit_study_v1\test_qqq_put_ratio_exit_study_v1.py || exit /b 1
          py -3 -m py_compile research\qqq_put_ratio_exit_study_v1\qqq_put_ratio_scale_volatility_v1.py || exit /b 1
          py -3 -m py_compile research\qqq_put_ratio_exit_study_v1\test_qqq_put_ratio_scale_volatility_v1.py || exit /b 1
          py -3 research\qqq_put_ratio_exit_study_v1\test_qqq_put_ratio_scale_volatility_v1.py || exit /b 1

      - name: Run SHA-pinned 1x5 exit policy replay
        timeout-minutes: 48
        run: |
          if not exist artifacts\qqq_put_ratio_exit_study_v1 mkdir artifacts\qqq_put_ratio_exit_study_v1
          py -3 research\qqq_put_ratio_exit_study_v1\qqq_put_ratio_exit_study_v1.py --out artifacts\qqq_put_ratio_exit_study_v1 > QQQ_PUT_RATIO_EXIT_STUDY_RUN.json || exit /b 1
          type QQQ_PUT_RATIO_EXIT_STUDY_RUN.json || exit /b 1
          type artifacts\qqq_put_ratio_exit_study_v1\qqq_put_ratio_exit_study_summary.md || exit /b 1
          type artifacts\qqq_put_ratio_exit_study_v1\qqq_put_ratio_exit_study_summary.md >> "%GITHUB_STEP_SUMMARY%" || exit /b 1
          py -3 -c "from pathlib import Path; p=[Path('QQQ_PUT_RATIO_EXIT_STUDY_RUN.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.md'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_policy_summary.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_policy_trades.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_event_study.json')]; m=[str(x) for x in p if not x.is_file()]; assert not m, 'missing outputs: '+repr(m); print('all_replay_outputs_exist=PASS')" || exit /b 1
          echo output_retention=GitHub_Actions_artifact_14_days

      - name: Run NAV-scaled ratio and volatility-time matrix
        timeout-minutes: 30
        run: |
          if not exist artifacts\qqq_put_ratio_exit_study_v1\scale_volatility mkdir artifacts\qqq_put_ratio_exit_study_v1\scale_volatility
          py -3 research\qqq_put_ratio_exit_study_v1\qqq_put_ratio_scale_volatility_v1.py --cohort artifacts\qqq_put_ratio_exit_study_v1\qqq_put_ratio_exit_source_cohort.json --prices artifacts\qqq_put_ratio_exit_study_v1\qqq_underlying_close_series.csv --out artifacts\qqq_put_ratio_exit_study_v1\scale_volatility --nav 100000 --nav 1000000 > QQQ_PUT_RATIO_SCALE_VOLATILITY_RUN.json || exit /b 1
          type QQQ_PUT_RATIO_SCALE_VOLATILITY_RUN.json || exit /b 1
          type artifacts\qqq_put_ratio_exit_study_v1\scale_volatility\qqq_put_ratio_scale_volatility_summary.md || exit /b 1
          type artifacts\qqq_put_ratio_exit_study_v1\scale_volatility\qqq_put_ratio_scale_volatility_summary.md >> "%GITHUB_STEP_SUMMARY%" || exit /b 1
          py -3 -c "from pathlib import Path; p=[Path('QQQ_PUT_RATIO_SCALE_VOLATILITY_RUN.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_put_ratio_scale_volatility_summary.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_risk_capacity.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_exit_policy_matrix.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_volatility_horizon_probabilities.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/friction_bar_matrix.csv')]; m=[str(x) for x in p if not x.is_file()]; assert not m, 'missing scale outputs: '+repr(m); print('scale_volatility_outputs_exist=PASS')" || exit /b 1

      - name: Upload replay metrics
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qqq-put-ratio-exit-measurement-v1
          path: |
            QQQ_PUT_RATIO_EXIT_STUDY_RUN.json
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.json
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.md
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_policy_summary.csv
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_event_study.json
          if-no-files-found: error
          retention-days: 14
