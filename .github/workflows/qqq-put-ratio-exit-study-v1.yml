name: QQQ 1x5 Put Ratio Exit Measurement V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/qqq-put-ratio-exit-measurement-v1
    paths:
      - research/qqq_put_ratio_exit_study_v1/**
      - research/qqq_put_ratio_exit_supplement_v1/**
      - .github/workflows/qqq-put-ratio-exit-study-v1.yml
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - feat/qqq-hybrid-operator-terminal-v1-20261009
    paths:
      - research/qqq_put_ratio_exit_study_v1/**
      - .github/workflows/qqq-put-ratio-exit-study-v1.yml

permissions:
  contents: write

concurrency:
  group: qqq-put-ratio-exit-study-v1
  cancel-in-progress: true

jobs:
  study:
    name: SHA-pinned QQQ 1x5 ratio exit replay (Linux)
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime and pinned Parquet reader
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0

      - name: Check persistent option cache on Linux BOT
        id: local_option_cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/qqq-options-full-history"
          mkdir -p "$cache_dir"
          if find "$cache_dir" -type f -print -quit | grep -q .; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "option_cache=LINUX_BOT_LOCAL_PERSISTENT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "option_cache=EMPTY_TRY_SHA_PINNED_REMOTE_CACHE"
          fi

      - name: Restore SHA-pinned option cache only when Linux BOT is cold
        if: steps.local_option_cache.outputs.hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/qqq-options-full-history
          key: qqq-options-full-history-2018-2025-sha-pinned-v1
          enableCrossOsArchive: true

      - name: Link persistent cache into the checked-out source tree
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/qqq-options-full-history"
          mkdir -p "$cache_dir" .cache
          rm -rf .cache/qqq-options-full-history
          ln -s "$cache_dir" .cache/qqq-options-full-history
          echo "option_cache_path=$cache_dir"
          echo "option_cache_persistence=outside_git_workspace"
          echo "option_cache_integrity=verified_by_SHA_pinned_source_audit"

      - name: Compile and run offline contract tests
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          $PY -m py_compile research/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_v1.py
          $PY -m py_compile research/qqq_put_ratio_exit_study_v1/test_qqq_put_ratio_exit_study_v1.py
          $PY research/qqq_put_ratio_exit_study_v1/test_qqq_put_ratio_exit_study_v1.py
          $PY -m py_compile research/qqq_put_ratio_exit_study_v1/qqq_put_ratio_scale_volatility_v1.py
          $PY -m py_compile research/qqq_put_ratio_exit_study_v1/test_qqq_put_ratio_scale_volatility_v1.py
          $PY research/qqq_put_ratio_exit_study_v1/test_qqq_put_ratio_scale_volatility_v1.py
          $PY -m py_compile research/qqq_put_ratio_exit_supplement_v1/qqq_public_price_proxy.py
          $PY -m py_compile research/qqq_put_ratio_exit_supplement_v1/test_qqq_public_price_proxy.py
          $PY research/qqq_put_ratio_exit_supplement_v1/test_qqq_public_price_proxy.py
          $PY -m py_compile research/qqq_put_ratio_exit_supplement_v1/cost_sensitivity_audit.py
          $PY -m py_compile research/qqq_put_ratio_exit_supplement_v1/test_cost_sensitivity_audit.py
          $PY research/qqq_put_ratio_exit_supplement_v1/test_cost_sensitivity_audit.py
          $PY -m py_compile research/qqq_put_ratio_exit_study_v1/qqq_put_ratio_dynamic_nav_bar_v1.py
          $PY -m py_compile research/qqq_put_ratio_exit_study_v1/test_qqq_put_ratio_dynamic_nav_bar_v1.py
          $PY research/qqq_put_ratio_exit_study_v1/test_qqq_put_ratio_dynamic_nav_bar_v1.py

      - name: Run SHA-pinned 1x5 exit policy replay
        timeout-minutes: 48
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          mkdir -p artifacts/qqq_put_ratio_exit_study_v1
          $PY research/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_v1.py --out artifacts/qqq_put_ratio_exit_study_v1 > QQQ_PUT_RATIO_EXIT_STUDY_RUN.json
          cat QQQ_PUT_RATIO_EXIT_STUDY_RUN.json
          cat artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.md
          cat artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.md >> "$GITHUB_STEP_SUMMARY"
          $PY -c "from pathlib import Path; p=[Path('QQQ_PUT_RATIO_EXIT_STUDY_RUN.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.md'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_policy_summary.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_policy_trades.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_event_study.json')]; m=[str(x) for x in p if not x.is_file()]; assert not m, 'missing outputs: '+repr(m); print('all_replay_outputs_exist=PASS')"
          echo "output_retention=GitHub_Actions_artifact_14_days"

      - name: Run NAV-scaled ratio and volatility-time matrix
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          mkdir -p artifacts/qqq_put_ratio_exit_study_v1/scale_volatility
          $PY research/qqq_put_ratio_exit_study_v1/qqq_put_ratio_scale_volatility_v1.py --cohort artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_source_cohort.json --prices artifacts/qqq_put_ratio_exit_study_v1/qqq_underlying_close_series.csv --out artifacts/qqq_put_ratio_exit_study_v1/scale_volatility --nav 100000 --nav 1000000 > QQQ_PUT_RATIO_SCALE_VOLATILITY_RUN.json
          cat QQQ_PUT_RATIO_SCALE_VOLATILITY_RUN.json
          cat artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_put_ratio_scale_volatility_summary.md
          cat artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_put_ratio_scale_volatility_summary.md >> "$GITHUB_STEP_SUMMARY"
          $PY -c "from pathlib import Path; p=[Path('QQQ_PUT_RATIO_SCALE_VOLATILITY_RUN.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_put_ratio_scale_volatility_summary.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_risk_capacity.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_exit_policy_matrix.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_volatility_horizon_probabilities.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/friction_bar_matrix.csv')]; m=[str(x) for x in p if not x.is_file()]; assert not m, 'missing scale outputs: '+repr(m); print('scale_volatility_outputs_exist=PASS')"


      - name: Pair cost scenarios and audit friction BAR sample sufficiency
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          mkdir -p artifacts/qqq_put_ratio_exit_study_v1/cost_audit
          $PY research/qqq_put_ratio_exit_supplement_v1/cost_sensitivity_audit.py --policy-matrix artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_exit_policy_matrix.csv --friction-matrix artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/friction_bar_matrix.csv --out artifacts/qqq_put_ratio_exit_study_v1/cost_audit > QQQ_COST_SENSITIVITY_AUDIT_RUN.json
          cat QQQ_COST_SENSITIVITY_AUDIT_RUN.json
          cat artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_audit_summary.md
          cat artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_audit_summary.md >> "$GITHUB_STEP_SUMMARY"
          $PY -c "from pathlib import Path; p=[Path('artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_by_policy.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/cost_audit/friction_cost_sensitivity.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_audit_summary.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_audit_summary.md')]; m=[str(x) for x in p if not x.is_file()]; assert not m, 'missing cost audit outputs: '+repr(m); print('cost_sensitivity_audit_outputs_exist=PASS')"

      - name: Run dynamic NAV, BAR hit-rate and drawdown stress replay
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          mkdir -p artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav
          $PY research/qqq_put_ratio_exit_study_v1/qqq_put_ratio_dynamic_nav_bar_v1.py --cohort artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_source_cohort.json --prices artifacts/qqq_put_ratio_exit_study_v1/qqq_underlying_close_series.csv --out artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav --start-nav 100000 --target-profit 214012 > QQQ_DYNAMIC_NAV_BAR_RUN.json
          cat QQQ_DYNAMIC_NAV_BAR_RUN.json
          cat artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_bar_summary.md
          cat artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_bar_summary.md >> "$GITHUB_STEP_SUMMARY"
          $PY -c "from pathlib import Path; p=[Path('QQQ_DYNAMIC_NAV_BAR_RUN.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_bar_summary.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_portfolio_matrix.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_bar_occurrence.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_bar_occurrence_by_regime.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_drawdown_tiers.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_annual_path.csv'),Path('artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_daily_selected.csv')]; m=[str(x) for x in p if not x.is_file()]; assert not m, 'missing dynamic outputs: '+repr(m); print('dynamic_nav_bar_outputs_exist=PASS')"

      - name: Run public QQQ price proxy supplement (not option P&L)
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          PY=.venv/bin/python
          mkdir -p artifacts/qqq_put_ratio_exit_study_v1/external_proxy
          if $PY research/qqq_put_ratio_exit_supplement_v1/qqq_public_price_proxy.py --start 2018-03-01 --source-end 2025-12-15 --end 2026-10-15 --out artifacts/qqq_put_ratio_exit_study_v1/external_proxy > QQQ_PUBLIC_PRICE_PROXY_RUN.json; then
            cat QQQ_PUBLIC_PRICE_PROXY_RUN.json
            cat artifacts/qqq_put_ratio_exit_study_v1/external_proxy/qqq_public_price_proxy_summary.md
            cat artifacts/qqq_put_ratio_exit_study_v1/external_proxy/qqq_public_price_proxy_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            echo "PUBLIC_PRICE_PROXY_STATUS=BLOCKED_EXTERNAL_FETCH_OR_VALIDATION (exit=$rc)"
            echo "External QQQ price proxy could not be validated; no prices were fabricated or forward-filled." >> "$GITHUB_STEP_SUMMARY"
            printf '{"research_id":"QQQ_PUBLIC_PRICE_PROXY_SUPPLEMENT_V1","status":"BLOCKED_EXTERNAL_FETCH_OR_VALIDATION","exit_code":%s,"strategy_pnl_estimated":false}\n' "$rc" > artifacts/qqq_put_ratio_exit_study_v1/external_proxy/qqq_public_price_proxy_summary.json
          fi

      - name: Upload replay metrics
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qqq-put-ratio-exit-measurement-v1-linux
          path: |
            QQQ_PUT_RATIO_EXIT_STUDY_RUN.json
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.json
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.md
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_policy_summary.csv
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_event_study.json
            QQQ_PUT_RATIO_SCALE_VOLATILITY_RUN.json
            artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/friction_bar_matrix.csv
            artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_risk_capacity.csv
            artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_exit_policy_matrix.csv
            artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_volatility_horizon_probabilities.csv
            artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_put_ratio_scale_volatility_summary.json
            artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_put_ratio_scale_volatility_summary.md
            QQQ_DYNAMIC_NAV_BAR_RUN.json
            artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_bar_summary.json
            artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_bar_summary.md
            artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_portfolio_matrix.csv
            artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_bar_occurrence.csv
            artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_bar_occurrence_by_regime.csv
            artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_drawdown_tiers.csv
            artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_annual_path.csv
            artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_daily_selected.csv
            QQQ_COST_SENSITIVITY_AUDIT_RUN.json
            artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_by_policy.csv
            artifacts/qqq_put_ratio_exit_study_v1/cost_audit/friction_cost_sensitivity.csv
            artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_audit_summary.json
            artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_audit_summary.md
            QQQ_PUBLIC_PRICE_PROXY_RUN.json
            artifacts/qqq_put_ratio_exit_study_v1/external_proxy/qqq_public_price_proxy_daily.csv
            artifacts/qqq_put_ratio_exit_study_v1/external_proxy/qqq_public_price_proxy_probabilities.csv
            artifacts/qqq_put_ratio_exit_study_v1/external_proxy/qqq_public_price_proxy_summary.json
            artifacts/qqq_put_ratio_exit_study_v1/external_proxy/qqq_public_price_proxy_summary.md
          if-no-files-found: warn
          retention-days: 14

      - name: Persist validated research outputs on the research branch
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          result_dir="research/qqq_put_ratio_exit_results_v1/run-${short_sha}"
          mkdir -p "$result_dir/replay" "$result_dir/scale_volatility" "$result_dir/dynamic_nav" "$result_dir/external_proxy" "$result_dir/cost_audit"
          cp QQQ_PUT_RATIO_EXIT_STUDY_RUN.json "$result_dir/replay/"
          cp artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.json "$result_dir/replay/"
          cp artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_study_summary.md "$result_dir/replay/"
          cp artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_policy_summary.csv "$result_dir/replay/"
          cp artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_policy_trades.csv "$result_dir/replay/"
          cp artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_event_study.json "$result_dir/replay/"
          cp artifacts/qqq_put_ratio_exit_study_v1/qqq_put_ratio_exit_source_cohort.json "$result_dir/replay/"
          cp artifacts/qqq_put_ratio_exit_study_v1/qqq_underlying_close_series.csv "$result_dir/replay/"
          cp QQQ_PUT_RATIO_SCALE_VOLATILITY_RUN.json "$result_dir/scale_volatility/"
          cp artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_put_ratio_scale_volatility_summary.json "$result_dir/scale_volatility/"
          cp artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_put_ratio_scale_volatility_summary.md "$result_dir/scale_volatility/"
          cp artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_risk_capacity.csv "$result_dir/scale_volatility/"
          cp artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/ratio_exit_policy_matrix.csv "$result_dir/scale_volatility/"
          cp artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/qqq_volatility_horizon_probabilities.csv "$result_dir/scale_volatility/"
          cp artifacts/qqq_put_ratio_exit_study_v1/scale_volatility/friction_bar_matrix.csv "$result_dir/scale_volatility/"
          cp QQQ_DYNAMIC_NAV_BAR_RUN.json "$result_dir/dynamic_nav/"
          cp artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_bar_summary.json "$result_dir/dynamic_nav/"
          cp artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_bar_summary.md "$result_dir/dynamic_nav/"
          cp artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_portfolio_matrix.csv "$result_dir/dynamic_nav/"
          cp artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_bar_occurrence.csv "$result_dir/dynamic_nav/"
          cp artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_bar_occurrence_by_regime.csv "$result_dir/dynamic_nav/"
          cp artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_drawdown_tiers.csv "$result_dir/dynamic_nav/"
          cp artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_annual_path.csv "$result_dir/dynamic_nav/"
          cp artifacts/qqq_put_ratio_exit_study_v1/dynamic_nav/dynamic_nav_daily_selected.csv "$result_dir/dynamic_nav/"
          cp QQQ_COST_SENSITIVITY_AUDIT_RUN.json "$result_dir/cost_audit/"
          cp artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_by_policy.csv "$result_dir/cost_audit/"
          cp artifacts/qqq_put_ratio_exit_study_v1/cost_audit/friction_cost_sensitivity.csv "$result_dir/cost_audit/"
          cp artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_audit_summary.json "$result_dir/cost_audit/"
          cp artifacts/qqq_put_ratio_exit_study_v1/cost_audit/cost_sensitivity_audit_summary.md "$result_dir/cost_audit/"
          cp QQQ_PUBLIC_PRICE_PROXY_RUN.json "$result_dir/external_proxy/" 2>/dev/null || true
          if [ -d artifacts/qqq_put_ratio_exit_study_v1/external_proxy ]; then
            cp artifacts/qqq_put_ratio_exit_study_v1/external_proxy/qqq_public_price_proxy_* "$result_dir/external_proxy/" 2>/dev/null || true
          fi
          cat > "$result_dir/MANIFEST.md" <<EOF
          # QQQ put-ratio research output

          - Study commit tested: $GITHUB_SHA
          - GitHub Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Option-chain last observed date: 2025-12-15
          - Replay, scale matrix, and dynamic NAV/BAR/MaxDD stress matrix: completed by this workflow before persistence.
          - Dynamic results compound closed episodes into the next NAV; BAR rates are observed episode/mark frequency, not forward probability.
          - External Yahoo/FRED and Yahoo ^VIX/^VXN proxies, when available, are price-path-only; they do not estimate option P&L after the option-chain boundary.
          - Cost-sensitivity audit pairs zero/base/adverse model assumptions and screens friction BAR sample counts; it does not validate fills or promote any exit rule.
          - Every output is research evidence only. Deployment and broker orders remain BLOCKED.
          - Persisted because GitHub Actions artifact upload quota was exhausted; this directory is committed only on the isolated research branch.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result_dir"
          if git diff --cached --quiet; then
            echo "research_output_commit=NO_CHANGES"
          else
            git commit -m "research: persist QQQ put ratio run outputs ${short_sha}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
