name: TEMP PR84 ORIGINAL HYBRID SINGLE RUN

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-pr84-original-hybrid
  cancel-in-progress: true

jobs:
  final_run:
    if: github.event.pull_request.number == 84
    name: REAL VX → M1/M2 → fixed Original Hybrid
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Runtime
        run: |
          python3 --version
          node --version

      - name: Build REAL VX M1/M2
        run: |
          mkdir -p artifacts/real-vx
          python3 research/cboe_vx_m1m2/build_real_vx_m1_m2.py \
            --start 2018-03-01 \
            --end 2026-09-04 \
            --out artifacts/real-vx/cboe_vx_m1_m2_2018_2026.csv

      - name: Historical overlap diagnostic
        continue-on-error: true
        run: |
          python3 research/cboe_vx_m1m2/validate_against_external.py \
            --cboe artifacts/real-vx/cboe_vx_m1_m2_2018_2026.csv \
            --external research/data/vx_m1_m2_external_2016_2022.csv \
            --out artifacts/real-vx/overlap_gate.json \
            --diagnostic

      - name: OLD EXTERNAL vs REAL CBOE source-swap parity
        run: |
          node research/cboe_vx_m1m2/compare_sources.js \
            --real artifacts/real-vx/cboe_vx_m1_m2_2018_2026.csv \
            --external research/data/vx_m1_m2_external_2016_2022.csv \
            --spots research/data/archive_spots_overlap_2018_2022.csv \
            --engine research/m1_m2_reconstruction_lab/engine.js \
            --out-dir artifacts/real-vx/source-swap

      - name: Free delayed Cboe live snapshot
        continue-on-error: true
        run: |
          python3 research/cboe_vx_m1m2/collect_delayed_vx_m1_m2.py \
            --out artifacts/real-vx/delayed_vx_m1_m2.json

      - name: Fixed REAL M1/M2 archive replay
        run: node research/m1_m2_reconstruction_lab/tests/real_historical_state_replay.js

      - name: Contract checks
        run: |
          node --check research/m1_m2_reconstruction_lab/engine.js
          node --check research/m1_m2_reconstruction_lab/tests/real_historical_state_replay.js
          node --check research/cboe_vx_m1m2/compare_sources.js
          python3 -m py_compile research/cboe_vx_m1m2/build_real_vx_m1_m2.py
          python3 -m py_compile research/cboe_vx_m1m2/validate_against_external.py
          python3 -m py_compile research/cboe_vx_m1m2/collect_delayed_vx_m1_m2.py
          test -f research/data/real_historical_state_replay_2018_2022.csv
          test -f research/m1_m2_reconstruction_lab/REAL_HISTORICAL_STATE_REPLAY.md
          test -f artifacts/real-vx/source-swap/source_swap_metrics.json
          test -f artifacts/real-vx/source-swap/SOURCE_SWAP_PARITY.md

      - name: Evidence
        uses: actions/upload-artifact@v4
        with:
          name: original-hybrid-real-vx-pr84
          path: |
            artifacts/real-vx/
            research/data/real_historical_state_replay_2018_2022.csv
            research/m1_m2_reconstruction_lab/REAL_HISTORICAL_STATE_REPLAY.md
          if-no-files-found: error
          retention-days: 30
