name: "QQQ/SPY CALL 1:6 Delta 0.20 DTE hold and exit factorial"
on:
  push:
    branches:
      - research/qqq-spy-call-ratio-dte-hold-exit-v1
    paths:
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/qqq_spy_call_premium_matched_phase_v1.py
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/dte_hold_exit_factorial_replay_v1.py
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/dte_hold_exit_factorial_report_v1.py
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/mode_c_capacity_gate_v1.py
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/test_qqq_spy_call_ratio_v1.py
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/qqq_spy_put_call_stock_overlay_v1.py
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/test_qqq_spy_put_call_stock_overlay_v1.py
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/qqq_spy_put_call_daily_nav_v1.py
      - research/qqq_spy_call_fixed_ratio_size_gated_v1/test_qqq_spy_put_call_daily_nav_v1.py
      - .github/workflows/qqq-spy-call-ratio-dte-hold-exit-v1.yml

permissions:
  contents: write

concurrency:
  group: qqq-spy-call-ratio-dte-hold-exit-v1
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout isolated call research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned parquet dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-dte-call
          .venv-dte-call/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0

      - name: Compile and test CALL-specific contract logic
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-dte-call/bin/python
          BASE=research/qqq_spy_call_fixed_ratio_size_gated_v1
          "$PY" -m py_compile \
            "$BASE/qqq_spy_call_premium_matched_phase_v1.py" \
            "$BASE/dte_hold_exit_factorial_replay_v1.py" \
            "$BASE/dte_hold_exit_factorial_report_v1.py" \
            "$BASE/mode_c_capacity_gate_v1.py" \
            "$BASE/test_qqq_spy_call_ratio_v1.py" \
            "$BASE/qqq_spy_put_call_stock_overlay_v1.py" \
            "$BASE/test_qqq_spy_put_call_stock_overlay_v1.py" \
            "$BASE/qqq_spy_put_call_daily_nav_v1.py" \
            "$BASE/test_qqq_spy_put_call_daily_nav_v1.py"
          PYTHONPATH="$BASE" "$PY" "$BASE/test_qqq_spy_call_ratio_v1.py"
          PYTHONPATH="$BASE" "$PY" "$BASE/test_qqq_spy_put_call_daily_nav_v1.py"

      - name: Replay four DTE targets and five predeclared cadence anchors
        shell: bash
        timeout-minutes: 345
        run: |
          set -euo pipefail
          PY=.venv-dte-call/bin/python
          BASE=research/qqq_spy_call_fixed_ratio_size_gated_v1
          ROOT="$BASE/results/dte_hold_exit_factorial_call_v1"
          CACHE="$HOME/.cache/qqq-spy-call-dte-hold-exit-v1"
          mkdir -p "$ROOT"
          for DTE in 20 30 45 60; do
            for PHASE in 0 2 4 6 8; do
              TARGET="$ROOT/dte_"$DTE"/phase_"$PHASE
              if test -s "$TARGET/summary.json" \
                && test -s "$TARGET/summary.md" \
                && test -s "$TARGET/trade_episodes.csv" \
                && test -s "$TARGET/factorial_policy_summary.json"; then
                echo "Reusing completed CALL DTE=$DTE phase=$PHASE run."
                continue
              fi
              echo "Starting CALL DTE=$DTE phase=$PHASE, target abs-Delta 0.20."
              "$PY" "$BASE/dte_hold_exit_factorial_replay_v1.py" \
                --dte-target "$DTE" --phase "$PHASE" \
                --start 2018-03-01 --end 2025-12-15 \
                --qqq-cache "$CACHE/qqq" --spy-cache "$CACHE/spy"
              for FILE in summary.json summary.md trade_episodes.csv factorial_policy_summary.json source_manifest.json entry_cohort.csv; do
                test -s "$TARGET/$FILE"
              done
            done
          done

      - name: Persist raw source-pinned CALL replay outputs before aggregation
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/qqq_spy_call_fixed_ratio_size_gated_v1/results/dte_hold_exit_factorial_call_v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"/dte_*
          if git diff --cached --quiet; then
            echo "Raw CALL replay inputs already persisted; no intermediate commit needed."
          else
            git commit -m "research: persist raw QQQ SPY CALL ratio replay inputs"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Aggregate, audit and publish CALL factorial and Mode C matrices
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-dte-call/bin/python
          BASE=research/qqq_spy_call_fixed_ratio_size_gated_v1
          OUT="$BASE/results/dte_hold_exit_factorial_call_v1"
          "$PY" -u "$BASE/dte_hold_exit_factorial_report_v1.py"
          test -s "$OUT/factorial_matrix.csv"
          test -s "$OUT/factorial_config_summary.csv"
          test -s "$OUT/factorial_main_effects.csv"
          test -s "$OUT/factorial_calendar_year_pnl.csv"
          test -s "$OUT/DTE_HOLD_EXIT_FACTORIAL_REPORT.md"
          "$PY" - <<'PY'
          import csv
          from pathlib import Path
          out=Path("research/qqq_spy_call_fixed_ratio_size_gated_v1/results/dte_hold_exit_factorial_call_v1")
          with (out/"factorial_matrix.csv").open(newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==240, f"expected 240 phase cells, got {len(rows)}"
          assert len({(r["dte_target"],r["hold_sessions"],r["expiry_guard_dte"],r["phase_sessions"]) for r in rows})==240
          assert all(r["status"].startswith("COMPLETED") for r in rows)
          with (out/"factorial_config_summary.csv").open(newline="",encoding="utf-8") as f:
              configs=list(csv.DictReader(f))
          assert len(configs)==48, f"expected 48 configurations, got {len(configs)}"
          print("CALL AUDIT PASS: 20 completed source-pinned runs; 240 phase cells; 48 settings.")
          PY
          cat "$OUT/DTE_HOLD_EXIT_FACTORIAL_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          "$PY" "$BASE/mode_c_capacity_gate_v1.py" --self-test
          "$PY" "$BASE/mode_c_capacity_gate_v1.py"
          test -s "$OUT/mode_c_capacity_matrix.csv"
          test -s "$OUT/mode_c_capacity_config_summary.csv"
          test -s "$OUT/mode_c_capacity_calendar_year_pnl.csv"
          test -s "$OUT/mode_c_selected_episodes.csv"
          test -s "$OUT/MODE_C_CAPACITY_GATE_REPORT.md"
          cat "$OUT/MODE_C_CAPACITY_GATE_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Test and calculate paired PUT + CALL with QQQ stock overlay
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-dte-call/bin/python
          BASE=research/qqq_spy_call_fixed_ratio_size_gated_v1
          PYTHONPATH="$BASE" "$PY" "$BASE/test_qqq_spy_put_call_stock_overlay_v1.py"
          "$PY" -u "$BASE/qqq_spy_put_call_stock_overlay_v1.py" \
            --qqq-stock-value-usd 63694 \
            --current-qqq-price 712.20 \
            --current-price-date 2026-10-26
          OUT="$BASE/results/dte_hold_exit_factorial_call_v1/put_call_stock_overlay_v1"
          test -s "$OUT/QQQ_STOCK_OVERLAY_REPORT.md"
          test -s "$OUT/put_call_stock_overlay_by_phase.csv"
          test -s "$OUT/put_call_stock_overlay_config_summary.csv"
          test -s "$OUT/put_call_stock_overlay_selected_pairs.csv"
          cat "$OUT/QQQ_STOCK_OVERLAY_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Daily NAV and max drawdown acceptance (DTE20, exit DTE <= 4)
        shell: bash
        timeout-minutes: 345
        run: |
          set -euo pipefail
          PY=.venv-dte-call/bin/python
          BASE=research/qqq_spy_call_fixed_ratio_size_gated_v1
          PYTHONPATH="$BASE" "$PY" "$BASE/test_qqq_spy_put_call_daily_nav_v1.py"
          "$PY" -u "$BASE/qqq_spy_put_call_daily_nav_v1.py" \
            --qqq-stock-value-usd 63694 \
            --current-qqq-price 712.20 \
            --current-price-date 2026-10-26
          OUT="$BASE/results/dte_hold_exit_factorial_call_v1/daily_nav_dte20_exit4_v1"
          test -s "$OUT/DAILY_NAV_MAX_DRAWDOWN_REPORT.md"
          test -s "$OUT/daily_nav_by_phase.csv"
          test -s "$OUT/daily_option_leg_marks.csv"
          test -s "$OUT/phase_max_drawdown_summary.csv"
          test -s "$OUT/pair_matching_and_capacity_audit.csv"
          test -s "$OUT/quote_reconciliation.json"
          test -s "$OUT/daily_nav_max_drawdown_audit.json"
          cat "$OUT/DAILY_NAV_MAX_DRAWDOWN_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit CALL research outputs to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/qqq_spy_call_fixed_ratio_size_gated_v1/results/dte_hold_exit_factorial_call_v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "No new CALL result changes."
            exit 0
          fi
          git commit -m "research: publish QQQ SPY CALL DTE factorial replay"
          git push origin "HEAD:$GITHUB_REF_NAME"
