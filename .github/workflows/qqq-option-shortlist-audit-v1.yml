name: QQQ Option Shortlist Cost and Holdout Audit V1

on:
  push:
    branches:
      - research/qqq-option-shortlist-replay-v1
    paths:
      - research/qqq_option_shortlist_audit_v1/**
      - .github/workflows/qqq-option-shortlist-audit-v1.yml

permissions:
  contents: write

concurrency:
  group: qqq-option-shortlist-audit-v1
  cancel-in-progress: false

jobs:
  audit:
    name: Audit persisted event replay without re-downloading options
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Verify exact replay inputs and run audit contract tests
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile research/qqq_option_shortlist_audit_v1/audit_qqq_option_shortlist_v1.py
          python3 research/qqq_option_shortlist_audit_v1/test_audit_qqq_option_shortlist_v1.py
          test -s research/qqq_option_shortlist_results_v1/run-39003581461-d2e3d21c54c1e02a11c75218abc588458b59b4d1/manifest.json
          test -s research/qqq_option_shortlist_results_v1/run-39003581461-d2e3d21c54c1e02a11c75218abc588458b59b4d1/summary.json
          test -s research/qqq_option_shortlist_results_v1/run-39003581461-d2e3d21c54c1e02a11c75218abc588458b59b4d1/trades.csv
      - name: Produce cost, temporal, paired-hedge and capacity audit
        run: |
          set -euo pipefail
          python3 research/qqq_option_shortlist_audit_v1/audit_qqq_option_shortlist_v1.py
          OUT=research/qqq_option_shortlist_results_v1/run-39003581461-d2e3d21c54c1e02a11c75218abc588458b59b4d1/audit_v1
          test -s "$OUT/audit_summary.json"
          test -s "$OUT/audit_summary.csv"
          test -s "$OUT/REPORT.md"
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path("research/qqq_option_shortlist_results_v1/run-39003581461-d2e3d21c54c1e02a11c75218abc588458b59b4d1/audit_v1")
          d = json.loads((p / "audit_summary.json").read_text())
          assert d["audit_id"] == "QQQ_OPTION_SHORTLIST_COST_AND_HOLDOUT_AUDIT_V1"
          assert d["source_manifest"]["trade_rows"] == 387
          assert len(d["paired_long_put_increment"]) == 9
          rows = list(csv.DictReader((p / "audit_summary.csv").open()))
          assert len(rows) >= 90, len(rows)
          assert all(x["cost_case"] in {"ZERO", "BASE", "STRESS"} for x in rows)
          print("Persisted replay audit outputs and row-count contracts=PASS")
          PY
      - name: Persist audit report to research branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_option_shortlist_results_v1/run-39003581461-d2e3d21c54c1e02a11c75218abc588458b59b4d1/audit_v1
          if git diff --cached --quiet; then
            echo "No audit output changes."
          else
            git commit -m "research: persist QQQ option shortlist cost and capacity audit"
            git push origin HEAD:research/qqq-option-shortlist-replay-v1
          fi
