name: SPY Far-Tail In-Holding Risk Trigger V2.1

on:
  push:
    branches:
      - research/spy-far-tail-conditional-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/run_spy_far_tail_conditional_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_conditional_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/SPY_FAR_TAIL_CONDITIONAL_CONTRACT.md
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/run_spy_far_tail_holding_trigger_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_holding_trigger_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/SPY_FAR_TAIL_HOLDING_TRIGGER_CONTRACT.md
      - .github/workflows/spy-far-tail-conditional-v1.yml

permissions:
  contents: write

concurrency:
  group: spy-far-tail-conditional-v2
  cancel-in-progress: true

jobs:
  conditional-research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Parquet runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv-spy-holding-trigger
          .venv-spy-holding-trigger/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0
      - name: Compile and test frozen trigger and accounting
        run: |
          set -euo pipefail
          PY=.venv-spy-holding-trigger/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          "$PY" -m py_compile "$BASE/run_spy_far_tail_conditional_v1.py" "$BASE/test_spy_far_tail_conditional_v1.py"
          "$PY" -m py_compile "$BASE/run_spy_far_tail_holding_trigger_v1.py" "$BASE/test_spy_far_tail_holding_trigger_v1.py"
          "$PY" "$BASE/test_spy_far_tail_conditional_v1.py"
          "$PY" "$BASE/test_spy_far_tail_holding_trigger_v1.py"
      - name: Run holding-period source-pinned trigger replay V2.1
        timeout-minutes: 270
        run: |
          set -euo pipefail
          PY=.venv-spy-holding-trigger/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          "$PY" "$BASE/run_spy_far_tail_holding_trigger_v1.py" --cache "$HOME/.cache/spy-options-holding-trigger-v1" | tee /tmp/spy-holding-trigger-run.json
          OUT="$BASE/results/spy_far_tail_holding_trigger_v1"
          for f in holding_trigger_events.csv holding_trade_level.csv holding_summary_by_period_phase.csv holding_robustness_by_period.csv holding_annual_by_entry_year.csv holding_manifest.json SPY_FAR_TAIL_HOLDING_TRIGGER_REPORT.md; do
            test -s "$OUT/$f"
          done
          cat "$OUT/SPY_FAR_TAIL_HOLDING_TRIGGER_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/spy-holding-trigger-run.json >> "$GITHUB_STEP_SUMMARY"
      - name: Commit holding-period report and outputs to isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_holding_trigger_v2"
          SNAPSHOT="$RUNNER_TEMP/spy_far_tail_holding_trigger_v2"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"
          cp -a "$OUT/." "$SNAPSHOT/"
          # Reconcile generated output against the current branch and retry a concurrent push.
          # The snapshot holds this run's complete outputs outside the resettable worktree.
          for attempt in 1 2 3 4 5; do
            git fetch origin research/spy-far-tail-conditional-v1
            git reset --hard origin/research/spy-far-tail-conditional-v1
            rm -rf "$OUT"
            mkdir -p "$OUT"
            cp -a "$SNAPSHOT/." "$OUT/"
            git add "$OUT"
            if git diff --cached --quiet; then
              echo "Holding-period V2 trigger outputs unchanged."
              exit 0
            fi
            git commit -m "research: record causal next-session SPY tail trigger replay V2.1"
            if git push origin HEAD:research/spy-far-tail-conditional-v1; then
              exit 0
            fi
            echo "Concurrent branch update on attempt $attempt; retrying output reconciliation."
          done
          echo "Could not push V2 result outputs after five branch reconciliations." >&2
          exit 1
