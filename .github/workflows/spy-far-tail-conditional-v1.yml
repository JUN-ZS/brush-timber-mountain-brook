name: SPY Far-Tail Conditional Risk Trigger V1

on:
  push:
    branches:
      - research/spy-far-tail-conditional-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/run_spy_far_tail_conditional_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_conditional_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/SPY_FAR_TAIL_CONDITIONAL_CONTRACT.md
      - .github/workflows/spy-far-tail-conditional-v1.yml

permissions:
  contents: write

concurrency:
  group: spy-far-tail-conditional-v1
  cancel-in-progress: false

jobs:
  conditional-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and test predeclared trigger and accounting
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          python3 -m py_compile "$BASE/run_spy_far_tail_conditional_v1.py" "$BASE/test_spy_far_tail_conditional_v1.py"
          (cd "$BASE" && python3 test_spy_far_tail_conditional_v1.py)
      - name: Run conditional trigger replay from frozen artifacts
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          python3 "$BASE/run_spy_far_tail_conditional_v1.py"
          OUT="$BASE/results/spy_far_tail_conditional_v1"
          for f in trigger_flags.csv conditional_trade_level.csv conditional_summary.csv conditional_annual_by_phase.csv conditional_annual_robustness.csv conditional_stress_grid.csv conditional_manifest.json SPY_FAR_TAIL_CONDITIONAL_REPORT.md; do
            test -s "$OUT/$f"
          done
          cat "$OUT/SPY_FAR_TAIL_CONDITIONAL_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit conditional results to isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_conditional_v1
          if git diff --cached --quiet; then
            echo "Conditional report outputs unchanged."
            exit 0
          fi
          git commit -m "research: record conditional SPY tail hedge replay"
          git fetch origin research/spy-far-tail-conditional-v1
          git rebase origin/research/spy-far-tail-conditional-v1
          git push origin HEAD:research/spy-far-tail-conditional-v1
