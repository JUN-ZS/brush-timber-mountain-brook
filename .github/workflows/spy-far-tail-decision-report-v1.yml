name: SPY Far-Tail Decision Report V1

on:
  push:
    branches:
      - research/spy-far-tail-hedge-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/build_spy_far_tail_decision_report_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_decision_report_v1.py
      - .github/workflows/spy-far-tail-decision-report-v1.yml

permissions:
  contents: write

concurrency:
  group: spy-far-tail-decision-report-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and test report logic
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          python3 -m py_compile "$BASE/build_spy_far_tail_decision_report_v1.py" "$BASE/test_spy_far_tail_decision_report_v1.py"
          (cd "$BASE" && python3 test_spy_far_tail_decision_report_v1.py)
      - name: Generate report from completed replay outputs
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          OUT="$BASE/results/spy_far_tail_hedge_v1"
          python3 "$BASE/build_spy_far_tail_decision_report_v1.py" --results-root "$OUT" --output "$OUT/SPY_FAR_TAIL_DECISION_REPORT.md"
          test -s "$OUT/SPY_FAR_TAIL_DECISION_REPORT.md"
          cat "$OUT/SPY_FAR_TAIL_DECISION_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report to research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_hedge_v1/SPY_FAR_TAIL_DECISION_REPORT.md
          if git diff --cached --quiet; then
            echo "Decision report unchanged."
            exit 0
          fi
          git commit -m "research: publish SPY far-tail hedge decision report"
          git fetch origin research/spy-far-tail-hedge-v1
          git rebase origin/research/spy-far-tail-hedge-v1
          git push origin HEAD:research/spy-far-tail-hedge-v1
