name: QQQ Spot vs Budgeted Long Calls — 10Y

on:
  push:
    branches:
      - research/qqq-spot-vs-call-budget-v1-20261027
    paths:
      - research/qqq_spot_vs_call_budget_v1.py
      - research/test_qqq_spot_vs_call_budget_v1.py
      - .github/workflows/qqq-spot-vs-call-budget-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    name: Historical quote replay (GitHub-hosted Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas pyarrow numpy scipy

      - name: Run deterministic unit tests
        run: |
          python -m py_compile research/qqq_spot_vs_call_budget_v1.py research/test_qqq_spot_vs_call_budget_v1.py
          python -m unittest discover -s research -p "test_qqq_spot_vs_call_budget_v1.py" -v

      - name: Download pinned canonical QQQ option and underlying data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 3 --retry-delay 2 \
            --output data/QQQ_options.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl --fail --location --retry 3 --retry-delay 2 \
            --output data/QQQ_underlying.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          du -h data/QQQ_options.parquet data/QQQ_underlying.parquet
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet

      - name: Verify hashes and replay ten-year windows
        run: |
          python research/qqq_spot_vs_call_budget_v1.py \
            --data-dir data \
            --out research/qqq_spot_vs_call_budget_v1/results/latest \
            --verify-pinned-hashes

      - name: Upload raw result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-spot-vs-call-budget-v1
          path: research/qqq_spot_vs_call_budget_v1/results/latest/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit reproducible results to isolated branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_spot_vs_call_budget_v1/results/latest/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "results: QQQ USD 7000 spot vs budgeted calls 10Y replay"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
