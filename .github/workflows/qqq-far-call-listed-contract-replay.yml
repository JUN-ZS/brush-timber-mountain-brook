name: QQQ Far-Call Listed-Contract EOD Replay

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - research/qqq-hybrid-vxx-short-call-put-v1-20261009
    paths:
      - research/qqq_hybrid_operator_terminal_v1/qqq_far_call_quote_replay.py
      - research/qqq_hybrid_operator_terminal_v1/test_qqq_far_call_quote_replay.py
      - research/qqq_hybrid_operator_terminal_v1/full_history_qqq_quote_audit.py
      - research/qqq_hybrid_operator_terminal_v1/audit_qqq_public_eod_options.py
      - research/qqq_hybrid_operator_terminal_v1/QQQ_FAR_CALL_REPLAY_CONTRACT.md
      - .github/workflows/qqq-far-call-listed-contract-replay.yml

permissions:
  contents: read

concurrency:
  group: qqq-far-call-listed-contract-replay
  cancel-in-progress: true

jobs:
  listed-contract-replay:
    name: SHA-pinned listed-contract QQQ call-credit replay
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime and pinned Parquet reader
        run: |
          py -3 --version || exit /b 1
          py -3 -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0 || exit /b 1

      - name: Restore previously verified public QQQ cache
        uses: actions/cache@v4
        with:
          path: .cache\qqq-options-full-history
          key: qqq-options-full-history-2018-2025-sha-pinned-v1

      - name: Compile and run offline regressions
        run: |
          py -3 -m py_compile research\qqq_hybrid_operator_terminal_v1\qqq_far_call_quote_replay.py || exit /b 1
          py -3 -m py_compile research\qqq_hybrid_operator_terminal_v1\test_qqq_far_call_quote_replay.py || exit /b 1
          py -3 research\qqq_hybrid_operator_terminal_v1\test_qqq_far_call_quote_replay.py || exit /b 1
          py -3 -m py_compile research\qqq_hybrid_operator_terminal_v1\full_history_qqq_quote_audit.py || exit /b 1
          py -3 -m py_compile research\qqq_hybrid_operator_terminal_v1\audit_qqq_public_eod_options.py || exit /b 1

      - name: Run SHA-pinned historical quote replay
        timeout-minutes: 38
        run: |
          if not exist artifacts\qqq_far_call_replay mkdir artifacts\qqq_far_call_replay
          py -3 research\qqq_hybrid_operator_terminal_v1\qqq_far_call_quote_replay.py --out artifacts\qqq_far_call_replay > QQQ_FAR_CALL_REPLAY_RUN.json || exit /b 1
          type QQQ_FAR_CALL_REPLAY_RUN.json || exit /b 1
          type artifacts\qqq_far_call_replay\qqq_far_call_replay_summary.md || exit /b 1
          type artifacts\qqq_far_call_replay\qqq_far_call_replay_summary.md >> "%GITHUB_STEP_SUMMARY%" || exit /b 1
          echo detail_trade_csv=artifacts\qqq_far_call_replay\qqq_far_call_replay_trades.csv
          echo detail_event_csv=artifacts\qqq_far_call_replay\qqq_far_call_replay_events.csv
          echo detail_daily_csv=artifacts\qqq_far_call_replay\qqq_far_call_replay_daily.csv
          echo output_retention=GitHub_Actions_artifact_14_days
      - name: Upload reproducible replay outputs
        uses: actions/upload-artifact@v4
        with:
          name: qqq-far-call-listed-contract-replay
          path: |
            QQQ_FAR_CALL_REPLAY_RUN.json
            artifacts/qqq_far_call_replay/qqq_far_call_replay_summary.json
            artifacts/qqq_far_call_replay/qqq_far_call_replay_summary.md
            artifacts/qqq_far_call_replay/qqq_far_call_replay_trades.csv
            artifacts/qqq_far_call_replay/qqq_far_call_replay_events.csv
            artifacts/qqq_far_call_replay/qqq_far_call_replay_daily.csv
          if-no-files-found: error
          retention-days: 14
