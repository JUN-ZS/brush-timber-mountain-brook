name: QQQ V22 FAR Budget-Dynamic N5 N10 V1

on:
  push:
    branches:
      - research/qqq-v22-far-budget-dynamic-n5-n10-20261002
    paths:
      - research/qqq_v22_far_budget_dynamic_n5_n10_v1.py
      - research/qqq_dynamic_near_long_state_engine_v22_930c949.py
      - .github/workflows/qqq-v22-far-budget-dynamic-n5-n10-v1.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy scipy

      - name: Download canonical QQQ data-v1
        shell: bash
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          python -c "import hashlib; print('options_sha256',hashlib.sha256(open('data/QQQ_options.parquet','rb').read()).hexdigest()); print('underlying_sha256',hashlib.sha256(open('data/QQQ_underlying.parquet','rb').read()).hexdigest())"

      - name: Verify frozen V22 engine content
        shell: bash
        run: |
          test -f research/qqq_dynamic_near_long_state_engine_v22_930c949.py
          echo "frozen_engine_git_blob=$(git hash-object research/qqq_dynamic_near_long_state_engine_v22_930c949.py)"
          test "$(git hash-object research/qqq_dynamic_near_long_state_engine_v22_930c949.py)" = "1fb0464b59c0d7d734007d44f675c610d3033d49"

      - name: Compile research runner
        run: |
          python -m py_compile research/qqq_v22_far_budget_dynamic_n5_n10_v1.py research/qqq_dynamic_near_long_state_engine_v22_930c949.py

      - name: Run matched-budget N5 vs N10
        run: |
          python research/qqq_v22_far_budget_dynamic_n5_n10_v1.py --data-dir data --out artifacts/far_budget_dynamic

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v22-far-budget-dynamic-n5-n10-v1
          path: artifacts/far_budget_dynamic/
          if-no-files-found: warn
