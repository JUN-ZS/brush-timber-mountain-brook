name: QQQ Mutual Chase Reserve State V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run-qqq-mutual-chase-reserve-state-v1.ts"
      - "research/qqq_hybrid_downside_convexity_v1/RESERVE_STATE_PREREGISTERED.md"
      - "src/data/universe.json"
      - ".github/workflows/qqq-mutual-chase-reserve-state-v1.yml"

permissions:
  contents: read

concurrency:
  group: qqq-mutual-chase-reserve-state-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reserve-state:
    name: Research / QQQ reserve state V1
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
      - name: Run fixed reserve-state research
        run: node --experimental-strip-types scripts/run-qqq-mutual-chase-reserve-state-v1.ts
      - name: Validate research output
        run: |
          test -s research/qqq_hybrid_downside_convexity_v1/qqq_mutual_chase_reserve_state_v1.json
          test -s research/qqq_hybrid_downside_convexity_v1/qqq_mutual_chase_reserve_state_v1.md
          test -s research/qqq_hybrid_downside_convexity_v1/qqq_mutual_chase_reserve_state_v1.csv
          node - <<'NODE'
          const fs = require("node:fs");
          const p = "research/qqq_hybrid_downside_convexity_v1/qqq_mutual_chase_reserve_state_v1.json";
          const x = JSON.parse(fs.readFileSync(p, "utf8"));
          if (x.researchId !== "QQQ_MUTUAL_CHASE_RESERVE_STATE_V1") throw new Error("wrong research id");
          if (x.status !== "RESEARCH_ONLY") throw new Error("wrong research status");
          if (x.fixedRules.reserveEligibility.futurePriceRead !== false) throw new Error("future price guard missing");
          if (x.fixedRules.reserveEligibility.parameterSearch !== false) throw new Error("parameter search guard missing");
          if (x.fixedRules.target !== "C_t = B*t/120; unchanged across all variants") throw new Error("target authority changed");
          if (!Array.isArray(x.windows) || x.windows.length !== x.provenance.completeRollingWindows) throw new Error("window count mismatch");
          if (x.provenance.completeRollingWindows <= 0) throw new Error("no rolling windows");
          console.log("PASS reserve-state windows=", x.windows.length);
          NODE
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqq-mutual-chase-reserve-state-v1
          path: research/qqq_hybrid_downside_convexity_v1
          if-no-files-found: error
