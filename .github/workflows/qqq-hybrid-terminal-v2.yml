name: QQQ Hybrid Terminal V2 Evolved QA

on:
  pull_request:
    paths:
      - "terminal/qqq_hybrid_deployment_v2/**"
      - ".github/workflows/qqq-hybrid-terminal-v2.yml"
  push:
    branches:
      - "feat/qqq-hybrid-terminal-v2-secondary-vx-golden-20261006"
    paths:
      - "terminal/qqq_hybrid_deployment_v2/**"
      - ".github/workflows/qqq-hybrid-terminal-v2.yml"

jobs:
  qa:
    runs-on: [self-hosted, grokbot-box-linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: JS syntax
        run: node --check terminal/qqq_hybrid_deployment_v2/engine.js && node --check terminal/qqq_hybrid_deployment_v2/app.js
      - name: Golden engine behavior
        run: node terminal/qqq_hybrid_deployment_v2/tests/golden_test.js
      - name: Python compile
        run: python -m py_compile terminal/qqq_hybrid_deployment_v2/server.py terminal/qqq_hybrid_deployment_v2/providers/databento_vx.py
      - name: Release manifest
        run: |
          test -f terminal/qqq_hybrid_deployment_v2/index.html
          test -f terminal/qqq_hybrid_deployment_v2/styles.css
          test -f terminal/qqq_hybrid_deployment_v2/app.js
          test -f terminal/qqq_hybrid_deployment_v2/engine.js
          test -f terminal/qqq_hybrid_deployment_v2/server.py
          test -f terminal/qqq_hybrid_deployment_v2/RUN.cmd
          test -f terminal/qqq_hybrid_deployment_v2/requirements-optional.txt
          echo "Release manifest PASS"
