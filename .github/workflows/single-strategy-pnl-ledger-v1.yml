name: Single Strategy PnL Reconciliation v1

on:
  pull_request:
    paths:
      - "research/strategy_instance_v1/**"
      - ".github/workflows/single-strategy-pnl-ledger-v1.yml"

permissions:
  contents: read

jobs:
  python-ledger-contract:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python runtime
        run: |
          python3 --version
          python3 -m compileall -q research/strategy_instance_v1
      - name: Verify operator inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("research/strategy_instance_v1/operator_dashboard.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("INLINE_SCRIPT_NOT_FOUND")
          script = html.rsplit("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/strategy-instance-operator.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/strategy-instance-operator.js
      - name: Run single-strategy ledger invariants
        run: python3 -m unittest research.strategy_instance_v1.test_single_strategy_pnl -v
      - name: Run pre-existing instance ledger regression checks
        run: |
          python3 - <<'PY'
          from research.strategy_instance_v1 import test_instance
          tests = sorted(
              (name, fn) for name, fn in vars(test_instance).items()
              if name.startswith("test_") and callable(fn)
          )
          for name, fn in tests:
              fn()
              print("PASS", name)
          print(f"PASS {len(tests)} pre-existing instance checks")
          PY
