name: QQQ SPY Incremental Funding / Correlation V1

on:
  push:
    branches:
      - research/qqq-spy-incremental-funding-gate-v1-20261008
    paths:
      - research/qqq_spy_self_financing_range_v1.py
      - research/qqq_spy_incremental_funding_correlation_v1.py
      - .github/workflows/qqq-spy-incremental-funding-correlation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

# Proven repo pattern: only the trusted self-hosted grokbot-box-linux-x64 runner.
# Do not open a PR from this research branch until this workflow is green.
concurrency:
  group: qqq-spy-incremental-funding-correlation-v1
  cancel-in-progress: true

jobs:
  trusted-replay:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/research/qqq-spy-incremental-funding-gate-v1-20261008'
    name: Trusted replay / grokbot-box-linux-x64
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Runtime preflight
        run: |
          set -euo pipefail
          echo "runner=$(hostname)"
          python3 --version
          command -v python3
          python3 -c "import duckdb, pandas, pyarrow, numpy; print('PASS required Python modules')"

      - name: Download canonical QQQ/SPY data
        run: |
          set -euo pipefail
          mkdir -p data artifacts/qqq_spy_incremental_trusted
          curl -L --fail --retry 4 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 4 -o data/SPY_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_options.parquet
          curl -L --fail --retry 4 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          curl -L --fail --retry 4 -o data/SPY_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_underlying.parquet
          test -s data/QQQ_options.parquet
          test -s data/SPY_options.parquet
          test -s data/QQQ_underlying.parquet
          test -s data/SPY_underlying.parquet

      - name: Contract gate
        run: |
          set -euo pipefail
          if grep -nF 'pair[' research/qqq_spy_incremental_funding_correlation_v1.py; then
            echo "ERROR: stale pair[] symbol remains"
            exit 1
          fi
          if grep -nF 'state.entry_date' research/qqq_spy_incremental_funding_correlation_v1.py; then
            echo "ERROR: stale state.entry_date contract remains"
            exit 1
          fi
          python3 -m py_compile research/qqq_spy_self_financing_range_v1.py
          python3 -m py_compile research/qqq_spy_incremental_funding_correlation_v1.py
          PYTHONPATH=research python3 -c "import qqq_spy_incremental_funding_correlation_v1 as m; assert m.NEW_POLICY == 'CORRELATION_MEDIAN_VETO'; print('PASS module contract')"

      - name: Run full sample
        run: |
          set -euo pipefail
          python3 research/qqq_spy_incremental_funding_correlation_v1.py             --data-dir data             --out artifacts/qqq_spy_incremental_trusted/full             --window full

      - name: Run locked evaluation windows
        run: |
          set -euo pipefail
          python3 research/qqq_spy_incremental_funding_correlation_v1.py             --data-dir data             --out artifacts/qqq_spy_incremental_trusted/oos             --window oos
          python3 research/qqq_spy_incremental_funding_correlation_v1.py             --data-dir data             --out artifacts/qqq_spy_incremental_trusted/late_oos             --window late_oos

      - name: Verify trial ledger and guardrails
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for window in ["full", "oos", "late_oos"]:
              p = Path("artifacts/qqq_spy_incremental_trusted") / window / "RESULTS.json"
              x = json.loads(p.read_text(encoding="utf-8"))
              assert x["guardrails"]["research_only"] is True
              assert x["guardrails"]["no_parameter_search"] is True
              assert x["guardrails"]["no_live_orders"] is True
              assert x["window"] == window
          p = Path("artifacts/qqq_spy_incremental_trusted/full/TRIAL_LEDGER.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          assert x["selection_status"] == "LOCKED_FOR_COMPARISON"
          assert x["total_variant_window_cells"] == 12
          assert x["no_parameter_search"] is True
          assert x["no_live_orders"] is True
          print("PASS trial ledger + all guardrails")
          PY

      - name: Upload trusted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-spy-incremental-trusted
          path: artifacts/qqq_spy_incremental_trusted/
          if-no-files-found: error
          retention-days: 30
