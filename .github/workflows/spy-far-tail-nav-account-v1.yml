name: SPY Far-Tail Single-Account NAV Replay V1

on:
  push:
    branches:
      - research/spy-far-tail-nav-account-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/run_spy_far_tail_nav_account_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_nav_account_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/run_spy_far_tail_holding_trigger_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/spy_far_tail_hedge_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/qqq_spy_put_fixed_phase_v1.py
      - .github/workflows/spy-far-tail-nav-account-v1.yml

permissions:
  contents: write

concurrency:
  group: spy-far-tail-nav-account-v1
  cancel-in-progress: false

jobs:
  single-account-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Parquet runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv-spy-nav
          .venv-spy-nav/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0
      - name: Compile and run NAV accounting tests
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          PY="$PWD/.venv-spy-nav/bin/python"
          "$PY" -m py_compile "$BASE/run_spy_far_tail_nav_account_v1.py" "$BASE/test_spy_far_tail_nav_account_v1.py"
          (cd "$BASE" && "$PY" test_spy_far_tail_nav_account_v1.py)
      - name: Run source-pinned single-account NAV replay
        timeout-minutes: 270
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          PY=.venv-spy-nav/bin/python
          "$PY" "$BASE/run_spy_far_tail_nav_account_v1.py" --cache "$HOME/.cache/spy-options-nav-account-v1" | tee /tmp/spy-far-tail-nav-run.json
          OUT="$BASE/results/spy_far_tail_nav_account_v1"
          for f in nav_daily.csv nav_annual.csv nav_summary.csv nav_manifest.json SPY_FAR_TAIL_NAV_ACCOUNT_REPORT.md; do
            test -s "$OUT/$f"
          done
          cat "$OUT/SPY_FAR_TAIL_NAV_ACCOUNT_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/spy-far-tail-nav-run.json >> "$GITHUB_STEP_SUMMARY"
      - name: Commit account NAV and annual outputs to isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+JUN-ZS@users.noreply.github.com"
          OUT=research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_nav_account_v1
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "Account NAV outputs are unchanged."
            exit 0
          fi
          git commit -m "research: record single-account SPY tail hedge NAV replay"
          git push origin HEAD:research/spy-far-tail-nav-account-v1
