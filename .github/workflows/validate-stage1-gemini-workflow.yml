name: Validate Stage 1 Gemini Workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage1-gemini-blind-review.yml"
      - ".github/workflows/validate-stage1-gemini-workflow.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stage1-gemini-blind-review.yml"
      - ".github/workflows/validate-stage1-gemini-workflow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-stage1-gemini-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download and verify pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version

      - name: Lint the Stage 1 Gemini workflow
        run: "$RUNNER_TEMP/actionlint-bin/actionlint" -color .github/workflows/stage1-gemini-blind-review.yml
