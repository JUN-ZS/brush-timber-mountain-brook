name: QQQ Airline Book V25
on:
  push:
    branches: [research/qqq-airline-book-v25-20260930]
    paths:
      - research/qqq_airline_book_v25.py
      - .github/workflows/qqq-airline-book-v25.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qqq-airline-book-v25
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data artifacts
          curl -L --fail --retry 3 -o data/QQQ_options.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
      - name: Run V25
        run: python research/qqq_airline_book_v25.py --data-dir data --out artifacts
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-airline-book-v25
          path: |
            artifacts/v25_result.json
            artifacts/v25_summary.csv
            artifacts/v25_flights.csv
          if-no-files-found: error
