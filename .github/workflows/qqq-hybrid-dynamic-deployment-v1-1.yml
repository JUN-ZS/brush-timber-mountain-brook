name: QQQ Hybrid Dynamic Deployment V1.1

on:
  push:
    branches:
      - research/qqq-hybrid-dynamic-deployment-v1-1-20260929
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqq-hybrid-dynamic-deployment-v1-1
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy
      - name: Verify repository fixture
        run: |
          sha256sum src/data/universe.json
      - name: Run frozen derived replay
        run: |
          python research/qqq_hybrid_dynamic_deployment_v1_1.py             --spots-path src/data/universe.json             --out artifacts
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-hybrid-dynamic-deployment-v1-1
          path: artifacts/
          if-no-files-found: error
