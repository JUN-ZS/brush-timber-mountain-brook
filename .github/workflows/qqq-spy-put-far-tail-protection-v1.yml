name: SPY Far-Tail PUT Protection Overlay V1

on:
  pull_request:
    branches:
      - research/qqq-spy-put-no-filter-frequency-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/spy_far_tail_hedge_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_hedge_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/SPY_FAR_TAIL_HEDGE_CONTRACT.md
      - .github/workflows/qqq-spy-put-far-tail-protection-v1.yml
  push:
    branches:
      - research/spy-far-tail-hedge-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/spy_far_tail_hedge_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_hedge_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/SPY_FAR_TAIL_HEDGE_CONTRACT.md
      - .github/workflows/qqq-spy-put-far-tail-protection-v1.yml

permissions:
  contents: write

concurrency:
  group: spy-far-tail-protection-v1
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run synthetic tests
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          python3 -m py_compile "$BASE/qqq_spy_put_fixed_phase_v1.py" "$BASE/spy_far_tail_hedge_v1.py" "$BASE/test_spy_far_tail_hedge_v1.py"
          python3 "$BASE/test_spy_far_tail_hedge_v1.py"

  replay:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout isolated SPY far-tail research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Parquet runtime
        run: |
          set -euo pipefail
          python3 -m venv .venv-spy-tail
          .venv-spy-tail/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0
      - name: Compile and test before downloading chain files
        run: |
          set -euo pipefail
          PY=.venv-spy-tail/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          "$PY" -m py_compile "$BASE/qqq_spy_put_fixed_phase_v1.py" "$BASE/spy_far_tail_hedge_v1.py" "$BASE/test_spy_far_tail_hedge_v1.py"
          "$PY" "$BASE/test_spy_far_tail_hedge_v1.py"
      - name: Run source-pinned far-tail overlay on base ledgers
        timeout-minutes: 270
        run: |
          set -euo pipefail
          PY=.venv-spy-tail/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          "$PY" "$BASE/spy_far_tail_hedge_v1.py" --spy-cache "$HOME/.cache/spy-options-far-tail-v1" --out "$BASE/results/spy_far_tail_hedge_v1" | tee /tmp/spy-far-tail-run.json
          test -s "$BASE/results/spy_far_tail_hedge_v1/manifest.json"
          test -s "$BASE/results/spy_far_tail_hedge_v1/report.md"
          test -s "$BASE/results/spy_far_tail_hedge_v1/summary.csv"
          test -s "$BASE/results/spy_far_tail_hedge_v1/trade_level.csv"
          test -s "$BASE/results/spy_far_tail_hedge_v1/entry_selection.csv"
          test -s "$BASE/results/spy_far_tail_hedge_v1/stress_grid.csv"
          cat "$BASE/results/spy_far_tail_hedge_v1/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/spy-far-tail-run.json >> "$GITHUB_STEP_SUMMARY"
      - name: Commit overlay ledgers and report to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_hedge_v1
          if git diff --cached --quiet; then
            echo "Far-tail results are unchanged."
            exit 0
          fi
          git commit -m "research: record SPY far-tail PUT hedge overlay replay"
          git fetch origin research/spy-far-tail-hedge-v1
          git rebase origin/research/spy-far-tail-hedge-v1
          git push origin HEAD:research/spy-far-tail-hedge-v1
