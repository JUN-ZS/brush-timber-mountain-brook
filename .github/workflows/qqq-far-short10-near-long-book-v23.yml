name: QQQ Far-Short10 Near-Long Book V23
on:
  push:
    branches: [research/qqq-far-short10-near-long-book-v23-20260930]
    paths:
      - research/qqq_far_short10_near_long_book_v23.py
      - .github/workflows/qqq-far-short10-near-long-book-v23.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qqq-far-short10-near-long-book-v23
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data artifacts
          curl -L --fail --retry 3 -o data/QQQ_options.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
      - name: Run V23
        run: python research/qqq_far_short10_near_long_book_v23.py --data-dir data --out artifacts
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-far-short10-near-long-book-v23
          path: |
            artifacts/v23_result.json
            artifacts/v23_summary.csv
            artifacts/v23_cycles.csv
          if-no-files-found: error
          continue-on-error: true
