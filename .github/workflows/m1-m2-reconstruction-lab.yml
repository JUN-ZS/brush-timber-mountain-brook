name: M1 M2 Masked Reconstruction Lab QA

on:
  pull_request:
    paths:
      - "research/m1_m2_reconstruction_lab/**"
      - "research/data/vx_m1_m2_external_2016_2022.csv"
      - "research/data/archive_spots_overlap_2018_2022.csv"
      - "research/m1_m2_reconstruction_lab/ARCHIVE_CONTRACT.md"
      - "research/m1_m2_reconstruction_lab/REAL_OBSERVED_CONTROL.md"
      - ".github/workflows/m1-m2-reconstruction-lab.yml"
  push:
    branches:
      - "research/m1-m2-mask-reconstruction-lab-v1-20261006"
      - "feat/m1-m2-mask-reconstruction-lab-v1-20261006"
    paths:
      - "research/m1_m2_reconstruction_lab/**"
      - "research/data/vx_m1_m2_external_2016_2022.csv"
      - "research/data/archive_spots_overlap_2018_2022.csv"
      - ".github/workflows/m1-m2-reconstruction-lab.yml"

jobs:
  qa:
    runs-on: [self-hosted, grokbot-box-linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install numpy pandas scipy
      - name: JS syntax
        run: |
          node --check research/m1_m2_reconstruction_lab/engine.js
          node --check research/m1_m2_reconstruction_lab/app.js
          node --check research/m1_m2_reconstruction_lab/tests/golden_test.js
          node --check research/m1_m2_reconstruction_lab/tests/real_historical_state_replay.js
      - name: Golden reconstruction behavior
        run: node research/m1_m2_reconstruction_lab/tests/golden_test.js
      - name: REAL historical state replay
        run: node research/m1_m2_reconstruction_lab/tests/real_historical_state_replay.js
      - name: REAL M1/M2 controlled P&L sensitivity
        run: |
          .venv/bin/python research/m1_m2_reconstruction_lab/tests/real_m1_m2_pnl_sensitivity.py \
            --spots research/data/archive_spots_overlap_2018_2022.csv \
            --m1m2 research/data/vx_m1_m2_external_2016_2022.csv \
            --out artifacts/real-m1m2-pnl
      - name: Dataset contract
        run: |
          test -f research/data/vx_m1_m2_external_2016_2022.csv
          test -f research/data/archive_spots_overlap_2018_2022.csv
          test -f research/m1_m2_reconstruction_lab/ARCHIVE_CONTRACT.md
          test -f research/m1_m2_reconstruction_lab/REAL_OBSERVED_CONTROL.md
          test -f research/m1_m2_reconstruction_lab/REAL_HISTORICAL_STATE_REPLAY.md
          test -f research/data/real_historical_state_replay_2018_2022.csv
          .venv/bin/python - <<'PY'
          import csv
          p="research/data/vx_m1_m2_external_2016_2022.csv"
          with open(p,newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==1540, len(rows)
          assert rows[0]["Date"].startswith("2022-04-08"), rows[0]["Date"]
          assert rows[-1]["Date"].startswith("2016-03-01"), rows[-1]["Date"]

          p2="research/data/real_historical_state_replay_2018_2022.csv"
          with open(p2,newline="",encoding="utf-8") as f:
              replay=list(csv.DictReader(f))
          assert len(replay)==1540, len(replay)
          assert replay[0]["Date"]=="2016-03-01", replay[0]["Date"]
          assert replay[-1]["Date"]=="2022-04-08", replay[-1]["Date"]
          assert all(r["provenance"]=="OBSERVED_REPLAY" for r in replay)
          print("Dataset + replay contract PASS", len(rows), len(replay))
          PY
      - name: Upload M1/M2 controlled P&L artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-m1m2-controlled-pnl
          path: artifacts/real-m1m2-pnl
          if-no-files-found: error
          retention-days: 14
      - name: Upload observed replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-historical-state-replay
          path: |
            research/data/real_historical_state_replay_2018_2022.csv
            research/m1_m2_reconstruction_lab/REAL_HISTORICAL_STATE_REPLAY.md
          if-no-files-found: error
          retention-days: 14
