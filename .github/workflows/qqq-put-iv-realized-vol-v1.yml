name: QQQ Put IV versus Realized Volatility — Historical EOD Research

on:
  push:
    branches:
      - feat/qqq-hybrid-operator-terminal-v1-20261009
    paths:
      - research/qqq_put_ratio_exit_study_v1/qqq_put_iv_realized_vol_study_v1.py
      - research/qqq_put_ratio_exit_study_v1/test_qqq_put_iv_realized_vol_study_v1.py
      - .github/workflows/qqq-put-iv-realized-vol-v1.yml
  pull_request:
    types: [opened, reopened]
    branches:
      - research/qqq-hybrid-vxx-short-call-put-v1-20261009
    paths:
      - research/qqq_put_ratio_exit_study_v1/qqq_put_iv_realized_vol_study_v1.py
      - research/qqq_put_ratio_exit_study_v1/test_qqq_put_iv_realized_vol_study_v1.py
      - .github/workflows/qqq-put-iv-realized-vol-v1.yml

permissions:
  contents: write

concurrency:
  group: qqq-put-iv-realized-vol-v1
  cancel-in-progress: true

jobs:
  qqq-iv-rv:
    name: SHA-pinned QQQ source-IV / RV20 / forward-move profile
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime and pinned Parquet reader
        run: |
          py -3 --version || exit /b 1
          py -3 -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0 || exit /b 1

      - name: Restore SHA-verified historical QQQ option cache
        uses: actions/cache@v4
        with:
          path: .cache\qqq-options-full-history
          key: qqq-options-full-history-2018-2025-sha-pinned-v1

      - name: Compile and run offline IV-contract tests
        run: |
          py -3 -m py_compile research\qqq_put_ratio_exit_study_v1\qqq_put_iv_realized_vol_study_v1.py || exit /b 1
          py -3 -m py_compile research\qqq_put_ratio_exit_study_v1\test_qqq_put_iv_realized_vol_study_v1.py || exit /b 1
          py -3 research\qqq_put_ratio_exit_study_v1\test_qqq_put_iv_realized_vol_study_v1.py || exit /b 1

      - name: Run SHA-pinned daily QQQ source-IV profile
        timeout-minutes: 40
        run: |
          py -3 research\qqq_put_ratio_exit_study_v1\qqq_put_iv_realized_vol_study_v1.py --out artifacts\qqq_put_ratio_exit_study_v1 > QQQ_PUT_IV_REALIZED_VOL_V1_RUN.json || exit /b 1
          type QQQ_PUT_IV_REALIZED_VOL_V1_RUN.json || exit /b 1
          type artifacts\qqq_put_ratio_exit_study_v1\qqq_put_iv_realized_vol_study_v1.md || exit /b 1
          type artifacts\qqq_put_ratio_exit_study_v1\qqq_put_iv_realized_vol_study_v1.md >> "%GITHUB_STEP_SUMMARY%" || exit /b 1
          py -3 -c "from pathlib import Path; p=[Path('QQQ_PUT_IV_REALIZED_VOL_V1_RUN.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_iv_realized_vol_study_v1.json'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_iv_realized_vol_study_v1.md'),Path('artifacts/qqq_put_ratio_exit_study_v1/qqq_put_iv_realized_vol_daily_v1.csv')]; m=[str(x) for x in p if not x.is_file()]; assert not m, 'missing IV outputs: '+repr(m); print('direct_qqq_iv_outputs_exist=PASS')" || exit /b 1


      - name: Persist QQQ IV-RV profile outputs to recovery branch
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.run_id }}-a${{ github.run_attempt }}"
          $payload = Join-Path $env:RUNNER_TEMP ("recovery-payload-" + $tag)
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          $items = @('QQQ_PUT_IV_REALIZED_VOL_V1_RUN.json','artifacts\qqq_put_ratio_exit_study_v1\qqq_put_iv_realized_vol_study_v1.json','artifacts\qqq_put_ratio_exit_study_v1\qqq_put_iv_realized_vol_study_v1.md','artifacts\qqq_put_ratio_exit_study_v1\qqq_put_iv_realized_vol_daily_v1.csv')
          foreach ($rel in $items) { $full = Join-Path $env:GITHUB_WORKSPACE $rel; if (!(Test-Path $full)) { throw ('Missing IV-RV output: ' + $rel) }; Copy-Item -Path $full -Destination $payload -Force }
          git fetch origin "refs/heads/research/app-artifact-recovery-20261016:refs/remotes/origin/research/app-artifact-recovery-20261016"
          git checkout -B recovery-output "origin/research/app-artifact-recovery-20261016"
          $dest = "research/artifact_recovery_20261016/put_iv_realized_vol/rerun-" + $tag
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $payload '*') -Destination $dest -Recurse -Force
          @("run_id=$env:GITHUB_RUN_ID","run_attempt=$env:GITHUB_RUN_ATTEMPT","tested_sha=$env:GITHUB_SHA","source_branch=$env:GITHUB_REF_NAME","source_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","output=source_IV_vs_RV20_and_forward_move_profile") | Set-Content -Path (Join-Path $dest 'RECOVERY_META.txt') -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $dest
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "recover: persist Persist QQQ IV-RV profile outputs to recovery branch outputs $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Recovery commit failed' }
            $pushed = $false
            for ($attempt = 0; $attempt -lt 3; $attempt++) {
              git push origin HEAD:research/app-artifact-recovery-20261016
              if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
              git fetch origin "refs/heads/research/app-artifact-recovery-20261016:refs/remotes/origin/research/app-artifact-recovery-20261016"
              git rebase "origin/research/app-artifact-recovery-20261016"
              if ($LASTEXITCODE -ne 0) { throw 'Recovery rebase failed' }
            }
            if (!$pushed) { throw 'Recovery push failed after retries' }
          } else {
            Write-Host 'No new recovery files to commit'
          }

      - name: Upload IV study outputs (non-blocking if Actions storage is full)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qqq-put-iv-realized-vol-v1
          path: |
            QQQ_PUT_IV_REALIZED_VOL_V1_RUN.json
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_iv_realized_vol_study_v1.json
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_iv_realized_vol_study_v1.md
            artifacts/qqq_put_ratio_exit_study_v1/qqq_put_iv_realized_vol_daily_v1.csv
          if-no-files-found: error
          retention-days: 14
