name: QQQ Original Sentence Loop V1

on:
  push:
    branches:
      - research/qqq-original-sentence-loop-v1-20260929
    paths:
      - research/qqq_original_sentence_loop_v1.py
      - research/QQQ_ORIGINAL_SENTENCE_LOOP_V1_README.md
      - .github/workflows/qqq-original-sentence-loop-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqq-original-sentence-loop-v1
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ chain
        run: |
          mkdir -p data
          gh release download data-v1 \
            --repo lambdaclass/options_portfolio_backtester \
            --pattern "QQQ_options.parquet" \
            --pattern "QQQ_underlying.parquet" \
            --dir data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run original-sentence loop V1
        run: |
          python research/qqq_original_sentence_loop_v1.py \
            --data-dir data \
            --out artifacts
      - name: Show result json
        if: always()
        run: |
          if [ -f artifacts/qqq_original_sentence_loop_v1_result.json ]; then
            cat artifacts/qqq_original_sentence_loop_v1_result.json
          else
            echo "NO_RESULT_JSON"
            ls -la artifacts || true
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-original-sentence-loop-v1
          path: artifacts/
          if-no-files-found: error
