name: QQQ Research Sync — Grok Bot Linux

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - research/qqq-hybrid-vxx-short-call-put-v1-20261009
    paths:
      # Long historical jobs run only when their research inputs or contracts change.
      # UI/HUB-only commits are covered by the compact Windows terminal QA.
      - research/qqq_hybrid_operator_terminal_v1/qqq_far_call_quote_replay.py
      - research/qqq_hybrid_operator_terminal_v1/test_qqq_far_call_quote_replay.py
      - research/qqq_hybrid_operator_terminal_v1/qqq_far_call_incremental_decomposition.py
      - research/qqq_hybrid_operator_terminal_v1/test_qqq_far_call_incremental_decomposition.py
      - research/qqq_hybrid_operator_terminal_v1/full_history_qqq_quote_audit.py
      - research/qqq_hybrid_operator_terminal_v1/test_full_history_qqq_quote_audit.py
      - research/qqq_hybrid_operator_terminal_v1/audit_qqq_public_eod_options.py
      - research/qqq_hybrid_operator_terminal_v1/test_qqq_price_basis_audit.py
      - research/qqq_hybrid_operator_terminal_v1/QQQ_FAR_CALL_REPLAY_CONTRACT.md
      - research/qqq_hybrid_operator_terminal_v1/QQQ_FAR_CALL_INCREMENTAL_VALUE_V2.md
      - research/qqq_hybrid_dynamic_deployment_v1_1_replay.py
      - src/data/universe.json
      - .github/workflows/qqq-far-call-listed-contract-replay.yml
      - .github/workflows/qqq-public-eod-chain-audit.yml
      - .github/workflows/qqq-public-eod-full-history-audit.yml
      - .github/workflows/qqq-hybrid-operator-terminal-v1.yml
      - .github/workflows/qqq-research-grokbot-linux.yml

permissions:
  contents: read

concurrency:
  group: qqq-research-grokbot-linux
  cancel-in-progress: false

jobs:
  far-call-replay:
    name: Grok Bot Linux / Listed-contract replay + decomposition
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0

      - name: Attach persistent runner-local SHA-verified option cache
        shell: bash
        run: |
          set -euo pipefail
          local_cache="$HOME/.cache/qqq-options-full-history"
          mkdir -p "$local_cache" .cache
          if [[ -d .cache/qqq-options-full-history && ! -L .cache/qqq-options-full-history ]]; then
            cp -an .cache/qqq-options-full-history/. "$local_cache/" || true
            rm -rf .cache/qqq-options-full-history
          fi
          rm -f .cache/qqq-options-full-history
          ln -s "$local_cache" .cache/qqq-options-full-history
          echo "runner_local_option_cache=$local_cache"
          du -sh "$local_cache" || true
          echo "GitHub Actions cache save/upload disabled; SHA pins remain enforced by research code."

      - name: Compile and run replay regressions
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/qqq_far_call_quote_replay.py
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/test_qqq_far_call_quote_replay.py
          $PY research/qqq_hybrid_operator_terminal_v1/test_qqq_far_call_quote_replay.py
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/qqq_far_call_incremental_decomposition.py
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/test_qqq_far_call_incremental_decomposition.py
          $PY research/qqq_hybrid_operator_terminal_v1/test_qqq_far_call_incremental_decomposition.py
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/full_history_qqq_quote_audit.py
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/audit_qqq_public_eod_options.py

      - name: Run SHA-pinned replay and V2 decomposition
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          mkdir -p artifacts/qqq_far_call_replay
          $PY research/qqq_hybrid_operator_terminal_v1/qqq_far_call_quote_replay.py --out artifacts/qqq_far_call_replay > QQQ_FAR_CALL_REPLAY_RUN.json
          cat QQQ_FAR_CALL_REPLAY_RUN.json
          cat artifacts/qqq_far_call_replay/qqq_far_call_replay_summary.md
          cat artifacts/qqq_far_call_replay/qqq_far_call_replay_summary.md >> "$GITHUB_STEP_SUMMARY"
          $PY - <<'PY'
          from pathlib import Path
          required = [
              Path("QQQ_FAR_CALL_REPLAY_RUN.json"),
              Path("artifacts/qqq_far_call_replay/qqq_far_call_replay_summary.json"),
              Path("artifacts/qqq_far_call_replay/qqq_far_call_replay_summary.md"),
              Path("artifacts/qqq_far_call_replay/qqq_far_call_replay_trades.csv"),
              Path("artifacts/qqq_far_call_replay/qqq_far_call_replay_events.csv"),
              Path("artifacts/qqq_far_call_replay/qqq_far_call_replay_daily.csv"),
              Path("artifacts/qqq_far_call_replay/qqq_far_call_replay_attribution.json"),
              Path("artifacts/qqq_far_call_replay/qqq_far_call_replay_attribution.csv"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          assert not missing, f"missing replay outputs: {missing!r}"
          print("all_replay_outputs_exist=PASS")
          PY
          $PY research/qqq_hybrid_operator_terminal_v1/qqq_far_call_incremental_decomposition.py --input-dir artifacts/qqq_far_call_replay --out-dir artifacts/qqq_far_call_replay/incremental_decomposition > QQQ_FAR_CALL_INCREMENTAL_DECOMPOSITION_RUN.json
          cat QQQ_FAR_CALL_INCREMENTAL_DECOMPOSITION_RUN.json
          cat artifacts/qqq_far_call_replay/incremental_decomposition/qqq_far_call_incremental_decomposition.md
          cat artifacts/qqq_far_call_replay/incremental_decomposition/qqq_far_call_incremental_decomposition.md >> "$GITHUB_STEP_SUMMARY"
          $PY - <<'PY'
          from pathlib import Path
          required = [
              Path("QQQ_FAR_CALL_INCREMENTAL_DECOMPOSITION_RUN.json"),
              Path("artifacts/qqq_far_call_replay/incremental_decomposition/qqq_far_call_incremental_decomposition.json"),
              Path("artifacts/qqq_far_call_replay/incremental_decomposition/qqq_far_call_incremental_decomposition.md"),
              Path("artifacts/qqq_far_call_replay/incremental_decomposition/qqq_far_call_incremental_decomposition.csv"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          assert not missing, f"missing decomposition outputs: {missing!r}"
          print("all_incremental_decomposition_outputs_exist=PASS")
          PY

  public-eod-audits:
    name: Grok Bot Linux / Public EOD samples + full-history quote audit
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0

      - name: Attach persistent runner-local SHA-verified option cache
        shell: bash
        run: |
          set -euo pipefail
          local_cache="$HOME/.cache/qqq-options-full-history"
          mkdir -p "$local_cache" .cache
          if [[ -d .cache/qqq-options-full-history && ! -L .cache/qqq-options-full-history ]]; then
            cp -an .cache/qqq-options-full-history/. "$local_cache/" || true
            rm -rf .cache/qqq-options-full-history
          fi
          rm -f .cache/qqq-options-full-history
          ln -s "$local_cache" .cache/qqq-options-full-history
          echo "runner_local_option_cache=$local_cache"
          du -sh "$local_cache" || true
          echo "GitHub Actions cache save/upload disabled; SHA pins remain enforced by research code."

      - name: Run sample source audit and price-basis regressions
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/audit_qqq_public_eod_options.py
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/test_qqq_price_basis_audit.py
          $PY research/qqq_hybrid_operator_terminal_v1/test_qqq_price_basis_audit.py
          $PY research/qqq_hybrid_operator_terminal_v1/audit_qqq_public_eod_options.py

      - name: Run full-history quote audit offline regressions
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv/bin/python
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/full_history_qqq_quote_audit.py
          $PY -m py_compile research/qqq_hybrid_operator_terminal_v1/test_full_history_qqq_quote_audit.py
          $PY research/qqq_hybrid_operator_terminal_v1/test_full_history_qqq_quote_audit.py

      - name: Stream SHA-pinned 2018-2025 full-history quote audit
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/qqq-options-full-history
          .venv/bin/python research/qqq_hybrid_operator_terminal_v1/full_history_qqq_quote_audit.py > QQQ_FULL_HISTORY_AUDIT_LOG.json
          cat QQQ_FULL_HISTORY_AUDIT_LOG.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          raw = Path("QQQ_FULL_HISTORY_AUDIT_LOG.json").read_text(encoding="utf-8")
          begin = "QQQ_FULL_HISTORY_AUDIT_BEGIN"
          end = "QQQ_FULL_HISTORY_AUDIT_END"
          assert begin in raw and end in raw, "full-history audit markers missing"
          payload = raw.split(begin, 1)[1].split(end, 1)[0].strip()
          report = json.loads(payload)
          compact = {
              "research_id": report.get("research_id"),
              "overall": report.get("overall"),
              "integrity_ok": report.get("integrity_ok"),
              "not_a_strategy_backtest": report.get("not_a_strategy_backtest"),
              "trade_replay_approved": report.get("trade_replay_approved"),
              "window": report.get("window"),
              "coverage": report.get("coverage"),
              "overall_alignment": report.get("overall_alignment"),
              "annual_summary": report.get("annual_summary"),
              "vix_regime_summary": report.get("vix_regime_summary"),
              "basis_comparison": report.get("basis_comparison"),
              "adverse_fill_sensitivity": report.get("adverse_fill_sensitivity"),
              "file_integrity": {
                  name: {key: meta.get(key) for key in ("status", "bytes", "git_blob_sha")}
                  for name, meta in (report.get("file_integrity") or {}).items()
              },
              "model_source_integrity": report.get("model_source_integrity"),
              "limitations": report.get("limitations"),
          }
          print("## QQQ full-history audit — compact verified summary")
          print()
          print("` ` `json".replace(" ", ""))
          print(json.dumps(compact, indent=2, sort_keys=True))
          print("` ` `".replace(" ", ""))
          with open(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]), "a", encoding="utf-8") as out:
              out.write("## QQQ full-history audit — compact verified summary\n\n")
              out.write("```json\n")
              out.write(json.dumps(compact, indent=2, sort_keys=True))
              out.write("\n```\n")
          PY

  operator-terminal-qa:
    name: Grok Bot Linux / Hybrid terminal tests + no-broker boundary
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 --version

      - name: JavaScript syntax and golden tests
        shell: bash
        run: |
          set -euo pipefail
          node --check research/qqq_hybrid_operator_terminal_v1/engine.js
          node --check research/qqq_hybrid_operator_terminal_v1/app.js
          node --check research/qqq_hybrid_operator_terminal_v1/hub_research_pack.js
          node --check research/qqq_hybrid_operator_terminal_v1/hub_research_pack_ui.js
          node --check research/qqq_hybrid_operator_terminal_v1/option_chain_lab.js
          node research/qqq_hybrid_operator_terminal_v1/tests/engine.test.cjs
          node research/qqq_hybrid_operator_terminal_v1/tests/hub_research_pack.test.cjs
          node research/qqq_hybrid_operator_terminal_v1/tests/chain_lab.test.cjs
          node research/qqq_hybrid_operator_terminal_v1/tests/research_lockbox.test.cjs

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/qqq_hybrid_operator_terminal_v1/server.py
          python3 -m py_compile research/qqq_hybrid_operator_terminal_v1/probe_dolthub_vxx_options.py

      - name: Static asset and no-broker contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("research/qqq_hybrid_operator_terminal_v1")
          required = [
              "index.html", "app.js", "engine.js", "styles.css", "server.py", "README.md",
              "hub_research_pack.html", "hub_research_pack.js", "hub_research_pack_ui.js",
              "tests/engine.test.cjs", "tests/hub_research_pack.test.cjs",
              "tests/fixtures/user_uploaded_option_chain_2026-11-20.json",
              "option_chain_lab.html", "option_chain_lab.js", "tests/chain_lab.test.cjs",
              "tests/research_lockbox.test.cjs",
          ]
          missing = [x for x in required if not (p / x).is_file()]
          assert not missing, f"missing files: {missing!r}"
          s = (p / "server.py").read_text(encoding="utf-8")
          assert "place_order" not in s and "unlock_trade" not in s and "/api/journal" in s
          e = (p / "engine.js").read_text(encoding="utf-8")
          assert e.count("mainBudgetEligible: true") == 2
          h = (p / "index.html").read_text(encoding="utf-8")
          assert "current-qqqShares" in h and "current-vxxShortShares" in h
          assert "Set current quantity = 1000" in h and "OUTSIDE MAIN BUDGET" in h
          assert "proDashboard" in h and "proRiskDonut" in h and "proAllocationRows" in h
          lab = (p / "option_chain_lab.html").read_text(encoding="utf-8")
          assert "QQQ / VXX Option Chain Lab" in lab and "option_chain_lab.js" in lab
          assert "vxxPutRiskPct" not in h and 'data-find="vxxPut"' not in h
          a = (p / "app.js").read_text(encoding="utf-8")
          assert "function renderProDashboard(result, input)" in a
          assert "renderProDashboard(result, input)" in a and "vxxPutRiskPct:p." not in a
          print("terminal_asset_contract=PASS")
          PY

      - name: Emit QA summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qqq_hybrid_operator_terminal_v1
          {
            echo "QQQ_HYBRID_OPERATOR_TERMINAL_V1=PASS"
            echo "runner=grokbot-box-linux-x64"
            echo "broker_orders=FALSE"
            echo "sizing=CAPITAL_FIRST_MAIN_SELLER_WHITELIST"
          } | tee artifacts/qqq_hybrid_operator_terminal_v1/qa_summary.txt
          cat artifacts/qqq_hybrid_operator_terminal_v1/qa_summary.txt >> "$GITHUB_STEP_SUMMARY"
