name: QQQ Hybrid Profit Trend Replay V1

on:
  push:
    branches:
      - research/qqq-hybrid-profit-trend-replay-v1-20261009
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqq-hybrid-profit-trend-replay-v1
  cancel-in-progress: true

jobs:
  replay:
    name: Historical hybrid replay / profit trend export
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          node --version

      - name: Verify replay and data inputs
        run: |
          python -c "import hashlib,pathlib; p=pathlib.Path('research/qqq_hybrid_dynamic_deployment_v1_1_replay.py'); print('replay_sha256=' + hashlib.sha256(p.read_bytes()).hexdigest())"
          python -c "import hashlib,pathlib; p=pathlib.Path('src/data/universe.json'); print('universe_sha256=' + hashlib.sha256(p.read_bytes()).hexdigest())"
          python -c "import json; d=json.load(open('src/data/universe.json',encoding='utf-8')); print('asof=' + str(d.get('asof'))); print('series=' + ','.join(sorted(k for k in d.get('c',{}).keys()))); print('dates=' + str(len(d.get('dates',[]))))"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy

      - name: Run historical baseline replay
        run: |
          if not exist artifacts\qqq_hybrid_profit_trend_replay_v1\baseline mkdir artifacts\qqq_hybrid_profit_trend_replay_v1\baseline
          python research\qqq_hybrid_profit_trend_replay_v1.py --spots-path src\data\universe.json --out artifacts\qqq_hybrid_profit_trend_replay_v1\baseline

      - name: Run historical dynamic V1.1 replay
        run: |
          if not exist artifacts\qqq_hybrid_profit_trend_replay_v1\dynamic mkdir artifacts\qqq_hybrid_profit_trend_replay_v1\dynamic
          python research\qqq_hybrid_profit_trend_replay_v1.py --spots-path src\data\universe.json --out artifacts\qqq_hybrid_profit_trend_replay_v1\dynamic --dynamic

      - name: Contract checks
        run: |
          python -m py_compile research\qqq_hybrid_dynamic_deployment_v1_1_replay.py
          python -m py_compile research\qqq_hybrid_profit_trend_replay_v1.py
          python -c "import json; from pathlib import Path; r=json.loads(Path('artifacts/qqq_hybrid_profit_trend_replay_v1/baseline/profit_trend.json').read_text(encoding='utf-8')); assert r['not_opra'] is True; assert r['current_sizing_contract']['qqq_core_pct']=='EXTERNAL_INPUT'; assert r['backtest_result']['final_nav'] > 0; print('baseline_contract=PASS')"
          python -c "import json; from pathlib import Path; r=json.loads(Path('artifacts/qqq_hybrid_profit_trend_replay_v1/dynamic/profit_trend.json').read_text(encoding='utf-8')); assert r['not_opra'] is True; assert r['current_sizing_contract']['qqq_core_pct']=='EXTERNAL_INPUT'; assert r['backtest_result']['final_nav'] > 0; print('dynamic_contract=PASS')"

      - name: Evidence
        uses: actions/upload-artifact@v4
        with:
          name: qqq-hybrid-profit-trend-replay-v1
          path: artifacts\qqq_hybrid_profit_trend_replay_v1\
          if-no-files-found: error
          retention-days: 30