name: QQQ ATM Put N10 N20 One-and-Done
on:
  push:
    branches:
      - research/qqq-put-nplus10-20-atm-20260930
    paths:
      - research/qqq_put_atm_n10_n20.py
      - .github/workflows/qqq-put-n10-n20-atm.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qqq-put-n10-n20-atm
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/QQQ_options.parquet             https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet             https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
      - name: Run ATM put N10 N20 replay
        run: |
          python research/qqq_put_atm_n10_n20.py --data-dir data --out artifacts
          cat artifacts/qqq_put_atm_n10_n20_result.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-put-atm-n10-n20
          path: |
            artifacts/qqq_put_atm_n10_n20_result.json
            artifacts/qqq_put_atm_n10_n20_summary.csv
          if-no-files-found: error
