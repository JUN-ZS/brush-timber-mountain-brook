name: evidence-ledger

on:
  pull_request:
    paths:
      - "research/evidence_v1/**"
      - "research/live_hedge_v1/**"
      - ".github/workflows/evidence-ledger.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Verify workspace
        shell: cmd
        run: |
          git status --short
          python --version
      - name: Run evidence tests
        shell: cmd
        run: |
          python -m unittest research.evidence_v1.test_evidence research.evidence_v1.test_lock_guard
      - name: Verify evidence ledger
        shell: cmd
        run: |
          python -m research.evidence_v1.seal
