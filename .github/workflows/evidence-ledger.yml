name: evidence-ledger

on:
  pull_request:
    paths:
      - "research/evidence_v1/**"
      - "research/live_hedge_v1/**"
      - "research/strategy_instance_v1/**"
      - "run_strategy_instance.cmd"
      - ".github/workflows/evidence-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit into a clean workspace
        uses: actions/checkout@v4
        with:
          clean: true
      - name: Verify runner runtime and workspace
        run: |
          set -euo pipefail
          git status --short
          python3 --version
      - name: Compile evidence, live desk and operator console
        run: |
          set -euo pipefail
          python3 -c "import pathlib,py_compile; [py_compile.compile(str(p),doraise=True) for p in pathlib.Path('research/evidence_v1').glob('*.py')]"
          python3 -c "import pathlib,py_compile; [py_compile.compile(str(p),doraise=True) for p in pathlib.Path('research/live_hedge_v1').glob('*.py')]"
          python3 -c "import pathlib,py_compile; [py_compile.compile(str(p),doraise=True) for p in pathlib.Path('research/strategy_instance_v1').glob('*.py')]"
      - name: Run evidence and instance tests
        run: |
          set -euo pipefail
          python3 -m unittest research.evidence_v1.test_evidence research.evidence_v1.test_lock_guard research.strategy_instance_v1.test_instance
      - name: Verify evidence ledger
        run: |
          set -euo pipefail
          python3 -m research.evidence_v1.seal
