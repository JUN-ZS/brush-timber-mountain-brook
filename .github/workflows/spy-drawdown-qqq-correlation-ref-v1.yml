name: SPY drawdown and QQQ correlation REF
on:
  pull_request:
    branches:
      - research/dte14-premium-matched-put-ratio-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/spy_drawdown_correlation_ref_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/qqq_spy_put_premium_matched_phase_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/weekly_drop_2pct_path_analysis_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_weekly_drop_filter_v1.py
      - .github/workflows/spy-drawdown-qqq-correlation-ref-v1.yml
permissions:
  contents: write
jobs:
  conditioned-ref:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pull request head branch
        uses: actions/checkout@v4
      - name: Switch to the actual PR head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout "$GITHUB_HEAD_REF"
      - name: Install pinned parquet dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-ref
          .venv-ref/bin/python -m pip install --disable-pip-version-check --no-warn-script-location pyarrow==21.0.0
      - name: Run conditioned historical REF
        shell: bash
        run: |
          set -euo pipefail
          .venv-ref/bin/python research/qqq_spy_put_fixed_ratio_size_gated_v1/spy_drawdown_correlation_ref_v1.py
          OUT=research/qqq_spy_put_fixed_ratio_size_gated_v1/results/premium_matched_dte14_q60_70_v1/spy_drawdown_correlation_ref_v1
          test -s "$OUT/REF_REPORT.md"
          test -s "$OUT/summary.json"
          test -s "$OUT/episode_classification.csv"
          .venv-ref/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/qqq_spy_put_fixed_ratio_size_gated_v1/results/premium_matched_dte14_q60_70_v1/spy_drawdown_correlation_ref_v1/summary.json")
          d=json.loads(p.read_text())
          assert d["status"] == "COMPLETED"
          assert len(d["summary"]) == 16, len(d["summary"])
          assert d["correlation"]["full_period_daily_close_return_pearson"] > 0
          print("Summary rows:", len(d["summary"]))
          print("Full-period daily-return correlation:", d["correlation"]["full_period_daily_close_return_pearson"])
          PY
      - name: Compile and test weekly SPY drop event filter
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-ref/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          "$PY" -m py_compile "$BASE/qqq_spy_put_premium_matched_phase_v1.py" "$BASE/weekly_drop_2pct_path_analysis_v1.py" "$BASE/test_spy_weekly_drop_filter_v1.py"
          "$PY" "$BASE/test_spy_weekly_drop_filter_v1.py"
      - name: Replay weekly SPY -2% trigger with 1:3 ratio
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-ref/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          OUT="$BASE/results/premium_matched_dte14_q60_70_v1/weekly_drop_2pct_trigger_v1"
          CACHE="$HOME/.cache/qqq-spy-weekly-drop-2pct-v1"
          "$PY" "$BASE/qqq_spy_put_premium_matched_phase_v1.py" \
            --start 2018-03-01 --end 2025-12-15 \
            --max-total-contracts 10 --entry-filter spy_weekly_drop_2pct_corr60_pos --sizing-mode fixed_ratio \
            --fixed-long-qty 1 --fixed-short-qty 3 --target-delta 0.25 \
            --dte-min 7 --dte-max 21 --dte-target 14 --cohort-stride-sessions 1 \
            --allow-overlapping-cohorts --qqq-premium-match-short-qty 6 \
            --qqq-target-abs-delta 0.65 --qqq-delta-tolerance 0.05 \
            --qqq-cache "$CACHE/qqq" --spy-cache "$CACHE/spy" --out "$OUT/ratio_1x3"
          for file in entry_cohort.csv trade_episodes.csv source_manifest.json summary.json summary.md; do test -s "$OUT/ratio_1x3/$file"; done
      - name: Replay weekly SPY -2% trigger with 1:6 ratio
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-ref/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          OUT="$BASE/results/premium_matched_dte14_q60_70_v1/weekly_drop_2pct_trigger_v1"
          CACHE="$HOME/.cache/qqq-spy-weekly-drop-2pct-v1"
          "$PY" "$BASE/qqq_spy_put_premium_matched_phase_v1.py" \
            --start 2018-03-01 --end 2025-12-15 \
            --max-total-contracts 10 --entry-filter spy_weekly_drop_2pct_corr60_pos --sizing-mode fixed_ratio \
            --fixed-long-qty 1 --fixed-short-qty 6 --target-delta 0.25 \
            --dte-min 7 --dte-max 21 --dte-target 14 --cohort-stride-sessions 1 \
            --allow-overlapping-cohorts --qqq-premium-match-short-qty 6 \
            --qqq-target-abs-delta 0.65 --qqq-delta-tolerance 0.05 \
            --qqq-cache "$CACHE/qqq" --spy-cache "$CACHE/spy" --out "$OUT/ratio_1x6"
          for file in entry_cohort.csv trade_episodes.csv source_manifest.json summary.json summary.md; do test -s "$OUT/ratio_1x6/$file"; done
      - name: Classify weekly-trigger cohorts by realized holding-period SPY drawdown
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-ref/bin/python
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          OUT="$BASE/results/premium_matched_dte14_q60_70_v1/weekly_drop_2pct_trigger_v1"
          CACHE="$HOME/.cache/qqq-spy-weekly-drop-2pct-v1"
          "$PY" "$BASE/weekly_drop_2pct_path_analysis_v1.py" --base "$OUT" --qqq-cache "$CACHE/qqq" --spy-cache "$CACHE/spy"
          test -s "$OUT/weekly_drop_2pct_path_conditioned/REF_REPORT.md"
          test -s "$OUT/weekly_drop_2pct_path_conditioned/summary.json"
          test -s "$OUT/weekly_drop_2pct_path_conditioned/episode_classification.csv"
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/qqq_spy_put_fixed_ratio_size_gated_v1/results/premium_matched_dte14_q60_70_v1/weekly_drop_2pct_trigger_v1/weekly_drop_2pct_path_conditioned/summary.json")
          d=json.loads(p.read_text())
          assert d["status"] == "COMPLETED"
          assert len(d["condition_summary"]) == 10, len(d["condition_summary"])
          assert set(d["run_stats"]) == {"1x3", "1x6"}
          print("Condition rows:", len(d["condition_summary"]))
          print("Run stats:", json.dumps(d["run_stats"], sort_keys=True))
          PY
      - name: Commit generated research outputs without source cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=research/qqq_spy_put_fixed_ratio_size_gated_v1/results/premium_matched_dte14_q60_70_v1/spy_drawdown_correlation_ref_v1
          rm -rf "$OUT/source_cache"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT/REF_REPORT.md" "$OUT/summary.json" "$OUT/episode_classification.csv"
          WEEKLY=research/qqq_spy_put_fixed_ratio_size_gated_v1/results/premium_matched_dte14_q60_70_v1/weekly_drop_2pct_trigger_v1
          git add "$WEEKLY/ratio_1x3" "$WEEKLY/ratio_1x6" "$WEEKLY/weekly_drop_2pct_path_conditioned"
          if git diff --cached --quiet; then
            echo "No generated output changes."
            exit 0
          fi
          git commit -m "Publish SPY drawdown and weekly drop QQQ correlation REF results"
          git push origin "HEAD:$GITHUB_HEAD_REF"
