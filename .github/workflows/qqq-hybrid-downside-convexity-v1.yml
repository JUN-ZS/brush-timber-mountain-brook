name: QQQ Hybrid Downside Convexity V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run-qqq-hybrid-downside-convexity-v1.ts"
      - "research/qqq_hybrid_downside_convexity_v1.md"
      - "src/data/universe.json"
      - ".github/workflows/qqq-hybrid-downside-convexity-v1.yml"

permissions:
  contents: read

jobs:
  deploy-convexity:
    name: Research / QQQ hybrid downside convexity V1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
      - name: Run fixed research
        run: node --experimental-strip-types scripts/run-qqq-hybrid-downside-convexity-v1.ts
      - name: Validate research output
        run: |
          test -s research/qqq_hybrid_downside_convexity_v1/qqq_hybrid_downside_convexity_v1.json
          test -s research/qqq_hybrid_downside_convexity_v1/qqq_hybrid_downside_convexity_v1.csv
          test -s research/qqq_hybrid_downside_convexity_v1/qqq_hybrid_downside_convexity_v1.md
          node - <<'NODE'
          const fs = require("node:fs");
          const p = "research/qqq_hybrid_downside_convexity_v1/qqq_hybrid_downside_convexity_v1.json";
          const x = JSON.parse(fs.readFileSync(p, "utf8"));
          if (x.researchId !== "QQQ_HYBRID_DOWNSIDE_CONVEXITY_V1") throw new Error("wrong research id");
          if (x.status !== "RESEARCH_ONLY") throw new Error("wrong research status");
          if (x.data.completeRollingWindows <= 0) throw new Error("no rolling windows");
          if (!Array.isArray(x.windows) || x.windows.length !== x.data.completeRollingWindows) throw new Error("window count mismatch");
          console.log("PASS windows=", x.windows.length);
          NODE
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqq-hybrid-downside-convexity-v1
          path: research/qqq_hybrid_downside_convexity_v1
          if-no-files-found: error