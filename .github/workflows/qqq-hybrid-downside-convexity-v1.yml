name: QQQ Hybrid Downside Convexity V1

on:
  push:
    branches:
      - research/qqq-hybrid-downside-convexity-v1-20260929
    paths:
      - research/qqq_hybrid_downside_convexity_v1.py
      - research/QQQ_HYBRID_DOWNSIDE_CONVEXITY_V1_README.md
      - .github/workflows/qqq-hybrid-downside-convexity-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - research/qqq_hybrid_downside_convexity_v1.py
      - research/QQQ_HYBRID_DOWNSIDE_CONVEXITY_V1_README.md
      - .github/workflows/qqq-hybrid-downside-convexity-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # frozen research replay trigger
  group: qqq-hybrid-downside-convexity-v1
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow
      - name: Download canonical QQQ chain
        run: |
          mkdir -p data
          gh release download data-v1 \
            --repo lambdaclass/options_portfolio_backtester \
            --pattern "QQQ_options.parquet" \
            --pattern "QQQ_underlying.parquet" \
            --dir data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run frozen hybrid downside convexity V1
        run: |
          python research/qqq_hybrid_downside_convexity_v1.py \
            --data-dir data \
            --out artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-hybrid-downside-convexity-v1
          path: artifacts/qqq_hybrid_downside_convexity_v1_*
          if-no-files-found: error
