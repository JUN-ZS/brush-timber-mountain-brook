name: SPY Long 1 Multi Short Call Balance V1

on:
  push:
    branches:
      - research/qqq-spy-bounded-crossover-ladder-v1-20261005
    paths:
      - research/spy_long_multi_short_call_balance_v1.py
      - research/qqq_spy_bounded_crossover_reanchor_v1.py
      - .github/workflows/spy-long-multi-short-call-balance-v1.yml
  workflow_dispatch:

concurrency:
  group: spy-long-multi-short-call-balance-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay-linux:
    name: Replay / Linux runner
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install duckdb pandas pyarrow numpy
      - name: Download canonical data
        run: |
          mkdir -p data artifacts/spy_balance_linux
          curl -L --fail --retry 4 -o data/SPY_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_options.parquet
          curl -L --fail --retry 4 -o data/SPY_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_underlying.parquet
      - name: Compile and run
        run: |
          .venv/bin/python -m py_compile research/qqq_spy_bounded_crossover_reanchor_v1.py
          .venv/bin/python -m py_compile research/spy_long_multi_short_call_balance_v1.py
          .venv/bin/python research/spy_long_multi_short_call_balance_v1.py --data-dir data --out artifacts/spy_balance_linux
          cat artifacts/spy_balance_linux/RESULTS.md
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-long-multi-short-call-balance-v1-linux
          path: artifacts/spy_balance_linux/
          if-no-files-found: warn

  replay-windows:
    name: Replay / Windows runner
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical data
        run: |
          mkdir -p data artifacts/spy_balance_windows
          curl.exe -L --fail --retry 4 -o data/SPY_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_options.parquet
          curl.exe -L --fail --retry 4 -o data/SPY_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_underlying.parquet
      - name: Compile and run
        run: |
          python -m py_compile research/qqq_spy_bounded_crossover_reanchor_v1.py
          python -m py_compile research/spy_long_multi_short_call_balance_v1.py
          python research/spy_long_multi_short_call_balance_v1.py --data-dir data --out artifacts/spy_balance_windows
          cat artifacts/spy_balance_windows/RESULTS.md
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-long-multi-short-call-balance-v1-windows
          path: artifacts/spy_balance_windows/
          if-no-files-found: warn
