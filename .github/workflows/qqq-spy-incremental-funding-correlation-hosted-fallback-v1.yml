name: QQQ SPY Incremental Funding / Correlation V1 — HOSTED FALLBACK

on:
  push:
    branches:
      - research/qqq-spy-incremental-funding-gate-v1-hosted-fallback-20261008
    paths:
      - research/qqq_spy_self_financing_range_v1.py
      - research/qqq_spy_incremental_funding_correlation_v1.py
      - .github/workflows/qqq-spy-incremental-funding-correlation-hosted-fallback-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Hosted compute / Windows
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas pyarrow numpy

      - name: Download canonical QQQ/SPY data
        run: |
          mkdir -p data artifacts/qqq_spy_incremental_hosted
          curl.exe -L --fail --retry 4 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl.exe -L --fail --retry 4 -o data/SPY_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_options.parquet
          curl.exe -L --fail --retry 4 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          curl.exe -L --fail --retry 4 -o data/SPY_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_underlying.parquet

      - name: Compile
        run: |
          python -m py_compile research/qqq_spy_self_financing_range_v1.py
          python -m py_compile research/qqq_spy_incremental_funding_correlation_v1.py

      - name: Full sample
        run: |
          python research/qqq_spy_incremental_funding_correlation_v1.py --data-dir data --out artifacts/qqq_spy_incremental_hosted/full --window full

      - name: OOS 2022+
        run: |
          python research/qqq_spy_incremental_funding_correlation_v1.py --data-dir data --out artifacts/qqq_spy_incremental_hosted/oos --window oos

      - name: Late OOS 2024+
        run: |
          python research/qqq_spy_incremental_funding_correlation_v1.py --data-dir data --out artifacts/qqq_spy_incremental_hosted/late_oos --window late_oos

      - name: Evidence
        if: always()
        run: |
          for f in artifacts/qqq_spy_incremental_hosted/*/RESULTS.md; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-spy-incremental-hosted-fallback
          path: artifacts/qqq_spy_incremental_hosted/
          if-no-files-found: error
