name: QQQ SPY Relative Range Convexity V2

on:
  push:
    branches:
      - research/qqq-spy-relative-range-convexity-v2-20261005
    paths:
      - research/qqq_spy_relative_range_convexity_v2.py
      - .github/workflows/qqq-spy-relative-range-convexity-v2.yml
  workflow_dispatch:

# Research branch only: no pull_request trigger, so cleanup/re-PR commits cannot
# create a second PR-triggered research run. New pushes cancel superseded runs.
concurrency:
  group: qqq-spy-relative-range-convexity-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay-linux:
    name: Replay / Linux runner
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Python environment
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install duckdb pandas pyarrow numpy

      - name: Download canonical option and underlying data
        run: |
          mkdir -p data artifacts/v2_linux
          test -s data/QQQ_options.parquet || curl -L --fail --retry 4 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          test -s data/SPY_options.parquet || curl -L --fail --retry 4 -o data/SPY_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_options.parquet
          test -s data/QQQ_underlying.parquet || curl -L --fail --retry 4 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          test -s data/SPY_underlying.parquet || curl -L --fail --retry 4 -o data/SPY_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_underlying.parquet
          .venv/bin/python -c "from pathlib import Path; print({p.name:p.stat().st_size for p in Path('data').glob('*.parquet')})"

      - name: Compile and run V2
        run: |
          .venv/bin/python -m py_compile research/qqq_spy_relative_range_convexity_v2.py
          .venv/bin/python research/qqq_spy_relative_range_convexity_v2.py --data-dir data --out artifacts/v2_linux
          cat artifacts/v2_linux/RESULTS.md

      - name: Upload Linux artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-spy-relative-range-convexity-v2-linux
          path: artifacts/v2_linux/
          if-no-files-found: warn

  replay-windows:
    name: Replay / Windows runner
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy

      - name: Download canonical option and underlying data
        run: |
          mkdir -p data artifacts/v2_windows
          test -s data/QQQ_options.parquet || curl.exe -L --fail --retry 4 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          test -s data/SPY_options.parquet || curl.exe -L --fail --retry 4 -o data/SPY_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_options.parquet
          test -s data/QQQ_underlying.parquet || curl.exe -L --fail --retry 4 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          test -s data/SPY_underlying.parquet || curl.exe -L --fail --retry 4 -o data/SPY_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_underlying.parquet
          python -c "from pathlib import Path; print({p.name:p.stat().st_size for p in Path('data').glob('*.parquet')})"

      - name: Compile and run V2
        run: |
          python -m py_compile research/qqq_spy_relative_range_convexity_v2.py
          python research/qqq_spy_relative_range_convexity_v2.py --data-dir data --out artifacts/v2_windows
          cat artifacts/v2_windows/RESULTS.md

      - name: Upload Windows artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-spy-relative-range-convexity-v2-windows
          path: artifacts/v2_windows/
          if-no-files-found: warn
