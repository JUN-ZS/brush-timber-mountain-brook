name: QQQ N+50 One-and-Done V20
on:
  push:
    branches:
      - research/qqq-nplus50-one-and-done-v20-20260930
    paths:
      - research/qqq_nplus50_one_and_done_v20.py
      - .github/workflows/qqq-nplus50-one-and-done-v20.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qqq-nplus50-one-and-done-v20
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/QQQ_options.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run geo vs dollar matrix
        run: |
          python research/qqq_nplus50_one_and_done_v20.py --data-dir data --out artifacts
          python - <<'PY'
          import json
          r=json.loads(open('artifacts/nplus50_matrix_result.json').read())
          print('GEO_REACHED', r['diagnostics']['geo_configs_reached_10'])
          print('DOLLAR_REACHED', r['diagnostics']['dollar_configs_reached_10'])
          print('BY_SHORT')
          for row in r['by_short_delta']:
              print(row)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-nplus50-one-and-done-v20
          path: |
            artifacts/nplus50_matrix_result.json
            artifacts/nplus50_geo_stopping_rank.csv
            artifacts/nplus50_stopping_rank.csv
            artifacts/nplus50_matrix_summary.csv
          if-no-files-found: error
          continue-on-error: true
          compression-level: 9
