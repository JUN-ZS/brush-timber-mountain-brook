name: QQQ Near-Short10 Far-Long Book V22
on:
  push:
    branches: [research/qqq-near-short10-far-long-book-v22-20260930]
    paths:
      - research/qqq_near_short10_far_long_book_v22.py
      - .github/workflows/qqq-near-short10-far-long-book-v22.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qqq-near-short10-far-long-book-v22
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data artifacts
          curl -L --fail --retry 3 -o data/QQQ_options.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
      - name: Run V22
        run: python research/qqq_near_short10_far_long_book_v22.py --data-dir data --out artifacts
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-near-short10-far-long-book-v22
          path: |
            artifacts/v22_result.json
            artifacts/v22_summary.csv
            artifacts/v22_cycles.csv
          if-no-files-found: error
          continue-on-error: true
