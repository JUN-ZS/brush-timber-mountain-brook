name: QQQ Term Structure Self Finance V1

on:
  push:
    branches:
      - research/qqq-term-structure-self-finance-v1-20261005
    paths:
      - research/qqq_term_structure_self_finance_v1.py
      - .github/workflows/qqq-term-structure-self-finance-v1.yml
  workflow_dispatch:

concurrency:
  group: qqq-term-structure-self-finance-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay-linux:
    name: Replay / Linux runner
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python environment
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install duckdb pandas pyarrow numpy
      - name: Download canonical option and underlying data
        run: |
          mkdir -p data artifacts/term_structure_linux
          curl -L --fail --retry 4 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 4 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          .venv/bin/python -c "from pathlib import Path; print({p.name:p.stat().st_size for p in Path('data').glob('*.parquet')})"
      - name: Compile and run
        run: |
          .venv/bin/python -m py_compile research/qqq_term_structure_self_finance_v1.py
          .venv/bin/python research/qqq_term_structure_self_finance_v1.py --data-dir data --out artifacts/term_structure_linux
          cat artifacts/term_structure_linux/RESULTS.md
      - name: Upload Linux artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-term-structure-self-finance-v1-linux
          path: artifacts/term_structure_linux/
          if-no-files-found: warn

  replay-windows:
    name: Replay / Windows runner
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical option and underlying data
        run: |
          mkdir -p data artifacts/term_structure_windows
          curl.exe -L --fail --retry 4 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl.exe -L --fail --retry 4 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          python -c "from pathlib import Path; print({p.name:p.stat().st_size for p in Path('data').glob('*.parquet')})"
      - name: Compile and run
        run: |
          python -m py_compile research/qqq_term_structure_self_finance_v1.py
          python research/qqq_term_structure_self_finance_v1.py --data-dir data --out artifacts/term_structure_windows
          cat artifacts/term_structure_windows/RESULTS.md
      - name: Upload Windows artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-term-structure-self-finance-v1-windows
          path: artifacts/term_structure_windows/
          if-no-files-found: warn
