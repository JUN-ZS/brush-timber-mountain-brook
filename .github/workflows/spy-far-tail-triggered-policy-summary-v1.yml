name: SPY Far-Tail Triggered Whole-Policy Summary V1

on:
  push:
    branches:
      - research/spy-far-tail-hedge-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/summarize_spy_far_tail_triggered_policy_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_triggered_policy_v1.py
      - .github/workflows/spy-far-tail-triggered-policy-summary-v1.yml

permissions:
  contents: write

concurrency:
  group: spy-far-tail-triggered-policy-summary-v1
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and test whole-policy accounting
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          python3 -m py_compile "$BASE/summarize_spy_far_tail_triggered_policy_v1.py" "$BASE/test_spy_far_tail_triggered_policy_v1.py"
          (cd "$BASE" && python3 test_spy_far_tail_triggered_policy_v1.py)
      - name: Build policy-evaluable whole-strategy summary from committed ledger
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          python3 "$BASE/summarize_spy_far_tail_triggered_policy_v1.py" --out "$BASE/results/spy_far_tail_triggered_v1"
          test -s "$BASE/results/spy_far_tail_triggered_v1/triggered_policy_summary.csv"
          test -s "$BASE/results/spy_far_tail_triggered_v1/triggered_policy_annual.csv"
          test -s "$BASE/results/spy_far_tail_triggered_v1/SPY_FAR_TAIL_TRIGGERED_HEDGE_POLICY_ADDENDUM.md"
          cat "$BASE/results/spy_far_tail_triggered_v1/SPY_FAR_TAIL_TRIGGERED_HEDGE_POLICY_ADDENDUM.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit whole-policy addendum
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_triggered_v1/triggered_policy_summary.csv research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_triggered_v1/triggered_policy_annual.csv research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_triggered_v1/SPY_FAR_TAIL_TRIGGERED_HEDGE_POLICY_ADDENDUM.md
          git commit -m "research: add whole-policy evaluation for triggered SPY hedge"
          git fetch origin research/spy-far-tail-hedge-v1
          git rebase origin/research/spy-far-tail-hedge-v1
          git push origin HEAD:research/spy-far-tail-hedge-v1
