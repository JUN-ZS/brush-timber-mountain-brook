name: QQQ Live Hedge Desk V2 Checks

on:
  push:
    branches:
      - '**'
    paths:
      - 'research/live_hedge_v1/**'
      - 'research/strategy_instance_v1/**'
      - 'research/parity_v1/**'
      - 'research/evidence_v1/**'
      - '.github/workflows/qqq-live-hedge-v2-check.yml'
  pull_request:
    paths:
      - 'research/live_hedge_v1/**'
      - 'research/strategy_instance_v1/**'
      - 'research/parity_v1/**'
      - 'research/evidence_v1/**'
      - '.github/workflows/qqq-live-hedge-v2-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: bash
        run: |
          python3 -c "import pathlib,py_compile; [py_compile.compile(str(p),doraise=True) for p in pathlib.Path('backtest').glob('*.py') if p.name != '__init__.py']"
          python3 -c "import pathlib,py_compile; [py_compile.compile(str(p),doraise=True) for p in pathlib.Path('research/live_hedge_v1').glob('*.py')]"
      - name: Unit tests
        shell: bash
        run: |
          python3 -m unittest research.live_hedge_v1.test_live_hedge_v2
      - name: Research ↔ live parity
        shell: bash
        run: |
          python3 -m unittest research.parity_v1.test_research_live_parity
      - name: Safety surface audit
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          rx = re.compile(r"\b(?:place_order|modify_order|unlock_trade)\s*\(")
          hits = []
          for p in pathlib.Path("research/live_hedge_v1").glob("*.py"):
              for i, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  if rx.search(line):
                      hits.append(f"{p}:{i}:{line.strip()}")
          if hits:
              print("BROKER_WRITE_API_DETECTED")
              print("\n".join(hits))
              sys.exit(1)
          print("BROKER_WRITE_API_AUDIT=PASS")
          PY
