name: QQQ Live Hedge Desk V2 Checks

on:
  push:
    branches:
      - '**'
    paths:
      - 'research/live_hedge_v1/**'
  pull_request:
    paths:
      - 'research/live_hedge_v1/**'

jobs:
  checks:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/live_hedge_v1/*.py
      - name: Unit tests
        run: python -m unittest research.live_hedge_v1.test_live_hedge_v2