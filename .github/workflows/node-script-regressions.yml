name: Node and TypeScript Regression Tests

on:
  pull_request:
    paths:
      - "scripts/grok-pwa-plugin.mjs"
      - "scripts/grok-pwa-plugin.test.mjs"
      - "scripts/sign-out-plan.mjs"
      - "scripts/sign-out-plan.test.mjs"
      - "src/lib/pulse/rolling-floor.ts"
      - "src/lib/pulse/rolling-floor.test.ts"
      - ".github/workflows/node-script-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-script-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-script-regressions:
    name: PWA, sign-out and rolling-floor tests
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
      - name: Set up Node 22 for built-in TypeScript stripping
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
      - name: Verify runner
        run: |
          set -euo pipefail
          node --version
          git status --short
      - name: Run PWA and sign-out Node regression suites
        run: |
          set -euo pipefail
          node --test scripts/grok-pwa-plugin.test.mjs scripts/sign-out-plan.test.mjs
      - name: Run rolling-floor history regression
        run: |
          set -euo pipefail
          node --experimental-strip-types --test src/lib/pulse/rolling-floor.test.ts
