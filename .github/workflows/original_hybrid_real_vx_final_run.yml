name: ORIGINAL HYBRID — REAL VX M1 M2 FINAL RUN

on:
  push:
    branches:
      - research/original-hybrid-real-run-v1-20261007
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-hybrid-real-vx
  cancel-in-progress: true

jobs:
  final_run:
    name: REAL VX → M1/M2 → fixed Original Hybrid
    runs-on: [self-hosted, grokbot-box-linux-x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify runtime
        run: |
          python3 --version
          node --version

      - name: Build REAL daily VX M1/M2
        run: |
          mkdir -p artifacts/real-vx
          python3 research/cboe_vx_m1m2/build_real_vx_m1_m2.py \
            --start 2018-03-01 \
            --end 2026-09-04 \
            --out artifacts/real-vx/cboe_vx_m1_m2_2018_2026.csv

      - name: Historical overlap gate
        run: |
          python3 research/cboe_vx_m1m2/validate_against_external.py \
            --cboe artifacts/real-vx/cboe_vx_m1_m2_2018_2026.csv \
            --external research/data/vx_m1_m2_external_2016_2022.csv \
            --out artifacts/real-vx/overlap_gate.json

      - name: Replay fixed REAL M1/M2 archive policy
        run: |
          node research/m1_m2_reconstruction_lab/tests/real_historical_state_replay.js

      - name: Replay contract checks
        run: |
          node --check research/m1_m2_reconstruction_lab/engine.js
          node --check research/m1_m2_reconstruction_lab/tests/real_historical_state_replay.js
          test -f research/data/real_historical_state_replay_2018_2022.csv
          test -f research/m1_m2_reconstruction_lab/REAL_HISTORICAL_STATE_REPLAY.md

      - name: Upload FINAL evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: original-hybrid-real-vx-final-run
          path: |
            artifacts/real-vx/
            research/data/real_historical_state_replay_2018_2022.csv
            research/m1_m2_reconstruction_lab/REAL_HISTORICAL_STATE_REPLAY.md
          if-no-files-found: error
          retention-days: 30
