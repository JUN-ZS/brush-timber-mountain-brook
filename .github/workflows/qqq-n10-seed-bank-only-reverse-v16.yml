name: QQQ N10 Seed Bank-Only Reverse Rights V16

on:
  push:
    branches:
      - research/qqq-n10-seed-bank-only-reverse-v16-20260929
  workflow_dispatch:

concurrency:
  group: qqq-n10-seed-bank-only-reverse-v16
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          gh release download data-v1 --repo lambdaclass/options_portfolio_backtester --pattern "QQQ_options.parquet" --pattern "QQQ_underlying.parquet" --dir data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run V16 strict bank-only replay
        run: |
          python research/qqq_n10_seed_bank_only_reverse_v16.py --data-dir data --out artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-n10-seed-bank-only-reverse-v16
          path: artifacts/
          if-no-files-found: error
