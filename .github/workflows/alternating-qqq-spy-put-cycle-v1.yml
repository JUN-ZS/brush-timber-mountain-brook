name: Alternating SPY QQQ Put Cycle — DTE21 Weekly Flip

on:
  push:
    branches:
      - research/alternating-qqq-spy-put-cycle-v1-20261105
    paths:
      - research/alternating_qqq_spy_put_cycle_v1.py
      - research/test_alternating_qqq_spy_put_cycle_v1.py
      - research/test_resumable_download_v1.py
      - research/tail_call_overlay_v1.py
      - research/test_tail_call_overlay_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/qqq_spy_put_premium_matched_phase_v1.py
      - .github/workflows/alternating-qqq-spy-put-cycle-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    name: Historical QQQ SPY quote replay
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore complete pinned option-data cache
        id: restore-option-data-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/qqq-options-full-history
            ~/.cache/spy-options-cross-put-v1
          key: qqq-spy-put-data-v1-${{ runner.os }}-37f6c456fe1a4775c875673fb8ef907d5cd2fd66

      - name: Restore interrupted option-data fragments
        id: restore-partial-option-data
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/qqq-options-full-history/*.part
            ~/.cache/qqq-options-full-history/*.part.etag
            ~/.cache/spy-options-cross-put-v1/*.part
            ~/.cache/spy-options-cross-put-v1/*.part.etag
          key: qqq-spy-put-partials-v1-${{ runner.os }}-37f6-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qqq-spy-put-partials-v1-${{ runner.os }}-37f6-

      - name: Install pinned Parquet runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyarrow==21.0.0

      - name: Compile and run unit tests
        run: |
          python -m py_compile research/qqq_spy_put_fixed_ratio_size_gated_v1/qqq_spy_put_premium_matched_phase_v1.py research/alternating_qqq_spy_put_cycle_v1.py research/test_alternating_qqq_spy_put_cycle_v1.py research/test_resumable_download_v1.py research/tail_call_overlay_v1.py research/test_tail_call_overlay_v1.py
          python -m unittest discover -s research -p "test_alternating_qqq_spy_put_cycle_v1.py" -v
          python -m unittest discover -s research -p "test_resumable_download_v1.py" -v
          python -m unittest discover -s research -p "test_tail_call_overlay_v1.py" -v

      - name: Clear stale replay output bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          output = Path("research/alternating_qqq_spy_put_cycle_v1/results/latest")
          shutil.rmtree(output, ignore_errors=True)
          output.mkdir(parents=True, exist_ok=True)
          PY

      - name: Run pinned historical replay
        id: historical-replay
        run: |
          python research/alternating_qqq_spy_put_cycle_v1.py \
            --start 2018-03-01 \
            --end 2025-12-15 \
            --initial-nav 100000 \
            --out research/alternating_qqq_spy_put_cycle_v1/results/latest

      - name: Validate output bundle and premium-balance ledger
        run: |
          set -euo pipefail
          OUT=research/alternating_qqq_spy_put_cycle_v1/results/latest
          test -s "$OUT/study_report.md"
          test -s "$OUT/portfolio_arm_summary.csv"
          test -s "$OUT/run_manifest.json"
          python - <<'PY'
          import csv
          from pathlib import Path

          out = Path("research/alternating_qqq_spy_put_cycle_v1/results/latest")
          arms = (
              "SPY_SHORT_QQQ_LONG_only",
              "QQQ_SHORT_SPY_LONG_only",
              "SPY_SHORT_QQQ_LONG_only_hold10",
              "QQQ_SHORT_SPY_LONG_only_hold10",
              "alternate_weekly_close",
              "alternate_two_week_staggered",
          )

          with (out / "portfolio_arm_summary.csv").open(newline="", encoding="utf-8") as f:
              summary = {row["arm"]: row for row in csv.DictReader(f)}

          if set(summary) != set(arms):
              raise SystemExit(f"summary arm mismatch: {sorted(summary)}")

          def read_rows(path):
              if not path.is_file():
                  raise SystemExit(f"missing output file: {path}")
              with path.open(newline="", encoding="utf-8") as f:
                  return list(csv.DictReader(f))

          total_entries = total_trades = 0
          for arm in arms:
              daily = read_rows(out / f"{arm}_daily_nav.csv")
              entries = read_rows(out / f"{arm}_entries.csv")
              trades = read_rows(out / f"{arm}_trades.csv")
              if not daily:
                  raise SystemExit(f"{arm}: daily NAV is empty")
              row = summary[arm]
              entered = int(row["entered_cohorts"])
              resolved = int(row["resolved_trades"])
              unresolved = int(row["unresolved_trades"])
              zero_entries = int(row["zero_opening_premium_entries"])
              nonzero_entries = int(row["nonzero_opening_premium_entries"])
              if len(entries) != entered:
                  raise SystemExit(f"{arm}: entries rows {len(entries)} != entered_cohorts {entered}")
              if len(trades) != resolved + unresolved:
                  raise SystemExit(f"{arm}: trades rows do not reconcile to resolved + unresolved")
              if zero_entries + nonzero_entries != entered:
                  raise SystemExit(f"{arm}: zero/nonzero premium counts do not reconcile to entries")
              counted_zero = counted_nonzero = 0
              for entry in entries:
                  opening = round(float(entry["net_opening_cashflow_usd"]), 2)
                  expected = round(100.0 * (6.0 * float(entry["short_entry_bid"]) - float(entry["long_entry_ask"])), 2)
                  if opening != expected:
                      raise SystemExit(f"{arm}: opening cashflow mismatch: ledger={opening}, recomputed={expected}")
                  if abs(opening) < 0.005:
                      counted_zero += 1
                  else:
                      counted_nonzero += 1
                  long_paid = float(entry["long_premium_paid_usd"])
                  short_received = float(entry["short_premium_received_usd"])
                  scale = max(abs(long_paid), abs(short_received))
                  expected_match = 100.0 if scale <= 0 else 100.0 * (1.0 - abs(long_paid - short_received) / scale)
                  if abs(float(entry["actual_entry_premium_match_pct"]) - expected_match) > 1e-5:
                      raise SystemExit(f"{arm}: actual premium-match diagnostic mismatch")
              if counted_zero != zero_entries or counted_nonzero != nonzero_entries:
                  raise SystemExit(f"{arm}: zero/nonzero premium counts disagree with entry ledger")
              total_entries += entered
              total_trades += len(trades)

          print(f"Validated 6 arms; entered={total_entries}; trade rows={total_trades}; all opening debit/credit ledgers reconcile.")
          PY

      - name: Restore ORATS TAIL EOD quote cache
        id: restore-tail-orats-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/tail-orats-eod
          key: tail-orats-eod-v1-${{ runner.os }}-2018-2025-dte0-45

      - name: Run observed TAIL CALL historical option overlay
        if: ${{ secrets.ORATS_API_TOKEN != '' }}
        env:
          ORATS_API_TOKEN: ${{ secrets.ORATS_API_TOKEN }}
        run: |
          python research/tail_call_overlay_v1.py \
            --data-dir research/alternating_qqq_spy_put_cycle_v1/results/latest \
            --out-dir research/alternating_qqq_spy_put_cycle_v1/results/latest

      - name: Record TAIL CALL data-access blocker
        if: ${{ secrets.ORATS_API_TOKEN == '' }}
        run: |
          python research/tail_call_overlay_v1.py --blocked \
            --data-dir research/alternating_qqq_spy_put_cycle_v1/results/latest \
            --out-dir research/alternating_qqq_spy_put_cycle_v1/results/latest

      - name: Save ORATS TAIL EOD quote cache
        if: success() && secrets.ORATS_API_TOKEN != '' && steps.restore-tail-orats-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/tail-orats-eod
          key: tail-orats-eod-v1-${{ runner.os }}-2018-2025-dte0-45

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternating-qqq-spy-put-cycle-v1
          path: research/alternating_qqq_spy_put_cycle_v1/results/latest/
          if-no-files-found: warn
          retention-days: 30

      - name: Save complete pinned option-data cache
        if: always() && steps.historical-replay.outcome == 'success' && steps.restore-option-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/qqq-options-full-history
            ~/.cache/spy-options-cross-put-v1
          key: qqq-spy-put-data-v1-${{ runner.os }}-37f6c456fe1a4775c875673fb8ef907d5cd2fd66

      - name: Detect interrupted option-data fragments
        if: failure()
        id: partial-option-data-state
        shell: bash
        run: |
          set +e
          found=0
          for dir in "$HOME/.cache/qqq-options-full-history" "$HOME/.cache/spy-options-cross-put-v1"; do
            [ -d "$dir" ] || continue
            if find "$dir" -maxdepth 1 -type f \\( -name '*.part' -o -name '*.part.etag' \\) -print -quit | grep -q .; then
              found=1
              break
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Save interrupted option-data fragments
        if: failure() && steps.partial-option-data-state.outputs.found == '1'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/qqq-options-full-history/*.part
            ~/.cache/qqq-options-full-history/*.part.etag
            ~/.cache/spy-options-cross-put-v1/*.part
            ~/.cache/spy-options-cross-put-v1/*.part.etag
          key: qqq-spy-put-partials-v1-${{ runner.os }}-37f6-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit reproducible results to isolated branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/alternating_qqq_spy_put_cycle_v1/results/latest/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "results: alternating SPY QQQ DTE21 put cycle replay"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
