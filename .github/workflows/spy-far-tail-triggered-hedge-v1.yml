name: SPY Far-Tail Triggered Hedge V1

on:
  push:
    branches:
      - research/spy-far-tail-hedge-v1
    paths:
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/spy_far_tail_triggered_hedge_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/test_spy_far_tail_triggered_hedge_v1.py
      - research/qqq_spy_put_fixed_ratio_size_gated_v1/SPY_FAR_TAIL_TRIGGERED_HEDGE_CONTRACT.md
      - .github/workflows/spy-far-tail-triggered-hedge-v1.yml

permissions:
  contents: write

concurrency:
  group: spy-far-tail-triggered-hedge-v1
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and unit-test fixed trigger rules
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          python3 -m py_compile "$BASE/spy_far_tail_triggered_hedge_v1.py" "$BASE/test_spy_far_tail_triggered_hedge_v1.py"
          (cd "$BASE" && python3 test_spy_far_tail_triggered_hedge_v1.py)
      - name: Install pinned Parquet runtime
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyarrow==19.0.1
      - name: Run the predeclared price-triggered hedge replay
        run: |
          set -euo pipefail
          BASE=research/qqq_spy_put_fixed_ratio_size_gated_v1
          python3 "$BASE/spy_far_tail_triggered_hedge_v1.py" \
            --base-results-root "$BASE/results" \
            --cache "$RUNNER_TEMP/spy-far-tail-triggered-cache" \
            --out "$BASE/results/spy_far_tail_triggered_v1" \
            --slippage-per-share 0.05 \
            --commission-per-contract-per-side 0.65
          test -s "$BASE/results/spy_far_tail_triggered_v1/SPY_FAR_TAIL_TRIGGERED_HEDGE_REPORT.md"
          test -s "$BASE/results/spy_far_tail_triggered_v1/triggered_summary.csv"
          test -s "$BASE/results/spy_far_tail_triggered_v1/triggered_annual.csv"
          cat "$BASE/results/spy_far_tail_triggered_v1/SPY_FAR_TAIL_TRIGGERED_HEDGE_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit replay artifacts to isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/qqq_spy_put_fixed_ratio_size_gated_v1/results/spy_far_tail_triggered_v1
          git commit -m "research: record SPY risk-triggered tail hedge comparison"
          git fetch origin research/spy-far-tail-hedge-v1
          git rebase origin/research/spy-far-tail-hedge-v1
          git push origin HEAD:research/spy-far-tail-hedge-v1
