name: Glidepath V2 Preview Audit

on:
  pull_request:
    paths:
      - "v2.html"
      - "glidepath_preview_optimized_audit.json"
      - "glidepath_preview_v2.1_methodology.md"
      - "glidepath_interactive_preview_optimized_bundle.zip"
      - "research/audit_stage2/test_glidepath_v2_preview.py"
      - "research/audit_stage2/build_glidepath_v2_bundle.py"
      - ".github/workflows/glidepath-v2-preview-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glidepath-v2-preview-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-audit:
    name: Validate current preview on Linux BOT
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Confirm local runtime
        run: |
          python3 --version
          node --version
      - name: Run independent integrity tests
        run: python3 -m unittest research.audit_stage2.test_glidepath_v2_preview -v
      - name: Rebuild bundle and verify repository bytes are reproducible
        run: |
          python3 research/audit_stage2/build_glidepath_v2_bundle.py
          python3 -m unittest research.audit_stage2.test_glidepath_v2_preview -v
          git diff --exit-code -- glidepath_interactive_preview_optimized_bundle.zip glidepath_preview_optimized_audit.json
