name: Glidepath V2 Preview Audit

on:
  # The file is not on the default branch yet; use a branch-scoped push run to test this PR.
  push:
    branches:
      - "glidepath-v2-statistical-integrity"
    paths:
      - "v2.html"
      - "glidepath_preview_v2.1_methodology.md"
      - "research/audit_stage2/test_glidepath_v2_preview.py"
      - "research/audit_stage2/build_glidepath_v2_bundle.py"
      - ".github/workflows/glidepath-v2-preview-audit.yml"
  pull_request:
    paths:
      - "v2.html"
      - "glidepath_preview_optimized_audit.json"
      - "glidepath_preview_v2.1_methodology.md"
      - "glidepath_interactive_preview_optimized_bundle.zip"
      - "research/audit_stage2/test_glidepath_v2_preview.py"
      - "research/audit_stage2/build_glidepath_v2_bundle.py"
      - ".github/workflows/glidepath-v2-preview-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glidepath-v2-preview-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-audit:
    name: Validate current preview on Linux BOT
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Confirm local runtime
        run: |
          python3 --version
          node --version
      - name: Rebuild deterministic bundle and refresh audit from exact HTML
        run: python3 research/audit_stage2/build_glidepath_v2_bundle.py
      - name: Run independent integrity tests against regenerated artifacts
        run: python3 -m unittest research.audit_stage2.test_glidepath_v2_preview -v
      - name: Commit regenerated artifacts back to this PR branch
        if: github.event_name == 'pull_request' || github.ref_name == 'glidepath-v2-statistical-integrity'
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if ! git diff --quiet -- glidepath_interactive_preview_optimized_bundle.zip glidepath_preview_optimized_audit.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add glidepath_interactive_preview_optimized_bundle.zip glidepath_preview_optimized_audit.json
            git commit -m "chore(glidepath): refresh generated preview bundle and audit"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      - name: Verify generated artifacts are committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- glidepath_interactive_preview_optimized_bundle.zip glidepath_preview_optimized_audit.json
