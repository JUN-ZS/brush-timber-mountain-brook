name: VXX Synthetic Option Tape V1

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - research/vxx-synthetic-option-tape-v1-20261002
    paths:
      - research/vxx_synthetic_option_tape_v1.py
      - attachments/spots_qqq_vxx_vix.1csv
      - .github/workflows/vxx-synthetic-option-tape-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vxx-synthetic-tape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Windows self-hosted — full tape
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas pyarrow numpy scipy
      - name: Prepare canonical inputs
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          curl.exe -L --fail --retry 3 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl.exe -L --fail --retry 3 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          Copy-Item attachments/spots_qqq_vxx_vix.1csv data/spots_qqq_vxx_vix.csv -Force
      - name: Run model-derived tape and quality gates
        shell: powershell
        run: |
          python -m py_compile research/vxx_synthetic_option_tape_v1.py
          python research/vxx_synthetic_option_tape_v1.py --spot-csv data/spots_qqq_vxx_vix.csv --qqq-options data/QQQ_options.parquet --qqq-underlying data/QQQ_underlying.parquet --out artifacts/vxx_synth_v1
      - name: Upload Windows manifest and tape
        uses: actions/upload-artifact@v4
        with:
          name: vxx-synthetic-tape-v1-windows
          path: artifacts/vxx_synth_v1/
          if-no-files-found: error

  reproduce_linux:
    name: Linux self-hosted — independent manifest
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify system Python
        shell: bash
        run: |
          python3 --version
          python3 -m pip --version
      - name: Install research dependencies
        shell: bash
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages duckdb pandas pyarrow numpy scipy
      - name: Validate bounded DuckDB arg_min selector
        shell: bash
        run: |
          python3 - <<'PY'
          import duckdb
          con=duckdb.connect()
          x=con.execute("""
          WITH b AS (
            SELECT * FROM (VALUES
              (DATE '2026-01-01',1,30,100.0,0.50),
              (DATE '2026-01-01',1,31,200.0,0.49),
              (DATE '2026-01-01',1,29,300.0,0.51),
              (DATE '2026-01-01',1,35,50.0,0.30)
            ) AS t(date,band,dte,volume,delta)
          ),
          g AS (
            SELECT date,band,
              arg_min(
                struct_pack(dte:=dte,volume:=volume,delta:=delta),
                struct_pack(
                  dte_dist:=ABS(dte-30),
                  neg_volume:=-volume,
                  delta_dist:=ABS(ABS(delta)-0.50)
                ),
                2
              ) AS picks
            FROM b
            GROUP BY date,band
          )
          SELECT (UNNEST(picks)).dte FROM g
          ORDER BY 1
          """).fetchall()
          assert x == [(29,), (30,)], x
          print("DUCKDB_ARG_MIN_SELECTOR_PASS", x)
          PY
      - name: Prepare canonical inputs
        shell: bash
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          cp attachments/spots_qqq_vxx_vix.1csv data/spots_qqq_vxx_vix.csv
      - name: Rebuild independent Linux manifest
        shell: bash
        run: |
          python3 -m py_compile research/vxx_synthetic_option_tape_v1.py
          python3 research/vxx_synthetic_option_tape_v1.py \
            --spot-csv data/spots_qqq_vxx_vix.csv \
            --qqq-options data/QQQ_options.parquet \
            --qqq-underlying data/QQQ_underlying.parquet \
            --out artifacts/vxx_synth_v1_linux \
            --summary-only
      - name: Upload Linux manifest
        uses: actions/upload-artifact@v4
        with:
          name: vxx-synthetic-tape-v1-linux-manifest
          path: artifacts/vxx_synth_v1_linux/manifest.json
          if-no-files-found: error

  build_hub_web:
    name: HUB WEB — ubuntu-latest independent manifest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas pyarrow numpy scipy
      - name: Prepare canonical inputs
        shell: bash
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          cp attachments/spots_qqq_vxx_vix.1csv data/spots_qqq_vxx_vix.csv
      - name: Rebuild independent HUB WEB manifest
        shell: bash
        run: |
          python -m py_compile research/vxx_synthetic_option_tape_v1.py
          python research/vxx_synthetic_option_tape_v1.py \
            --spot-csv data/spots_qqq_vxx_vix.csv \
            --qqq-options data/QQQ_options.parquet \
            --qqq-underlying data/QQQ_underlying.parquet \
            --out artifacts/vxx_synth_v1_hub \
            --summary-only
      - name: Upload HUB WEB manifest
        uses: actions/upload-artifact@v4
        with:
          name: vxx-synthetic-tape-v1-hub-web-manifest
          path: artifacts/vxx_synth_v1_hub/manifest.json
          if-no-files-found: error

  compare_manifests:
    name: HUB WEB — three-runner fingerprint lock
    needs: [build_windows, reproduce_linux, build_hub_web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows manifest
        uses: actions/download-artifact@v4
        with:
          name: vxx-synthetic-tape-v1-windows
          path: windows
      - name: Download Linux manifest
        uses: actions/download-artifact@v4
        with:
          name: vxx-synthetic-tape-v1-linux-manifest
          path: linux
      - name: Download HUB WEB manifest
        uses: actions/download-artifact@v4
        with:
          name: vxx-synthetic-tape-v1-hub-web-manifest
          path: hub_web
      - name: Compare all fingerprints
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          w=json.loads(Path("windows/manifest.json").read_text())
          l=json.loads(Path("linux/manifest.json").read_text())
          h=json.loads(Path("hub_web/manifest.json").read_text())

          manifests={"WINDOWS":w,"LINUX":l,"HUB_WEB":h}
          for name,m in manifests.items():
              assert m["quality_gate"]["status"] == "PASS", (name,m["quality_gate"])
              assert m["source"] == "MODEL_DERIVED_VXX_OPTION_TAPE", name

          canonical={name:m["canonical_fingerprint"] for name,m in manifests.items()}
          families={name:m["family_fingerprint"] for name,m in manifests.items()}
          states={name:m["state_fingerprint"] for name,m in manifests.items()}

          assert len(set(canonical.values())) == 1, canonical
          assert len(set(families.values())) == 1, families
          assert len(set(states.values())) == 1, states

          print("WINDOWS_CANONICAL", canonical["WINDOWS"])
          print("LINUX_CANONICAL", canonical["LINUX"])
          print("HUB_WEB_CANONICAL", canonical["HUB_WEB"])
          print("THREE_WAY_FINGERPRINT_MATCH", canonical["WINDOWS"])
          PY
