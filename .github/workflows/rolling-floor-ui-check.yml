name: Rolling Floor UI Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: rolling-floor-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-build:
    name: UI / 10Y Floor
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Build app
        run: npm run build:dev
      - name: Verify 10Y Floor route is present
        run: |
          test -s src/routes/floor.tsx
          grep -q "10Y CAPITAL FLOOR / FORMAL ACCOUNTING" src/routes/floor.tsx
          grep -q "currentClockAmount" src/routes/floor.tsx
          grep -q "QQQ LIVE STATE · SELF-RELATIVE" src/routes/floor.tsx
          grep -q "DAILY DEPLOYMENT / LIVE MARKET TAPE" src/components/daily-deployment-console.tsx
          grep -q "CONDITIONAL PRICE LADDER · MANUAL LIMIT MAP" src/components/daily-deployment-console.tsx
          grep -q "NO BROKER ORDER" src/components/daily-deployment-console.tsx
          grep -q "NO BROKER TRANSMISSION" src/components/order-state-machine.tsx
          grep -q "ARMED" src/components/order-state-machine.tsx
          grep -q "TOUCHED" src/components/order-state-machine.tsx
          grep -q "FILLED" src/components/order-state-machine.tsx
          grep -q "dailyDeploymentTape" src/routes/floor.tsx
          ! grep -q "BUY / ADD" src/routes/floor.tsx
