name: V4.4 FRAME Contract Validation

on:
  pull_request:
    paths:
      - "qqq_hybrid_v4_4_issue_107_frame_vxx_48_golden_tests.html"
      - "scripts/validate-v44-frame-contracts.mjs"
      - ".github/workflows/rolling-floor.yml"
      - ".github/workflows/v44-frame-contract-validation.yml"
      - "docs/QQQ_HYBRID_V44_ASSUMPTION_LEDGER_V1.md"

permissions:
  contents: read

jobs:
  validate-frame-contracts:
    name: Validate V4.4 FRAME contracts (no HUB data run)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
      - name: Verify Node-only validation runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test -s qqq_hybrid_v4_4_issue_107_frame_vxx_48_golden_tests.html
          test -s scripts/validate-v44-frame-contracts.mjs
      - name: Run static, parser, and assumption-profile checks
        shell: bash
        run: node scripts/validate-v44-frame-contracts.mjs
