name: QQQ N10 Rights Bank V15

on:
  push:
    branches:
      - research/qqq-n10-rights-bank-v15-20260929
    paths:
      - research/qqq_n10_rights_bank_v15.py
      - research/QQQ_N10_RIGHTS_BANK_V15_README.md
      - .github/workflows/qqq-n10-rights-bank-v15.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqq-n10-rights-bank-v15
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data
          gh release download data-v1 \
            --repo lambdaclass/options_portfolio_backtester \
            --pattern "QQQ_options.parquet" \
            --pattern "QQQ_underlying.parquet" \
            --dir data
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run V15 N-10 rights bank
        run: |
          python research/qqq_n10_rights_bank_v15.py --data-dir data --out artifacts
      - name: Show result json
        run: |
          if [ -f artifacts/qqq_n10_rights_bank_v15_result.json ]; then
            cat artifacts/qqq_n10_rights_bank_v15_result.json
          else
            echo NO_RESULT_JSON
            ls -la artifacts || true
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qqq-n10-rights-bank-v15
          path: |
            artifacts/qqq_n10_rights_bank_v15_result.json
            artifacts/n10_rights_ledger.csv
            artifacts/summary.csv
            artifacts/equity_*.csv
          if-no-files-found: error
