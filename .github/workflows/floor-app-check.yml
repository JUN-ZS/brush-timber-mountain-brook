name: 10Y Floor App Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/floor.tsx"
      - "src/routes/floor-research.tsx"
      - "src/lib/floor/**"
      - "src/data/rolling_floor_research_snapshot.json"
      - "src/components/shell.tsx"
      - "src/routeTree.gen.ts"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-app:
    name: Floor App / test / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Floor account tests
        run: node --experimental-strip-types --test src/lib/floor/account.test.ts

      - name: Floor app lint
        run: npx eslint src/routes/floor.tsx src/routes/floor-research.tsx src/lib/floor/account.ts src/lib/floor/account.test.ts

      - name: Development build
        run: npm run build:dev
