name: 10Y Floor App Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/floor.tsx"
      - "src/routes/floor-research.tsx"
      - "src/lib/floor/**"
      - "src/data/rolling_floor_research_snapshot.json"
      - "src/components/shell.tsx"
      - "src/components/daily-deployment-console.tsx"
      - "src/routeTree.gen.ts"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: 10y-floor-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor-app:
    name: Floor App / test / lint / build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Floor account and daily deployment tests
        run: node --experimental-strip-types --test src/lib/floor/account.test.ts src/lib/floor/deployment.test.ts src/lib/floor/yahoo-live.test.ts src/lib/floor/order-machine.test.ts

      - name: Floor app lint
        run: npx eslint src/routes/floor.tsx src/routes/floor-research.tsx src/components/daily-deployment-console.tsx src/components/order-state-machine.tsx src/lib/floor/account.ts src/lib/floor/account.test.ts src/lib/floor/deployment.ts src/lib/floor/deployment.test.ts src/lib/floor/yahoo-live.ts src/lib/floor/yahoo-live.test.ts src/lib/floor/order-machine.ts src/lib/floor/order-machine.test.ts

      - name: Development build
        run: npm run build:dev
