name: QQQ SPY Relative Range Convexity V1

on:
  push:
    branches:
      - research/qqq-spy-relative-range-convexity-v1-20261005
    paths:
      - research/qqq_spy_relative_range_convexity_v1.py
      - .github/workflows/qqq-spy-relative-range-convexity-v1.yml
  workflow_dispatch:

concurrency:
  group: qqq-spy-relative-range-convexity-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy

      - name: Download canonical option and underlying data
        run: |
          mkdir -p data artifacts/qqq_spy_relative_range_v1
          curl.exe -L --fail --retry 4 -o data/QQQ_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl.exe -L --fail --retry 4 -o data/SPY_options.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_options.parquet
          curl.exe -L --fail --retry 4 -o data/QQQ_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          curl.exe -L --fail --retry 4 -o data/SPY_underlying.parquet https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_underlying.parquet
          python -c "from pathlib import Path; print({p.name:p.stat().st_size for p in Path('data').glob('*.parquet')})"

      - name: Compile and run strict real-chain replay
        run: |
          python -m py_compile research/qqq_spy_relative_range_convexity_v1.py
          python research/qqq_spy_relative_range_convexity_v1.py --data-dir data --out artifacts/qqq_spy_relative_range_v1
          cat artifacts/qqq_spy_relative_range_v1/RESULTS.md

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-spy-relative-range-convexity-v1
          path: artifacts/qqq_spy_relative_range_v1/
          if-no-files-found: warn
