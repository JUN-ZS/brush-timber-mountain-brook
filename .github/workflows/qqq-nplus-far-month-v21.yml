name: QQQ N+ Far Month V21
on:
  push:
    branches: [research/qqq-nplus-far-month-v21-20260930]
    paths:
      - research/qqq_nplus_far_month_v21.py
      - .github/workflows/qqq-nplus-far-month-v21.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qqq-nplus-far-month-v21
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow numpy
      - name: Download canonical QQQ data-v1
        run: |
          mkdir -p data artifacts
          curl -L --fail --retry 3 -o data/QQQ_options.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet
          curl -L --fail --retry 3 -o data/QQQ_underlying.parquet \
            https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_underlying.parquet
          sha256sum data/QQQ_options.parquet data/QQQ_underlying.parquet
      - name: Run V21
        run: python research/qqq_nplus_far_month_v21.py --data-dir data --out artifacts
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qqq-nplus-far-month-v21
          path: |
            artifacts/v21_far_month_result.json
            artifacts/v21_far_month_summary.csv
          if-no-files-found: error
          continue-on-error: true
